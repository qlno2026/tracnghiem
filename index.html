  } else {
    h += '<div class="quiz-card" style="text-align:center;color:var(--green);font-size:var(--fs-sub)">🎉 Không có câu nào sai. Xuất sắc!</div>';
  }
  h += '<div style="height:20px"></div>';
  return h;
}

// ── NẠP CÂU HỎI TỪ EXCEL / CSV ──
function parseQuizCorrect(raw, optionTexts) {
  const v = String(raw == null ? '' : raw).trim();
  if (!v) return -1;
  const compact = quizNormBase(v).replace(/[^a-z0-9]/g, '');
  const letters = { a: 0, b: 1, c: 2, d: 3, e: 4, f: 5 };
  if (compact.length === 1 && letters[compact] !== undefined) return letters[compact];
  if (/^[1-6]$/.test(compact)) return parseInt(compact, 10) - 1;
  const target = quizText(v);
  for (let i = 0; i < optionTexts.length; i++) {
    if (quizText(optionTexts[i]) === target) return i;
  }
  return -1;
}

// Đọc sheet thành danh sách câu hỏi. Hỗ trợ 2 kiểu bảng:
//  (1) Bảng ngang  : mỗi dòng là 1 câu, có các cột đáp án A / B / C / D
//  (2) Bảng dọc    : cột "Phân Loại" đánh dấu Q (câu hỏi) / A (đáp án),
//                    cột "Đáp án đúng" đánh dấu X vào hàng đáp án đúng
// Dòng tiêu đề được tự tìm nên file có dòng tiêu đề bộ đề ở trên vẫn đọc được.
function parseQuizSheet(ws) {
  const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', blankrows: false });

  // Tìm dòng tiêu đề: dòng đầu tiên có ô "Câu hỏi" hoặc có từ 2 cột A/B/C/D
  let hIdx = -1;
  for (let i = 0; i < Math.min(aoa.length, 30); i++) {
    const keys = (aoa[i] || []).map(c => quizKey(c));
    if (keys.indexOf('cauhoi') >= 0) { hIdx = i; break; }
    if (keys.filter(k => k === 'a' || k === 'b' || k === 'c' || k === 'd').length >= 2) { hIdx = i; break; }
  }
  if (hIdx < 0) {
    return {
      questions: [], skipped: 0,
      reason: 'Không tìm thấy dòng tiêu đề. Cần một dòng có ô “Câu hỏi” (kèm các cột đáp án A, B, C, D), hoặc cột “Câu hỏi” cùng cột “Phân Loại” và “Đáp án đúng”.'
    };
  }

  const headers = (aoa[hIdx] || []).map(c => quizKey(c));
  const col = function() {
    for (let a = 0; a < arguments.length; a++) {
      const idx = headers.indexOf(quizKey(arguments[a]));
      if (idx >= 0) return idx;
    }
    return -1;
  };
  const iQ = col('CAU HOI', 'CAUHOI', 'NOI DUNG', 'NOIDUNG', 'QUESTION');
  const iType = col('PHAN LOAI', 'LOAI', 'TYPE', 'KY HIEU');
  const iGt = col('GIAI THICH', 'GIAITHICH', 'EXPLAIN', 'LY DO');
  const iOpts = [
    col('A', 'DAP AN A', 'DAPANA', 'LUA CHON A', 'OPTION A'),
    col('B', 'DAP AN B', 'DAPANB', 'LUA CHON B', 'OPTION B'),
    col('C', 'DAP AN C', 'DAPANC', 'LUA CHON C', 'OPTION C'),
    col('D', 'DAP AN D', 'DAPAND', 'LUA CHON D', 'OPTION D')
  ];
  const nOptCols = iOpts.filter(i => i >= 0).length;
  let iCorrect = col('DAP AN DUNG', 'DAPANDUNG', 'DAP AN', 'CORRECT', 'DAPAN');
  // Dự phòng: tên cột hơi khác (vd "Đáp án đún" do bị cắt) — lấy cột bắt đầu bằng "dapan"
  if (iCorrect < 0) {
    iCorrect = headers.findIndex((h, i) => h.indexOf('dapan') === 0 && iOpts.indexOf(i) < 0);
  }
  const cell = (r, i) => (i >= 0 && r[i] != null ? String(r[i]).trim() : '');
  const rows = aoa.slice(hIdx + 1);
  const questions = [];
  let skipped = 0;

  // (1) Bảng ngang — có các cột đáp án A, B, C, D
  if (nOptCols >= 2) {
    rows.forEach(r => {
      const text = cell(r, iQ);
      const options = iOpts.map(i => cell(r, i)).filter(Boolean);
      if (!text || options.length < 2) { skipped++; return; }
      const ci = parseQuizCorrect(cell(r, iCorrect), options);
      if (ci < 0 || ci >= options.length) { skipped++; return; }
      questions.push({ q: text, options: options, correct: ci, explain: cell(r, iGt) });
    });
    return { questions: questions, skipped: skipped };
  }

  if (iQ < 0) {
    return { questions: [], skipped: 0, reason: 'Không tìm thấy cột “Câu hỏi”.' };
  }
  if (iType < 0) {
    return {
      questions: [], skipped: 0,
      reason: 'Thiếu cột đáp án. Cần hoặc các cột A, B, C, D, hoặc cột “Phân Loại” (Q/A) kèm cột “Đáp án đúng” đánh dấu X.'
    };
  }

  // (2) Bảng dọc — cột Phân Loại quyết định hàng nào là câu hỏi, hàng nào là đáp án
  let cur = null;
  let noAnswerCount = 0;   // số câu bị bỏ vì không thấy dấu X ở cột đáp án đúng
  const flush = () => {
    if (cur && cur.q && cur.options.length >= 2 && cur.correct >= 0 && cur.correct < cur.options.length) {
      questions.push(cur);
    } else {
      skipped++;
      if (cur && cur.q && cur.options.length >= 2 && cur.correct < 0) noAnswerCount++;
    }
    cur = null;
  };
  rows.forEach(r => {
    const type = cell(r, iType).toLowerCase();
    const text = cell(r, iQ);
    if (!text) return;                                  // dòng trống thì bỏ qua
    const isQ = type === 'q' || type === 'ch' || quizKey(type).indexOf('cauhoi') === 0;
    const isA = !isQ && (type === 'a' || type === 'd' || quizKey(type).indexOf('dapan') === 0);
    if (isQ) {
      if (cur) flush();
      cur = { q: text, options: [], correct: -1, explain: cell(r, iGt) };
    } else if (isA) {
      if (!cur) return;                                 // đáp án mồ côi thì bỏ qua
      if (cell(r, iCorrect)) cur.correct = cur.options.length;   // có dấu X = đáp án đúng
      cur.options.push(text);
    }
    // các hàng khác (ghi chú, tiêu đề phụ...) bị bỏ qua
  });
  if (cur) flush();
  let reason = '';
  if (!questions.length) {
    if (iCorrect < 0) reason = 'Không tìm thấy cột “Đáp án đúng”. Cần một cột tên “Đáp án đúng” để biết đáp án nào đúng.';
    else if (noAnswerCount) reason = 'Không thấy dấu X ở cột “Đáp án đúng” cho câu nào. Hãy đánh dấu X vào hàng đáp án đúng.';
  }
  return { questions: questions, skipped: skipped, noAnswer: noAnswerCount, reason: reason };
}

function pickSetFiles() { document.getElementById('quizFileInput').click(); }
function pickSetDir() { document.getElementById('quizDirInput').click(); }

const EXCEL_EXT = /\.(xlsx|xls|csv)$/i;
const ZIP_EXT = /\.zip$/i;

// Điện thoại KHÔNG chọn được thư mục (thuộc tính `webkitdirectory` bị bỏ qua), nên
// người dùng nén cả thư mục thành MỘT file .zip rồi chọn file đó. Mở zip ra và biến
// từng file Excel bên trong thành một đối tượng File thật — nhờ vậy toàn bộ đường
// ống nạp file ở dưới (đọc, lọc, đặt tên, tạo bộ đề) chạy y hệt như khi chọn từng file.
// Bỏ qua thư mục rỗng, rác macOS (`__MACOSX/`, `._tên`) và file không phải Excel.
async function expandZip(zipFile) {
  if (typeof JSZip === 'undefined') {
    throw new Error('chưa tải được thư viện đọc ZIP — kiểm tra kết nối mạng rồi thử lại');
  }
  const zip = await JSZip.loadAsync(zipFile);
  const out = [];
  const paths = Object.keys(zip.files);
  for (let i = 0; i < paths.length; i++) {
    const path = paths[i];
    const entry = zip.files[path];
    if (!entry || entry.dir) continue;
    const base = path.split('/').pop();
    if (path.indexOf('__MACOSX/') >= 0 || base.charAt(0) === '.') continue;
    if (!EXCEL_EXT.test(base)) continue;
    const buf = await entry.async('arraybuffer');
    out.push(new File([buf], base, { type: 'application/octet-stream' }));
  }
  return out;
}

// Tách mọi file .zip trong danh sách chọn thành các file Excel bên trong.
// Trả về { files, failed, empty } để chỗ gọi báo được lý do khi zip không dùng được.
async function expandZips(list) {
  const files = [];
  const failed = [];
  let empty = 0;
  for (let i = 0; i < list.length; i++) {
    try {
      const inner = await expandZip(list[i]);
      if (!inner.length) { empty++; continue; }
      files.push.apply(files, inner);
    } catch (err) {
      failed.push(list[i].name + ' — ' + ((err && err.message) || err));
    }
  }
  return { files: files, failed: failed, empty: empty };
}

function readFileAsArrayBuffer(f) {
  return new Promise(function (resolve, reject) {
    const r = new FileReader();
    r.onload = function (e) { resolve(e.target.result); };
    r.onerror = function () { reject(new Error('không đọc được file')); };
    r.readAsArrayBuffer(f);
  });
}

function setNameFromFile(fileName) {
  const base = String(fileName || '').replace(/\.[^.]+$/, '').trim();
  return base || 'Bộ đề';
}

// Mỗi file thành một bộ đề. File trùng tên thì CẬP NHẬT lại nội dung bộ đề đó.
async function handleQuizImport(inp) {
  const all = Array.prototype.slice.call(inp.files || []);
  try { inp.value = ''; } catch (e) {}
  if (!all.length) return;
  if (typeof XLSX === 'undefined') {
    alert('Thư viện đọc Excel chưa được tải. Kiểm tra kết nối mạng rồi thử lại.');
    return;
  }
  // File .zip được mở ra trước, các file Excel bên trong nhập vào danh sách như vừa
  // được chọn trực tiếp (đây là đường nạp duy nhất dùng được trên điện thoại).
  const zips = all.filter(function (f) { return ZIP_EXT.test(f.name); });
  let expanded = { files: [], failed: [], empty: 0 };
  let fromZip = 0;
  if (zips.length) {
    expanded = await expandZips(zips);
    fromZip = expanded.files.length;
  }
  const plain = all.filter(function (f) { return !ZIP_EXT.test(f.name); });
  const pool = plain.concat(expanded.files);

  // Khi chọn cả thư mục, Chromium đưa mọi file vào (kể cả file tạm ~$ và file lạ)
  const files = pool.filter(function (f) {
    return EXCEL_EXT.test(f.name) && f.name.indexOf('~$') !== 0;
  });
  const skippedFiles = pool.length - files.length;
  if (!files.length) {
    let why = '';
    if (!pool.length && zips.length) {
      why = expanded.empty
        ? 'File .zip đang chọn không có file Excel/CSV nào bên trong (chỉ có thư mục, ảnh hoặc định dạng khác).'
        : 'Không đọc được file .zip đang chọn.';
    } else {
      why = skippedFiles
        ? 'Không thấy file Excel nào. Đã chọn ' + skippedFiles + ' file không phải .xlsx/.xls/.csv.'
        : 'Không có file nào được chọn.';
    }
    if (expanded.failed.length) why += '\n\nLỗi:\n• ' + expanded.failed.join('\n• ');
    alert(why);
    return;
  }

  let added = 0, updated = 0, qTotal = 0, skippedTotal = 0;
  const failed = [];
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    try {
      const buf = await readFileAsArrayBuffer(f);
      const wb = readWorkbook(buf, f.name);
      const ws = wb.Sheets[wb.SheetNames[0]];
      const parsed = parseQuizSheet(ws);
      if (!parsed.questions.length) throw new Error(parsed.reason || 'không đọc được câu hỏi nào');
      const name = setNameFromFile(f.name);
      const qs = parsed.questions.map(function (q) {
        return { id: quizNewId(), q: q.q, options: q.options, correct: q.correct, explain: q.explain || '' };
      });
      const same = quizLib.filter(function (s) { return s.name.trim().toLowerCase() === name.trim().toLowerCase(); })[0];
      if (same) { same.questions = qs; same.addedAt = Date.now(); updated++; }
      else { quizLib.push(normalizeSet({ name: name, questions: qs })); added++; }
      qTotal += qs.length;
      skippedTotal += parsed.skipped || 0;
    } catch (err) {
      failed.push(f.name + ' — ' + ((err && err.message) || err));
    }
  }

  saveLib();
  refreshMix();
  _quizMode = 'home';
  renderQuiz();

  let msg = 'Đã nạp ' + qTotal + ' câu từ ' + (added + updated) + '/' + files.length + ' file.';
  if (added) msg += '\n• ' + added + ' bộ đề mới';
  if (updated) msg += '\n• ' + updated + ' bộ đề cũ được cập nhật (file trùng tên, nội dung cũ bị thay)';
  if (skippedTotal) msg += '\n• bỏ qua ' + skippedTotal + ' dòng thiếu dữ liệu';
  if (skippedFiles) msg += '\n• bỏ qua ' + skippedFiles + ' file không phải Excel (hoặc file tạm ~$)';
  if (fromZip) msg += '\n• lấy từ ' + zips.length + ' file .zip: ' + fromZip + ' file Excel';
  if (expanded.empty) msg += '\n• ' + expanded.empty + ' file .zip không có file Excel nào bên trong';
  const allFailed = failed.concat(expanded.failed);
  if (allFailed.length) msg += '\n\nKhông đọc được ' + allFailed.length + ' file:\n• ' + allFailed.join('\n• ');
  alert(msg);
}

// ── SAO LƯU / PHỤC HỒI THƯ VIỆN ──────────────────────────────────────
// Cả thư viện nằm trong localStorage của một trình duyệt, xoá dữ liệu duyệt web
// là mất sạch. Bản sao lưu là một file JSON chứa đủ tên bộ đề + câu hỏi +
// đáp án + giải thích, phục hồi được trên máy khác.
const BACKUP_KIND = 'trac-nghiem-thu-vien';
const BACKUP_VERSION = 1;

function backupStamp() {
  const d = new Date();
  const p = function (n) { return String(n).padStart(2, '0'); };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate())
    + ' ' + p(d.getHours()) + 'h' + p(d.getMinutes()) + 'm' + p(d.getSeconds());
}

function exportLibrary() {
  if (!quizLib.length) { alert('Thư viện đang trống, không có gì để sao lưu.'); return; }
  const payload = {
    kind: BACKUP_KIND,
    version: BACKUP_VERSION,
    exportedAt: new Date().toISOString(),
    sets: quizLib.map(function (s) {
      return {
        name: s.name,
        addedAt: s.addedAt,
        questions: s.questions.map(function (q) {
          return { q: q.q, options: q.options.slice(), correct: q.correct, explain: q.explain || '' };
        })
      };
    })
  };
  const fname = 'trac-nghiem-thu-vien-' + backupStamp() + '.json';
  let url = '';
  try {
    const blob = new Blob([JSON.stringify(payload, null, 1)], { type: 'application/json' });
    url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fname; a.rel = 'noopener'; a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  } catch (e) {
    if (url) { try { URL.revokeObjectURL(url); } catch (e2) {} }
    alert('Không xuất được file: ' + ((e && e.message) || e));
    return;
  }
  setTimeout(function () { try { URL.revokeObjectURL(url); } catch (e) {} }, 60000);
  alert('Đã sao lưu ' + quizLib.length + ' bộ đề · ' + totalQuestions() + ' câu ra file:\n' + fname
    + '\n\nFile nằm ở thư mục Tải về (Downloads). Hãy chép nó sang USB / Google Drive / OneDrive để không mất khi xoá dữ liệu duyệt web hoặc đổi máy.');
}

function pickRestoreFile() { document.getElementById('quizRestoreInput').click(); }
function cancelRestore() { _restorePreview = null; _restoreConfirm = false; renderLibPanel(); }

function handleRestoreFile(inp) {
  const f = (inp.files || [])[0];
  try { inp.value = ''; } catch (e) {}
  if (!f) return;
  const reader = new FileReader();
  reader.onload = function (e) {
    let data = null;
    try { data = JSON.parse(String(e.target.result)); } catch (err) { data = null; }
    if (!data || typeof data !== 'object') {
      alert('File “' + f.name + '” không phải file sao lưu của app (không đọc được nội dung JSON).\nHãy chọn đúng file .json do nút “💾 Sao lưu ra file” tạo ra.');
      return;
    }
    // Chấp nhận cả file có vỏ { kind, sets } lẫn mảng bộ đề trần.
    const rawSets = Array.isArray(data.sets) ? data.sets : (Array.isArray(data) ? data : null);
    if (!rawSets) {
      alert('File “' + f.name + '” không có danh sách bộ đề.\nFile sao lưu đúng phải là .json do app tạo ra (không phải file Excel).');
      return;
    }
    const sets = rawSets.map(function (s) {
      return normalizeSet({
        name: (s && s.name) || 'Bộ đề',
        addedAt: (s && s.addedAt) || Date.now(),
        questions: (s && s.questions) || []
      });
    }).filter(function (s) { return s.questions.length; });
    if (!sets.length) { alert('File sao lưu không có câu hỏi nào đọc được.'); return; }

    let add = 0, update = 0, total = 0;
    sets.forEach(function (s) {
      total += s.questions.length;
      const same = quizLib.some(function (x) {
        return x.name.trim().toLowerCase() === s.name.trim().toLowerCase();
      });
      if (same) update++; else add++;
    });
    _restorePreview = { fileName: f.name, exportedAt: data.exportedAt || '', sets: sets, add: add, update: update, total: total };
    _restoreConfirm = false;
    openLibPanel();
  };
  reader.onerror = function () { alert('Không đọc được file “' + f.name + '”.'); };
  reader.readAsText(f);
}

/** Với bộ trùng tên khi THÊM VÀO: giữ nguyên bộ cũ, chỉ thay câu hỏi.
 *  Với bộ mới: tạo bộ mới mang mốc thời gian ghi trong file. */
function restoreCopyQuestions(src) {
  return src.questions.map(function (q) {
    return { id: quizNewId(), q: q.q, options: q.options.slice(), correct: q.correct, explain: q.explain || '' };
  });
}

// Thêm vào: bộ trùng tên thì cập nhật, bộ khác giữ nguyên — không mất gì.
function applyRestore() {
  if (!_restorePreview) return;
  let added = 0, updated = 0;
  _restorePreview.sets.forEach(function (src) {
    const name = src.name.trim() || 'Bộ đề';
    const same = quizLib.filter(function (x) {
      return x.name.trim().toLowerCase() === name.toLowerCase();
    })[0];
    // Giữ mốc thời gian trong file, để bảng thư viện vẫn hiện đúng ngày nhập gốc.
    if (same) { same.questions = restoreCopyQuestions(src); same.addedAt = src.addedAt || Date.now(); updated++; }
    else { quizLib.push(normalizeSet({ name: name, addedAt: src.addedAt || Date.now(), questions: restoreCopyQuestions(src) })); added++; }
  });
  const kept = quizLib.length - added - updated;
  _restorePreview = null; _restoreConfirm = false;
  saveLib(); refreshMix();
  _quizMode = 'home';
  renderLibPanel(); renderQuiz();
  alert('Đã phục hồi từ file:\n• ' + added + ' bộ đề mới\n• ' + updated + ' bộ đề được cập nhật'
    + (kept ? '\n• giữ nguyên ' + kept + ' bộ đề cũ không có trong file' : '')
    + '\n\nThư viện hiện có ' + quizLib.length + ' bộ đề · ' + totalQuestions() + ' câu.');
}

// Thay thế toàn bộ: bấm lần đầu chỉ hỏi lại, bấm lần hai mới xoá thật.
function applyRestoreReplace() {
  if (!_restorePreview) return;
  if (!_restoreConfirm) { _restoreConfirm = true; renderLibPanel(); return; }
  const removed = quizLib.length;
  quizLib = _restorePreview.sets.map(function (src) {
    return normalizeSet({
      name: src.name.trim() || 'Bộ đề',
      addedAt: src.addedAt,
      questions: restoreCopyQuestions(src)
    });
  });
  _restorePreview = null; _restoreConfirm = false;
  _libPending = null; _libSetId = null; _renamingSetId = null;
  saveLib(); refreshMix();
  _quizMode = 'home';
  renderLibPanel(); renderQuiz();
  alert('Đã thay thế toàn bộ thư viện:\n• xoá ' + removed + ' bộ đề cũ\n• nạp lại ' + quizLib.length
    + ' bộ đề · ' + totalQuestions() + ' câu từ file.');
}

function renderRestorePreview(body) {
  const r = _restorePreview;
  let h = '';
  h += '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0 4px">';
  h += '<div style="font-size:var(--fs-head);font-weight:var(--fw-ui)">📂 Phục hồi từ file</div>';
  h += '<button class="quiz-btn" style="padding:6px 10px" onclick="cancelRestore()" aria-label="Đóng">✕</button>';
  h += '</div>';
  h += `<div style="font-size:var(--fs-sub);font-weight:var(--fw-body);color:var(--text-dim);padding-bottom:4px;line-height:1.5">${esc(r.fileName)}</div>`;
  h += `<div style="font-size:var(--fs-sub);font-weight:var(--fw-body);color:var(--text-dim);padding-bottom:10px">Trong file: <b>${r.sets.length} bộ đề · ${r.total} câu</b>`
    + (r.exportedAt ? ' · sao lưu ' + fmtTime(Date.parse(r.exportedAt)) : '') + '</div>';
  h += `<div style="font-size:var(--fs-sub);font-weight:var(--fw-body);color:var(--text-dim);padding-bottom:10px;line-height:1.5">Thư viện hiện tại: ${quizLib.length} bộ · ${totalQuestions()} câu — trong đó <b style="color:var(--green)">${r.add} bộ mới</b> và <b style="color:var(--gold)">${r.update} bộ trùng tên sẽ được cập nhật nội dung</b>.</div>`;

  r.sets.forEach(function (s) {
    const same = quizLib.some(function (x) {
      return x.name.trim().toLowerCase() === s.name.trim().toLowerCase();
    });
    h += '<div class="arc-item" style="border:1px solid var(--border);border-radius:10px;padding:9px 10px;margin-bottom:6px;background:var(--card);display:flex;align-items:center;gap:8px">';
    h += '<div style="flex:1;min-width:0">';
    h += `<div style="font-size:var(--fs-base);font-weight:var(--fw-ui);line-height:1.35;white-space:normal" title="${esc(s.name)}">${esc(s.name)}</div>`;
    h += `<div style="font-size:var(--fs-sub);font-weight:var(--fw-body);color:var(--text-dim);margin-top:2px">${s.questions.length} câu</div>`;
    h += '</div>';
    h += same
      ? '<span style="font-size:12px;font-weight:700;color:var(--gold);flex-shrink:0">cập nhật</span>'
      : '<span style="font-size:12px;font-weight:700;color:var(--green);flex-shrink:0">mới</span>';
    h += '</div>';
  });

  h += '<div style="display:flex;gap:8px;flex-wrap:wrap;padding-top:8px">';
  h += `<button class="quiz-btn primary" onclick="applyRestore()">➕ Thêm ${r.add} bộ mới, cập nhật ${r.update} bộ</button>`;
  h += '</div>';
  h += '<div style="display:flex;gap:8px;flex-wrap:wrap;padding-top:8px">';
  if (_restoreConfirm) {
    h += `<button class="quiz-btn danger" onclick="applyRestoreReplace()">Xác nhận xoá ${quizLib.length} bộ cũ?</button>`;
    h += '<button class="quiz-btn" onclick="cancelRestore()">Hủy</button>';
  } else {
    h += '<button class="quiz-btn" onclick="applyRestoreReplace()">♻️ Thay thế toàn bộ (xoá thư viện hiện tại)</button>';
  }
  h += '</div>';
  if (_restoreConfirm) {
    h += `<div style="font-size:var(--fs-sub);font-weight:var(--fw-body);color:var(--red);padding-top:8px;line-height:1.5">Thao tác này xoá hết ${quizLib.length} bộ đề đang có và thay bằng ${r.sets.length} bộ trong file. Không khôi phục được.</div>`;
  }
  body.innerHTML = h;
}

// ── THƯ VIỆN BỘ ĐỀ (panel 📦) ─────────────────────────────────────────
function fmtTime(ts) {
  if (!ts) return '—';
  try {
    return new Date(ts).toLocaleString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  } catch (e) { return '—'; }
}

function openLibPanel() {
  _libPending = null; _renamingSetId = null;
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
  renderLibPanel();
}

function renderLibPanel() {
  const body = document.getElementById('modalBody');
  if (!body) return;
  if (_restorePreview) { renderRestorePreview(body); return; }
  let h = '';
  h += '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0 4px">';
  h += '<div style="font-size:var(--fs-head);font-weight:var(--fw-ui)">📦 Thư viện bộ đề</div>';
  h += '<button class="quiz-btn" style="padding:6px 10px" onclick="closeModalDirect()" aria-label="Đóng">✕</button>';
  h += '</div>';
  // Dấu bản app: chỉ có khi file được phục vụ/chế biến kèm `window.__APP_BUILD` (bản một-file
  // cho điện thoại, hoặc máy chủ Wi-Fi dán nhãn cho máy KHÁC). Nhờ nó mà nhìn là biết ngay
  // thiết bị đang chạy bản nào — xem run.md "Phone build". Không có thì dòng này y như cũ.
  const _buildNhan = window.__APP_BUILD ? ' · bản ' + window.__APP_BUILD : '';
  h += `<div style="font-size:var(--fs-sub);font-weight:var(--fw-body);color:var(--text-dim);padding-bottom:10px">${quizLib.length} bộ đề · ${totalQuestions()} câu hỏi${_buildNhan}</div>`;

  h += '<div style="display:flex;gap:8px;flex-wrap:wrap;padding-bottom:12px">';
  h += '<button class="quiz-btn primary" onclick="closeModalDirect(); pickSetFiles()">📥 Nạp hoặc nạp lại file bộ đề</button>';
  h += '<button class="quiz-btn" onclick="closeModalDirect(); pickSetDir()">📁 Nạp cả thư mục</button>';
  h += '</div>';

  // Sao lưu / phục hồi phải luôn bấm được, kể cả khi thư viện trống (máy mới).
  h += '<div style="display:flex;gap:8px;flex-wrap:wrap;padding-bottom:12px">';
  h += `<button class="quiz-btn"${quizLib.length ? '' : ' disabled'} onclick="exportLibrary()">💾 Sao lưu ra file</button>`;
  h += '<button class="quiz-btn" onclick="pickRestoreFile()">📂 Phục hồi từ file</button>';
  // 🔒 Đăng xuất nằm ở ĐÂY vì hàng này HIỆN TRONG MỌI NHÁNH của hàm này (kể cả thư viện rỗng —
  // nhánh đó `return` sớm nên không được đặt nút ở cuối), và hàng đã `flex-wrap` sẵn nên thêm
  // một nút không làm xê dịch gì. KHÔNG đưa nút này lên header: xem ghi chú cạnh `.header`.
  h += '<button class="quiz-btn" onclick="doLogout()" title="Khoá lại — lần sau mở phải nhập mật khẩu">🔒 Đăng xuất</button>';
  h += '</div>';

  if (!quizLib.length) {
    h += '<div style="padding:20px 0;text-align:center;color:var(--text-dim);font-size:var(--fs-sub);line-height:1.6">Thư viện đang trống.<br>Bấm “📥 Nạp hoặc nạp lại file bộ đề” (hoặc “📁 Nạp cả thư mục”).</div>';
    body.innerHTML = h;
    return;
  }

  quizLib.forEach(s => {
    h += '<div class="arc-item" style="border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--card)">';
    if (_renamingSetId === s.id) {
      h += '<div style="display:flex;gap:8px;flex-wrap:wrap">';
      h += `<input id="libRename" class="quiz-input" style="flex:1;min-width:120px" value="${esc(s.name)}" onkeydown="if(event.key==='Enter')renameSet('${s.id}')">`;
      h += `<button class="quiz-btn primary" onclick="renameSet('${s.id}')">Lưu</button>`;
      h += '<button class="quiz-btn" onclick="cancelRename()">Hủy</button>';
      h += '</div>';
      h += `<div style="font-size:var(--fs-sub);font-weight:var(--fw-body);color:var(--text-dim);margin-top:6px">${s.questions.length} câu</div>`;
    } else {
      h += '<div style="display:flex;align-items:center;gap:8px">';
      h += '<div style="flex:1;min-width:0">';
      h += `<div style="font-size:var(--fs-base);font-weight:var(--fw-ui);line-height:1.35;white-space:normal" title="${esc(s.name)}">${esc(s.name)}</div>`;
      h += `<div style="font-size:var(--fs-sub);font-weight:var(--fw-body);color:var(--text-dim);margin-top:2px">${s.questions.length} câu · thêm ${fmtTime(s.addedAt)}</div>`;
      h += '</div>';
      if (_libPending && _libPending.kind === 'del' && _libPending.setId === s.id) {
        h += `<button class="quiz-btn danger" onclick="deleteSet('${s.id}')">Xóa?</button>`;
        h += '<button class="quiz-btn" onclick="cancelLibPending()">Hủy</button>';
      } else {
        h += `<button class="quiz-btn" onclick="startRename('${s.id}')" title="Đổi tên">✏️</button>`;
        h += `<button class="quiz-btn" onclick="askDeleteSet('${s.id}')" title="Xoá bộ đề này">🗑</button>`;
      }
      h += '</div>';
      if (_libPending && _libPending.kind === 'del' && _libPending.setId === s.id) {
        h += `<div style="font-size:var(--fs-sub);font-weight:var(--fw-body);color:var(--gold);margin-top:6px">Xoá cả bộ ${s.questions.length} câu. Không khôi phục được.</div>`;
      }
    }
    h += '</div>';
  });

  h += '<div style="display:flex;gap:8px;flex-wrap:wrap;padding-top:4px">';
  if (_libPending && _libPending.kind === 'all') {
    h += `<button class="quiz-btn danger" onclick="clearLibrary()">Xác nhận xoá tất cả ${quizLib.length} bộ</button>`;
    h += '<button class="quiz-btn" onclick="cancelLibPending()">Hủy</button>';
  } else {
    h += '<button class="quiz-btn" onclick="askClearLibrary()">🗑 Xoá tất cả bộ đề</button>';
  }
  h += '</div>';
  body.innerHTML = h;
}

function startRename(id) { _renamingSetId = id; renderLibPanel(); }
function cancelRename() { _renamingSetId = null; renderLibPanel(); }
function renameSet(id) {
  const s = libSet(id);
  if (!s) return;
  const el = document.getElementById('libRename');
  const v = ((el && el.value) || '').trim();
  if (!v) { alert('Tên bộ đề không được để trống.'); return; }
  s.name = v;
  _renamingSetId = null;
  saveLib(); renderLibPanel(); renderQuiz();
}

function askDeleteSet(id) { _libPending = { kind: 'del', setId: id }; renderLibPanel(); }
function cancelLibPending() {
  _libPending = null;
  const modal = document.getElementById('modal');
  if (modal && modal.classList.contains('open')) renderLibPanel();
  renderQuiz();
}
function deleteSet(id) {
  quizLib = quizLib.filter(s => s.id !== id);
  if (_libSetId === id) _libSetId = null;
  _libPending = null;
  saveLib(); refreshMix();
  renderLibPanel(); renderQuiz();
}
function askClearLibrary() { _libPending = { kind: 'all' }; renderLibPanel(); }
function clearLibrary() {
  quizLib = []; _libSetId = null;
  _libPending = null; _renamingSetId = null;
  saveLib(); refreshMix();
  renderLibPanel(); renderQuiz();
}

// ── HỌC BÀI: mọi câu trên một màn, chọn sai thì chọn lại ─────────────
function quizStudyHtml() {
  const st = _quizState;
  if (!st || !st.items.length) return '<div class="quiz-card">Không có câu hỏi.</div>';
  const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
  let h = '<div class="quiz-card quiz-all-head">';
  h += '<div class="head-row">';
  h += `<div style="flex:1;min-width:0;font-size:var(--fs-base);font-weight:var(--fw-ui)">📖 ${st.title ? esc(st.title) : 'Học bài'} · ${st.items.length} câu</div>`;
  h += homeBtnHtml();
  h += '</div>';
  h += '<div id="studySummary" style="font-size:var(--fs-sub);font-weight:var(--fw-body);color:var(--text-dim);margin-top:3px"></div>';
  h += '</div>';

  st.items.forEach((it, qi) => {
    h += `<div class="quiz-card" id="qb-${qi}">`;
    h += qTextHtml(esc(it.q), 'color:var(--q-text);font-size:var(--fs-lead);font-weight:var(--fw-head);line-height:1.5;margin-bottom:8px', qi + 1);
    it.opts.forEach((o, oi) => {
      const tried = it.tried.indexOf(oi) >= 0;
      let cls = 'quiz-opt';
      let mark = '';
      if (it.done && o.ok) { cls += ' correct'; mark = '<span class="mark">✅</span>'; }
      else if (tried) { cls += ' wrong'; mark = '<span class="mark">❌</span>'; }
      h += `<button class="${cls}" id="qo-${qi}-${oi}"${it.done ? ' disabled' : ''} onclick="studyPick(${qi},${oi})">`;
      h += `<span class="quiz-badge">${letters[oi]}</span><span style="flex:1">${esc(o.t)}</span>${mark}`;
      h += '</button>';
    });
    let fbCls = 'quiz-fb';
    let fbTxt = '';
    if (it.done) {
      // Hộp xanh cũng bỏ (19/9/2026 — "bỏ luôn ô này"): chỉ còn một dòng chữ xanh, không nền/viền.
      // Giữ lại CÂU CHỮ vì đây là chế độ HỌC — nó nói câu này đã xong và đã sai mấy lần, đúng
      // thứ mà bảng tổng kết của chế độ này đang đếm.
      fbCls += ' show plain';
      fbTxt = '<span style="color:var(--green)">' + (it.wrongFirst
        ? '✅ Đúng rồi! — câu này bạn đã chọn sai ' + it.tried.length + ' lần trước khi đúng.'
        : '✅ Chính xác ngay lần đầu!') + '</span>';
      if (it.explain) fbTxt += '<div style="margin-top:5px;color:var(--text-dim)">💡 ' + esc(it.explain) + '</div>';
    } else if (it.tried.length) {
      // Chế độ HỌC: chọn sai vẫn phải có LỜI NHẮC chọn lại (đó là toàn bộ ý nghĩa của mục
      // "Học"), nhưng không còn HỘP đỏ "Chưa đúng" — chỉ một dòng chữ mờ, không nền/viền.
      fbCls += ' show plain';
      fbTxt = 'Đáp án này chưa đúng, chọn lại nhé.';
    }
    h += `<div class="${fbCls}" id="qfb-${qi}">${fbTxt}</div>`;
    h += '</div>';
  });

  h += '<div class="quiz-card" style="text-align:center">';
  h += '<button class="big-upload-btn" style="width:100%" onclick="finishQuiz()">🏁 Xem kết quả</button>';
  h += '<div style="margin-top:8px"><button class="quiz-btn" onclick="quitQuiz()">Thoát</button></div>';
  h += '</div>';
  return h;
}

function updateStudySummary() {
  const st = _quizState;
  const el = document.getElementById('studySummary');
  if (!st || !el) return;
  const done = st.items.filter(x => x.done).length;
  el.innerHTML = `Đã xong <b>${done}</b>/${st.items.length} · `
    + `Đúng ngay lần đầu <b style="color:var(--green)">${st.score}</b> · `
    + `Phải chọn lại <b style="color:var(--red-text)">${st.wrong.length}</b>`;
}

function studyPick(qi, oi) {
  const st = _quizState;
  if (!st) return;
  const it = st.items[qi];
  if (!it || it.done || !it.opts[oi]) return;
  if (it.tried.indexOf(oi) >= 0) return;          // ô này đã thử rồi

  if (it.opts[oi].ok) {
    it.done = true;
    if (!it.wrongFirst) st.score++;
  } else {
    it.tried.push(oi);
    if (!it.wrongFirst) {
      it.wrongFirst = true;
      const right = it.opts.filter(o => o.ok)[0];
      st.wrong.push({ q: it.q, chosen: it.opts[oi].t, correct: right ? right.t : '—', explain: it.explain });
    }
  }

  // Cập nhật ngay tại chỗ để không mất vị trí cuộn
  it.opts.forEach((o, i) => {
    const btn = document.getElementById('qo-' + qi + '-' + i);
    if (!btn) return;
    const tried = it.tried.indexOf(i) >= 0;
    btn.className = 'quiz-opt' + ((it.done && o.ok) ? ' correct' : (tried ? ' wrong' : ''));
    btn.disabled = !!it.done;
    const old = btn.querySelector('.mark');
    if (old) old.parentNode.removeChild(old);
    const mark = (it.done && o.ok) ? '✅' : (tried ? '❌' : '');
    if (mark) btn.insertAdjacentHTML('beforeend', '<span class="mark">' + mark + '</span>');
  });

  const fb = document.getElementById('qfb-' + qi);
  if (fb) {
    if (it.done) {
      fb.className = 'quiz-fb show plain';
      let s = '<span style="color:var(--green)">' + (it.wrongFirst
        ? '✅ Đúng rồi! — câu này bạn đã chọn sai ' + it.tried.length + ' lần trước khi đúng.'
        : '✅ Chính xác ngay lần đầu!') + '</span>';
      if (it.explain) s += '<div style="margin-top:5px;color:var(--text-dim)">💡 ' + esc(it.explain) + '</div>';
      fb.innerHTML = s;
    } else {
      fb.className = 'quiz-fb show plain';
      fb.innerHTML = 'Đáp án này chưa đúng, chọn lại nhé.';
    }
  }
  updateStudySummary();
}

// ── ĐĂNG NHẬP ──────────────────────────
// Mật khẩu KHÔNG nằm trong tệp dạng chữ — chỉ có mã băm SHA-256 dưới đây. Đổi mật khẩu bằng:
//   python .freebuff/_set_password.py "mật khẩu mới"
// (script đó tính lại mã băm và cập nhật ĐÚNG dòng dưới, rồi sinh lại các bản build).
const AUTH_KEY = 'qlno_auth';   // ghi nhớ "đã đăng nhập" — giá trị lưu CHÍNH LÀ mã băm PASS_HASH
const PASS_HASH = '1d28c120568c10e19b9d8abe8b66d0983fa3d2e11ee7751aca50f83c6f4a43aa';

// SHA-256 viết THUẦN JS, không dùng `crypto.subtle` — LÝ DO QUYẾT ĐỊNH, đừng "tối ưu" lại:
// `crypto.subtle` CHỈ có trong secure context. App này còn được phục vụ qua
// `http://192.168.1.4:8080` (điện thoại trong Wi-Fi) và qua `file://` (bản chép vào máy), mà hai
// nơi đó `crypto.subtle` là `undefined` — dùng nó thì ĐIỆN THOẠI KHÔNG ĐĂNG NHẬP ĐƯỢC, trong khi
// máy tính (127.0.0.1 = secure context) vẫn vào bình thường: một lỗi chỉ hiện ra ở thiết bị
// người dùng đang dùng thật. `TextEncoder` và phép cộng bit thì ở đâu cũng có.
// Lưu ý: mật khẩu qua `_sha256Hex` được mã hoá UTF-8 nên tiếng Việt có dấu vẫn đúng.
function _rotr(x, n) { return ((x >>> n) | (x << (32 - n))) >>> 0; }
function _sha256Hex(str) {
  const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
             0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
             0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
             0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
             0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
             0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
             0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
             0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const bytes = new TextEncoder().encode(str);
  const bitLen = bytes.length * 8;
  // Đệm: 0x80, rồi các số 0, rồi 8 byte ĐỘ DÀI bit (kiểu big-endian). Công thức `(len + 8) >> 6`
  // (KHÔNG phải `len + 9`) là thứ cho ra khối NGẮN NHẤT hợp lệ: với len = 55 thì đúng 64 byte;
  // viết sai chỗ này thì mã băm vẫn ra một số hợp lệ nhưng SAI — lỗi im lặng.
  const buf = new Uint8Array((((bytes.length + 8) >> 6) + 1) << 6);
  buf.set(bytes);
  buf[bytes.length] = 0x80;
  buf[buf.length - 4] = (bitLen >>> 24) & 0xff;
  buf[buf.length - 3] = (bitLen >>> 16) & 0xff;
  buf[buf.length - 2] = (bitLen >>> 8) & 0xff;
  buf[buf.length - 1] = bitLen & 0xff;
  let H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const w = new Uint32Array(64);
  for (let i = 0; i < buf.length; i += 64) {
    for (let t = 0; t < 16; t++) {
      w[t] = (buf[i + t * 4] << 24) | (buf[i + t * 4 + 1] << 16) | (buf[i + t * 4 + 2] << 8) | buf[i + t * 4 + 3];
    }
    for (let t = 16; t < 64; t++) {
      const s0 = _rotr(w[t - 15], 7) ^ _rotr(w[t - 15], 18) ^ (w[t - 15] >>> 3);
      const s1 = _rotr(w[t - 2], 17) ^ _rotr(w[t - 2], 19) ^ (w[t - 2] >>> 10);
      w[t] = (w[t - 16] + s0 + w[t - 7] + s1) >>> 0;
    }
    let [a, b, c, d, e, f, g, h] = H;
    for (let t = 0; t < 64; t++) {
      const S1 = _rotr(e, 6) ^ _rotr(e, 11) ^ _rotr(e, 25);
      const ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + K[t] + w[t]) >>> 0;
      const S0 = _rotr(a, 2) ^ _rotr(a, 13) ^ _rotr(a, 22);
      const maj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + maj) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0;
      d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    H = [(H[0] + a) >>> 0, (H[1] + b) >>> 0, (H[2] + c) >>> 0, (H[3] + d) >>> 0,
         (H[4] + e) >>> 0, (H[5] + f) >>> 0, (H[6] + g) >>> 0, (H[7] + h) >>> 0];
  }
  return H.map(x => x.toString(16).padStart(8, '0')).join('');
}

function isAuthed() {
  try { return localStorage.getItem(AUTH_KEY) === PASS_HASH; } catch (e) { return false; }
}
function showGate(msg) {
  const gate = document.getElementById('loginGate');
  if (!gate) return;
  gate.style.display = 'flex';
  document.body.style.overflow = 'hidden';
  const box = document.getElementById('loginMsg');
  if (box) box.textContent = msg || '';
  const inp = document.getElementById('loginPass');
  if (inp) {
    inp.value = '';
    // Chờ một nhịp cho màn hình hiện ra rồi mới focus — gọi ngay trong cùng lượt render thì
    // trên điện thoại bàn phím ảo đôi khi không mở.
    setTimeout(() => { try { inp.focus(); } catch (e) {} }, 60);
  }
}
function hideGate() {
  const gate = document.getElementById('loginGate');
  if (gate) gate.style.display = 'none';
  document.body.style.overflow = '';
  // Xoá cả chữ báo lỗi LẪN mật khẩu vừa gõ: nếu để lại, lần sau mở lại app chữ “Mật khẩu không
  // đúng.” của lần gõ sai trước đó vẫn nằm đó (DOM không tự xoá), và mật khẩu thì còn nguyên
  // trong ô — cả hai đều vô tình lộ ra cho người đứng cạnh.
  const box = document.getElementById('loginMsg');
  if (box) box.textContent = '';
  const inp = document.getElementById('loginPass');
  if (inp) inp.value = '';
}
function doLogin() {
  const inp = document.getElementById('loginPass');
  if (!inp) return;
  if (!inp.value) { showGate('Chưa nhập mật khẩu.'); return; }
  let ok = false;
  try { ok = _sha256Hex(inp.value) === PASS_HASH; } catch (e) { ok = false; }
  if (!ok) { showGate('Mật khẩu không đúng.'); return; }
  try { localStorage.setItem(AUTH_KEY, PASS_HASH); } catch (e) {}
  hideGate();
  bootApp();
}
// Đăng xuất: xoá dấu đã đăng nhập RỒI tải lại trang — tải lại là cách chắc chắn nhất để mọi
// trạng thái trong RAM (thư viện đã nạp, bài đang làm, màn đang xem) trở về như lúc mới mở.
function doLogout() {
  try { localStorage.removeItem(AUTH_KEY); } catch (e) {}
  location.reload();
}

// ── KHỞI ĐỘNG ──────────────────────────
function bootApp() {
  loadLib();
  refreshMix();   // = resetMixDefaults() + ghép lại tỷ lệ trộn đã lưu trong máy
  renderQuiz();
  // Nút ✕ của thanh tìm kiếm: khi tải lại trang, Chrome có thể KHÔI PHỤC nội dung ô tìm kiếm (khôi
  // phục trạng thái form) mà KHÔNG bắn sự kiện `input` — nên nếu chỉ dựa vào `onSearch()` thì chữ có
  // sẵn mà nút ✕ vẫn ẩn, phải gõ thêm một ký tự mới hiện ra. Gọi một lần ở đây là đủ và rẻ.
  paintSearchClear();
}
// Màn đăng nhập đã HIỆN SẴN trong HTML, nên đường đi bình thường là: đã đăng nhập thì ẩn đi và
// dựng app. CHƯA đăng nhập thì KHÔNG gọi `bootApp()` — nội dung không được dựng vào DOM chút nào,
// chứ không phải dựng rồi che. Nhờ vậy kể cả đọc DOM cũng không thấy câu hỏi nào khi chưa vào.
if (isAuthed()) { hideGate(); bootApp(); } else { showGate(''); }

</script>
