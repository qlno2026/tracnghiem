                          trên tấm MỚI con số là **4.88:1 — VẪN vượt ngưỡng 4.5:1**, nên giữ nguyên
                          màu chữ này, KHÔNG phải chỉnh lại màu chữ lần nào nữa.
                          Chữ câu hỏi cùng tấm mới là 12.28:1 nên vẫn cách xa.
                          Thang sáng dần trên tấm MỚI: #77879c 4.13 · #7d8ea3 4.52 ·
                          #8394a9 4.88 (dùng) · #8b9bb0 5.34 · #94a3b8 5.90. */
  --q-text: #e2e8f0;   /* chữ CÂU HỎI: sáng ở chế độ tối. Ở chế độ sáng là #1f2937 (xám RẤT ĐẬM) —
                          đã đi qua hai nấc theo yêu cầu: đen mặc định → xanh dương đậm #1e3a8a →
                          xám đậm #1f2937. Muốn đậm hơn nữa thì dùng #111827 (xám 900). */
  --set-box-bg: #262626;   /* nền hộp từng bộ đề — xám THUẦN ĐẬM ở chế độ tối (đổi từ #262a33
                              cùng lượt với --navy #171717 và tấm đáp án #262626, 19/9/2026),
                              xám nhạt ở chế độ sáng (body.light-mode đè lại) */
  --border: rgba(255,255,255,0.22);   /* viền ô ở chế độ tối: rõ hơn 0.08 cũ */
  /* Viền nút GHIM (📌) — XANH DƯƠNG, tách hẳn khỏi viền xám `--border` của mọi ô khác
     (19/9/2026 — "tôi muốn có viền xanh dương đậm ở nút ghim").
     Chế độ tối #3b82f6: **4,43:1** trên thẻ #202020, và đúng sắc xanh app đã dùng cho nền chip
     đang bật. KHÔNG dùng #1d4ed8 ở đây dù đó là "xanh dương đậm" theo tên: trên thẻ #202020 nó
     chỉ đạt **2,43:1**, gần bằng viền xám cũ (2,05:1) nên gần như không thấy.
     Chế độ sáng dùng #1d4ed8 (6,70:1 trên nền trắng) — xem `body.light-mode` ở cuối tệp.
     Dùng BIẾN chứ không viết luật `body.light-mode .mix-lock` riêng: luật đó có độ ưu tiên
     (0,2,1) nên sẽ đè mất cả `.mix-lock:hover` (0,2,0) ở chế độ sáng — mất luôn dấu khi trỏ chuột. */
  --pin-brd: #3b82f6;
  --card: rgba(255,255,255,0.04);
  --radius: 12px;
  --header-h: 56px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Inter', sans-serif;
  font-size: 17px;   /* nền chung cho chữ không tự đặt cỡ, khớp mức +1px của cả app */
  background: var(--navy);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
  touch-action: manipulation;
  transition: background 0.4s ease, color 0.4s ease;
}

/* ── HEADER ───────────────────────── */
.header {
  background:
    linear-gradient(135deg, rgba(255,255,255,0.14), rgba(255,255,255,0) 40%),
    linear-gradient(135deg, #1d4ed8, #1e3a8a);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 3px 10px rgba(0,0,0,0.35);
  height: calc(var(--header-h) + env(safe-area-inset-top, 0px));
  padding: env(safe-area-inset-top, 0px) 10px 0 8px;
  display: flex;
  align-items: center;
  gap: 12px;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 200;
}
.header-left { display: flex; align-items: center; gap: 6px; min-width: 0; }
.title-wrap { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
.header-title { font-size: 17px; font-weight: 500; letter-spacing: 0.3px; color: #ffffff; white-space: nowrap; }
.header-sub { font-size: 15px; font-weight: 400; color: #cbd5e1; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
.header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.theme-toggle {
  width: 44px; height: 44px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  position: relative;
  padding: 0;
  background: transparent;
  flex-shrink: 0;
}
.theme-toggle img {
  width: 100%; height: 100%;
  border-radius: 50%; object-fit: contain; display: block;
}
.theme-toggle:active { transform: scale(0.9); }

.upload-btn-header {
  background: transparent; color: #ffffff; border: none;
  padding: 6px 10px; border-radius: 8px;
  cursor: pointer; display: flex; flex-direction: column;
  align-items: center; line-height: 1.1; gap: 0;
  font-family: 'Inter', sans-serif; flex-shrink: 0;
}
.upload-btn-header:active { background: rgba(203,213,225,0.4); }

/* ── MAIN ───────────────────────── */
.main { padding: 0 8px 60px; }

/* ── BUTTONS ───────────────────────── */
.big-upload-btn {
  padding: 12px 18px;
  border: none;
  border-radius: 10px;
  background: var(--accent);
  color: #ffffff;
  font-family: 'Inter', sans-serif;
  font-size: 17px;
  font-weight: 500;
  cursor: pointer;
}
.big-upload-btn:active { opacity: 0.9; }
.big-upload-btn:disabled { opacity: 0.45; cursor: not-allowed; }

.quiz-btn {
  padding: 9px 12px; border-radius: 9px; cursor: pointer;
  border: 1px solid var(--border); background: var(--navy-mid); color: var(--text);
  font-family: 'Inter', sans-serif; font-size: 17px; font-weight: 500;
}
.quiz-btn.primary { background: var(--accent); color: #ffffff; border-color: var(--accent); }
.quiz-btn.danger { background: var(--red); color: #ffffff; border-color: var(--red); }
.quiz-btn:active { opacity: 0.85; }
/* Nút điều hướng "Câu trước" bị TẮT ở câu đầu tiên (19/9/2026). Trước lượt này app chưa hề có
   nút .quiz-btn nào bị tắt, nên không có luật :disabled nào — thiếu nó thì nút trông y như bấm
   được, người dùng bấm mãi mà không hiểu sao không chạy. */
.quiz-btn:disabled { opacity: 0.45; cursor: default; }
/* Nút làm bài ĐANG ĐƯỢC CHỌN (focus) — đây là giá trị của CHẾ ĐỘ TỐI.
   Lịch sử trong ngày 19/9/2026: `.quiz-btn` trước đó KHÔNG hề có luật :focus nào, nên trình duyệt
   tự vẽ vòng focus mặc định (viền xám/đen) — và trên điện thoại `:focus` DÍNH LẠI sau khi chạm,
   nên nút vừa bấm mang một viền lạ cho tới khi chạm chỗ khác.
     → lượt 1: dùng `--accent` (#1d4ed8, xanh dương đậm) theo yêu cầu "khi chọn thì viền có màu
       xanh dương đậm". Đo ra ở tối chỉ **2,43:1** trên nền nút `#202020`.
     → lượt 2 (đang dùng): ở TỐI đổi sang `--accent-glow` (#60a5fa) — **6,41:1** trên cùng nền,
       gần gấp ba. Xanh dương đậm trên nền tối là thứ khó thấy về bản chất, không phải lỗi chọn nấc.
   Ở chế độ SÁNG vẫn giữ `--accent` — xem khối `body.light-mode .quiz-btn:focus` bên dưới.
   Vì cả hai chế độ giờ chỉ có MỘT màu focus cho mọi nút, luật riêng cho `.primary`/`.danger`
   ở chế độ tối đã bị xoá (nó trùng giá trị, để lại chỉ thành mã chết). Chế độ sáng VẪN cần luật
   riêng vì ở đó nút thường dùng màu đậm còn nút đặc dùng màu sáng.
   `outline: none` là BẮT BUỘC: không có nó thì vòng mặc định vẫn vẽ thêm một lớp nữa. */
.quiz-btn:focus { outline: none; border-color: var(--accent-glow); }

.quiz-toggle {
  padding: 7px 10px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--border); background: transparent; color: var(--text-dim);
  font-family: 'Inter', sans-serif; font-size: 17px; font-weight: 500;
}
/* Chip ĐANG BẬT — ĐẬM HƠN (19/9/2026 — "tôi muốn khi chọn có màu đậm hơn").
   Lịch sử: nền 0,14 → **0,32**, viền `--accent` (#1d4ed8, chỉ 2,43:1 trên thẻ #202020 — gần như
   chìm) → **`--accent-glow` #60a5fa (6,41:1)**, chữ `--accent-glow` → **TRẮNG #ffffff (10,5:1**
   trên nền đã pha ở alpha 0,32). Chữ trắng + nền xanh là đúng kiểu "ô đang chọn" app đã dùng ở
   `.quiz-btn.primary` và `.set-dd-item.on`.
   KHÔNG nâng alpha lên nữa nếu vẫn muốn chữ `--accent-glow`: ở alpha ≈ 0,28 chữ #60a5fa tụt xuống
   4,40:1 (dưới ngưỡng 4,5:1) — muốn nền đậm hơn nữa thì phải đi cùng chữ TRẮNG, đừng đổi lẻ. */
.quiz-toggle.on { background: rgba(59,130,246,0.32); border-color: var(--accent-glow); color: #ffffff; }

/* Hai chip bật/tắt trên trang chủ nằm CHUNG MỘT HÀNG.
   Đo bằng canvas ở cỡ 17px: “Đảo câu hỏi” 96.3px, “Đảo đáp án” 92.2px. Cộng
   padding 8px mỗi bên và gap 8px thì cần 228.5px — vừa khung nhìn 311px (thẻ
   rộng 266px). Bản cũ “Đảo câu hỏi: Bật” + “Đảo đáp án: Bật” cần 309px nên mỗi
   cái phải xuống một hàng; thêm icon 🔀 còn tốn thêm ~56px nữa.
   `auto-fit` + `minmax(120px, 1fr)` cho hai cột BẰNG NHAU khi đủ chỗ, và tự dồn
   thành một cột khi cửa sổ hẹp hơn ~248px — không bao giờ tràn chữ. */
.chip-row {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 8px; margin-top: 8px;
}
.quiz-toggle.chip { padding: 7px 8px; text-align: center; }

/* Hàng nút thư viện trên trang chủ — KHÔNG còn dùng ở trang chủ từ 19/9/2026 (nút 📦 đã chuyển
   vào hàng `.lib-head`, xem ngay dưới). Giữ lại lớp này vì lịch sử lớp `.lib-act` gắn với nó;
   đừng “khôi phục” bằng cách bọc nút vào `.lib-act-row` trở lại.
   Trước 18/9/2026 hàng này có BA nút (Chọn file /
   Thư mục / Thư viện) và phải đo bằng canvas ở cửa sổ 311px mới vừa: cả ba nhãn đầy
   đủ cần 294px trong khi thẻ chỉ có 265px, nên nhãn phải rút ngắn và thử cả
   `flex: 1 1 0` (làm "Chọn thư mục" bị bẻ 3 dòng). Hai nút đầu đã bỏ theo yêu cầu —
   còn đúng một nút mở bảng 📦, `.lib-act` bên dưới giờ chỉ giữ cỡ nút ổn định.
   `flex: 1 1 auto` (không phải `1 1 0`) để bề ngang thả theo nội dung; `flex-wrap:
   wrap` là lưới an toàn cho cửa sổ hẹp hơn nữa — nút cuối xuống hàng dưới chứ
   KHÔNG bị cắt chữ (đừng dùng `white-space: nowrap`: nó tràn chữ ra ngoài nút
   ngay khi flex phải co lại).
   Không emoji trong ba nhãn: “📁 ” chiếm 28px, đủ đẩy tổng vượt 265px.
   `width:auto` để thắng `width:100%` của .big-upload-btn, và lớp này đặt sau nên
   đè được padding 12px 18px của nút đó. */
.lib-act {
  flex: 1 1 auto; min-width: 0; width: auto;
  padding: 9px 5px;
  text-align: center;
}
.lib-act-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
/* Nút 📦 nằm KẾ tiêu đề "📚 Thư viện bộ đề" (19/9/2026 — "tôi muốn tab thư viện nằm kế thư viện
   bộ đề"): trước đó nút chiếm TRỌN một hàng riêng bên dưới hai dòng chữ, làm thẻ cao thêm ~53px.
   Giờ hai dòng chữ và nút nằm trong CÙNG một hàng flex: chữ bên trái, nút bên phải.
   `min-width: 0` trên khối chữ là BẮT BUỘC — thiếu nó thì cột chữ không chịu co, nó đẩy nút tràn
   ra ngoài thẻ khi dòng "18 bộ đề · 643 câu hỏi" dài ra. */
.lib-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.lib-head-text { min-width: 0; }
/* Nút trong hàng này chỉ rộng bằng nội dung: `.lib-act` gốc có `flex: 1 1 auto` (để nó lấp đầy
   hàng khi đứng một mình) nên phải tắt dãn ở đây. Lề ngang 18px → 11px cho vừa hàng hẹp; chiều
   cao giữ 12px trên/dưới của `.big-upload-btn` để nút cao ≈ 45px, đúng bằng hai dòng chữ cạnh nó. */
.lib-head .lib-act { flex: 0 0 auto; padding: 12px 11px; }

/* ── QUIZ ───────────────────────── */
/* Lề giữa các bảng trên trang chủ, siết 19/9/2026 ("khoảng cách các bảng này nhỏ lại"):
   chủ yếu là PADDING chứ không phải margin — nhìn vào khe giữa hai thẻ là thấy 10px lề
   trong + 5px margin + 10px lề trong, nên chỉ hạ margin thì gần như không đổi. Đây là chỗ
   NGƯỢC với thanh dính (thanh dính siết để đỡ che nội dung, còn ở đây chỉ để đỡ trống). */
.quiz-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 10px; margin: 5px 0;
}
.quiz-input {
  width: 100%; padding: 10px; border-radius: 10px;
  border: 1.5px solid var(--border); background: var(--navy-mid);
  color: var(--text); font-family: 'Inter', sans-serif; font-size: 17px; font-weight: 500;
}
.quiz-input:focus { outline: none; border-color: var(--accent); }
/* ── DROPDOWN CHỌN BỘ ĐỀ: TỰ VẼ (19/9/2026) ───────────────────────────────────────
   TRƯỚC ĐÂY LÀ `<select>` GỐC. Lý do đổi: người dùng muốn "thêm kẻ ngang chia các hàng" trong
   danh sách, nhưng bảng xổ xuống của `<select>` do TRÌNH DUYỆT vẽ nên KHÔNG nhận CSS của trang —
   không có cách nào đặt kẻ giữa các `<option>`. Ô chọn giờ là `<button>` + danh sách `<button>`.
   Kích thước giữ Y HỆT ô select cũ (nó vốn lấy từ `.quiz-input`: padding 10px, radius 10px,
   border 1,5px) nên thẻ không nhảy bố cục.
   Viền XANH DƯƠNG NEON (yêu cầu 19/9/2026) giữ nguyên: hai lần viền — 1px lằn ngoài + quầng toả —
   cho cảm giác dày mà KHÔNG phải tăng border-width (tăng border sẽ nhảy bố cục 0,5px).
   Chế độ SÁNG dùng xanh ĐẬM hơn (#0ea5e9): #38bdf8 gần như tan trên nền trắng, còn #0ea5e9 lại
   quá tối trên nền tối để gọi là neon. */
.set-dd { position: relative; }
.set-dd-btn {
  width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  text-align: left; cursor: pointer;
  padding: 10px; border-radius: 10px; border: 1.5px solid #38bdf8;
  background: var(--navy-mid); color: var(--text);
  /* Cỡ 17px (19/9/2026 — "tôi muốn tất cả chữ này cỡ 17px", ảnh người dùng khoanh cả nút
     dropdown). Trước đó 15px (bản gốc) → 16px (một lượt trước trong ngày) → 17px. */
  font-family: 'Inter', sans-serif; font-size: 17px; font-weight: 500;
  box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.55), 0 0 10px rgba(56, 189, 248, 0.45);
  transition: border-color 0.15s, box-shadow 0.15s;
}
.set-dd-btn:hover, .set-dd-btn:focus {
  outline: none; border-color: #7dd3fc;
  box-shadow: 0 0 0 1px rgba(125, 211, 252, 0.85), 0 0 15px rgba(56, 189, 248, 0.65);
}
/* Nhóm NHÃN + ICON của nút mở (19/9/2026 — "tôi muốn có icon ở bảng này"). Bọc trong một
   flex con vì nút dùng `justify-content: space-between`: không bọc thì icon bị đẩy ra mép trái
   còn tên bộ rơi xuống giữa nút.
   `min-width: 0` trên nhóm là BẮT BUỘC — không có nó, nhóm flex không chịu co xuống dưới bề ngang
   nội tại của chữ nên tên bộ dài sẽ tràn khỏi nút ở màn hẹp thay vì xuống dòng.
   `flex: none` trên icon để tên bộ xuống 2 dòng mà icon không bị bóp méo. */
.set-dd-lbl { display: flex; align-items: center; gap: 8px; min-width: 0; }
.set-dd-ico { flex: none; font-size: 17px; line-height: 1; }
/* Mũi tên TỰ VẼ: <select> gốc tự có mũi tên của trình duyệt, <button> thì không. Quay 180° khi mở
   để trạng thái đóng/mở đọc được ngay cả khi danh sách bị che một phần. */
.set-dd-caret { flex: none; font-size: 11px; line-height: 1; transition: transform 0.15s; }
.set-dd.open .set-dd-caret { transform: rotate(180deg); }
/* Danh sách xổ ra NẰM ĐÈ lên nội dung bên dưới (position:absolute) chứ không đẩy trang xuống —
   đẩy sẽ làm cả thẻ nhảy mỗi lần mở. Thẻ `.quiz-card` không đặt `overflow` và không tạo stacking
   context nên danh sách không bị cắt; `z-index` để cao hơn thanh dính của màn làm bài. */
.set-dd-list {
  position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 40;
  max-height: 280px; overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: var(--navy-mid); border: 1px solid var(--border); border-radius: 10px;
  box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45);
}
.set-dd-list[hidden] { display: none; }
/* ── ĐƯỜNG KẺ NGANG CHIA CÁC HÀNG (yêu cầu 19/9/2026 — "thêm kẻ ngang chia các hàng") ──
   Đây chính là thứ không thể làm được với `<select>`. Dùng CÙNG cách với bảng 🎲 Trộn đề:
   kẻ ở TRÊN mỗi hàng, hàng đầu bỏ kẻ → chỉ cần một luật `:first-child`, không phải xử lý hàng cuối. */
.set-dd-item {
  display: block; width: 100%; text-align: left; cursor: pointer;
  padding: 9px 11px; border: 0; border-top: 1px solid var(--border);
  background: none; color: var(--text);
  /* 17px, ĐI CÙNG nút mở: nhãn nút và nhãn hàng là cùng một chuỗi "Tên (N câu)" nên lệch
     nhau 1px là thấy ngay khi mở bảng (19/9/2026 — "tất cả chữ này cỡ 17px"). */
  font-family: 'Inter', sans-serif; font-size: 17px; font-weight: 500;
}
.set-dd-item:first-child { border-top: 0; }
.set-dd-item:hover { background: rgba(127, 127, 127, 0.18); }
/* Hàng ĐANG CHỌN: nền xanh đặc + chữ trắng, đúng quy ước "ô đang chọn" của `.quiz-btn.primary`. */
.set-dd-item.on { background: var(--accent); color: #ffffff; }
/* Chữ của cả nút và danh sách là ĐEN ở chế độ sáng (19/9/2026 — "đổi chữ màu đen ở dropdow light
   mode"). Trước đó cả hai chỗ lấy `var(--text)` = #e2e8f0 — màu chỉ tồn tại trong `:root` (chế độ
   tối), còn `body.light-mode` KHÔNG ghi đè `--text`, nên ở chế độ sáng chữ trắng-xám nằm trên nền
   sáng: nút gần như trống chữ. Đây là lỗi thật đã thấy trong ảnh người dùng gửi, không phải cảm
   nhận. Đen là màu chữ nền của `body.light-mode` nên khớp cả app. */
body.light-mode .set-dd-btn {
  background: #e9ecef; border-color: #0ea5e9; color: #000000;
  box-shadow: 0 0 0 1px rgba(14, 165, 233, 0.5), 0 0 9px rgba(14, 165, 233, 0.35);
}
body.light-mode .set-dd-btn:hover, body.light-mode .set-dd-btn:focus {
  border-color: #0284c7;
  box-shadow: 0 0 0 1px rgba(2, 132, 199, 0.85), 0 0 13px rgba(14, 165, 233, 0.55);
}
/* Bảng xổ ở CHẾ ĐỘ SÁNG dùng #e9ecef = nền trang, đúng màu bảng xổ của `<select>` cũ. */
body.light-mode .set-dd-list { background: #e9ecef; border-color: #c9d1da; }
body.light-mode .set-dd-item { color: #000000; }
body.light-mode .set-dd-item:hover { background: rgba(0, 0, 0, 0.06); }
/* Phải khai báo LẠI ở đây: `body.light-mode .set-dd-item` là (0,2,1) còn `.set-dd-item.on` chỉ
   (0,2,0) nên luật chế độ sáng sẽ ĐÈ MẤT nền xanh của hàng đang chọn. Cùng họ bẫy specificity
   đã ghi ở mục `.quiz-opt` — luật `body.light-mode .<x>` luôn thắng luật trạng thái. */
body.light-mode .set-dd-item.on { background: var(--accent); color: #ffffff; }
.quiz-opt {
  display: flex; align-items: flex-start; gap: 8px; width: 100%;
  text-align: left; padding: 9px; margin-bottom: 6px;
  border-radius: 10px;
  /* ── VIỀN Ô ĐÁP ÁN — CỐ Ý MẠNH HƠN MỌI Ô KHÁC (19/9/2026: "làm cho tấm đáp án nổi rõ bằng cách
     định hình bằng VIỀN thay vì hạ nền"). Lý do: nền đã hết dư địa — tấm ở chế độ sáng chỉ còn
     1,04:1 và ở chế độ tối 1,08:1, gần như KHÔNG còn gánh việc định hình. Viền mới là thứ cho
     người dùng thấy mỗi ô đáp án bắt đầu và kết thúc ở đâu.
     Vì thế chỗ này KHÔNG dùng `var(--border)` (0,22) như thẻ/nút/ô nhập nữa — 0,29 là cố ý đậm
     hơn để ô đáp án nổi hơn phần còn lại. ĐỪNG "thống nhất lại cho khớp" với --border.
     Độ dày 1,5px → **2px**, và HAI CHẾ ĐỘ ĐƯỢC KHỚP TỈ LỆ với nhau (giải ngược từ mục tiêu
     2,60:1 so với nền thẻ bao quanh, chứ không chọn bằng mắt):
       dark  rgba(255,255,255,0.29) trên thẻ #202020 → #606060 → **2,60:1**
       light #96a2af trên thẻ #ffffff (đè lại bằng luật body.light-mode bên dưới) → **2,60:1**
     Trước lượt này hai bên còn lệch nhau và đều nhạt: light #b3bfcc 1,87:1 · dark 0,22 → 2,05:1.
     Muốn đậm nữa thì dùng nấc sẵn có — thang đo trên đúng nền thẻ tương ứng:
       light #8e9cad 2,80:1 · #8794a5 3,08:1 · #7f8d9f 3,38:1
       dark  alpha 0,34 → 3,10:1 · 0,42 → 4,01:1 · 0,46 → 4,54:1
     Đáp án ĐÚNG/SAI vẫn đè viền này bằng --green/--red (chỉ đổi MÀU, không đổi độ dày). */
  border: 2px solid rgba(255,255,255,0.29);
  /* Nền ô đáp án ở CHẾ ĐỘ TỐI = XÁM ĐEN. Lịch sử 19/9/2026 (nền thẻ luôn là #1a1d24):
       var(--navy-mid) #1a1d24 → TRÙNG KHÍT nền thẻ (đo được 1.00:1) nên đáp án KHÔNG thành
         một tấm riêng, khác hẳn chế độ sáng nơi hộp xám nằm trên thẻ trắng
     → #262a33  (tấm/thẻ 1.17:1, đúng bằng --set-box-bg của hộp bộ đề ở trang chủ)
     → #2c323d  ("nhạt hơn 1 tí", tấm/thẻ 1.31:1)
     → **#21252e** ("đậm hơn", tấm/thẻ 1.10:1) — giờ KHÔNG còn bằng --set-box-bg nữa.
     Vì sao chọn #21252e chứ không lùi đúng một bước về #262a33: nền đậm lên thì chữ đáp án
     ĐỠ chìm, nên nấc này kéo #7d8ea3 từ 3.84:1 về **4.58:1** — vượt lại ngưỡng 4.5:1.
     CẢNH BÁO: tấm/thẻ chỉ còn 1.10:1. Đậm thêm nữa là tấm biến mất (#1e222b = 1.06:1,
     và #1a1d24 = 1.00:1 chính là lúc nó hoà hẳn vào thẻ).
     → **#262626** (19/9/2026 — "bảng màu xám thuần": cả dải tối bỏ hẳn sắc XANH, xám thuần
       R = G = B. Tấm này lấy ĐÚNG màu tấm trong ảnh mẫu, và trùng lại với --set-box-bg).
       Tấm/thẻ = 1.08:1; chữ đáp án #8394a9 trên tấm mới = **4.88:1** — vẫn trên ngưỡng 4.5:1.
     Chế độ sáng đè lại bằng luật body.light-mode .quiz-opt ngay bên dưới. */
  background: #262626; color: var(--answer);
  font-family: 'Inter', sans-serif; font-size: 16px; line-height: 1.5;
  font-weight: 500;   /* câu trả lời: 16px, nét 500 */
  cursor: pointer;
}
.quiz-opt:disabled { cursor: default; }
/* ── TRẠNG THÁI ĐÚNG/SAI — đo lại toàn bộ 19/9/2026 ("kiểm và chỉnh tương phản cho trạng thái
   đáp án ĐÚNG/SAI ở cả hai chế độ, cả khi chọn sai thì đáp án đúng có còn nổi bật không").
   Hai LỖI THẬT tìm được khi đo (không phải cảm nhận):
     (1) Ở chế độ SÁNG, viền "đúng" #10b981 chỉ đạt **2,54:1 — YẾU HƠN viền ô bình thường**
         (#96a2af = 2,60:1). Nghĩa là đáp án ĐÚNG được viền MỜ HƠN một ô chưa trả lời. Sửa ở
         khối body.light-mode bên dưới.
     (2) Chữ đáp án trên nền tint thấp hơn ngưỡng 4,5:1: dark "đúng" 4,12:1 và light "sai"
         4,45:1 → hạ độ đậm của tint (xem từng dòng ngay dưới).
   QUY TẮC cho mọi lần chỉnh sau: (a) viền trạng thái PHẢI mạnh hơn viền bình thường 2,60:1,
   (b) chữ đáp án trên nền tint PHẢI ≥ 4,5:1, (c) LIGHT cần màu ĐẬM hơn dark để nổi trên nền
   trắng — nên hai chế độ KHÔNG dùng chung một mã màu cho trạng thái. */
.quiz-opt.correct { border-color: var(--green); background: rgba(16,185,129,0.10); }
/* Tint 0,15 → 0,10: chữ đáp án #8394a9 trên nền tint đi từ 4,12:1 (DƯỚI ngưỡng) → **4,53:1**.
   Viền --green #10b981 trên nền tối vốn rất mạnh (6,42:1) nên vẫn là tín hiệu chính; nền có
   nhạt đi một chút (tint/thẻ 1,27 → 1,16) nhưng vẫn thấy rõ là một tấm xanh khác các ô còn lại. */
.quiz-opt.wrong { border-color: var(--red); background: rgba(239,68,68,0.12); }
/* Tint 0,15 → 0,12: chữ 4,51:1 → **4,67:1** — 4,51 là sát ngưỡng nên lấy khoảng an toàn hơn. */
.quiz-badge {
  min-width: 22px; height: 22px; border-radius: 50%;
  background: var(--accent); color: #ffffff;
  font-size: 13px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.quiz-opt .mark { font-size: 16px; line-height: 1.2; flex-shrink: 0; }
/* Số câu đặt trước nội dung câu hỏi. Thay icon ❓ emoji ở lượt trước: emoji rộng
   19px mà không mang thông tin gì, còn vòng tròn mang luôn SỐ CÂU nên bỏ được dòng
   nhãn “Câu 1/30” trên mỗi thẻ — trang ngắn hơn hẳn.
   Kiểu: KHÔNG có nền, chỉ một viền đỏ mảnh + số màu đỏ (yêu cầu người dùng — trước
   đó là nền xanh đặc như huy hiệu A/B/C/D). Vì không còn nền nên viền phải là
   `1px solid` chứ không phải nền mờ, nếu không số sẽ trôi trên nền thẻ.
   Dài ra thành viên thuốc khi số có 2-3 chữ số: bài trộn mặc định 100 câu nên
   “100” phải vừa.
   Cỡ số 13px trên vòng 20px (người dùng thấy 12px hơi nhỏ). Vòng chỉ tăng 1px vì
   bề ngang của vòng chính là bề ngang câu hỏi bị lấy đi — đo trên bộ 30 câu: tổng
   số dòng phải xuống thêm không đổi so với vòng 19px. `margin-top: 2px` giữ số
   nằm giữa dòng chữ đầu (hộp 20px trong dòng 24px). */
.q-num {
  min-width: 20px; height: 20px; border-radius: 10px; padding: 0 5px;
  box-sizing: border-box; background: transparent;
  border: 1px solid var(--red); color: var(--red);
  font-size: 13px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-top: 2px;
}
.quiz-fb {
  display: none; margin-top: 5px; padding: 8px 10px;
  border-radius: 10px; font-size: 16px; line-height: 1.5;
}
.quiz-fb.show { display: block; }
.quiz-fb.ok { background: rgba(16,185,129,0.14); border: 1px solid var(--green); }
.quiz-fb.no { background: rgba(239,68,68,0.14); border: 1px solid var(--red); }
/* Chọn SAI thì KHÔNG còn hộp đỏ "Chưa đúng" (19/9/2026 — "tôi chỉ muốn bỏ bảng chưa đúng").
   Vẫn dùng đúng thẻ div đó (JS chỉ đổi class, không phải sửa chỗ nào khác) nhưng bỏ nền, viền
   và lề trong — còn lại một dòng chữ nêu ĐÁP ÁN ĐÚNG, thứ người dùng yêu cầu khôi phục.
   KHÔNG gắn class 'no' cùng lúc với 'plain': body.light-mode .quiz-fb.no (0,3,0) sẽ thắng
   .quiz-fb.plain (0,2,0) và hộp đỏ quay lại ở chế độ sáng. */
.quiz-fb.plain { background: none; border: none; padding: 0; }
.quiz-all-head {
  position: sticky; z-index: 5;
  top: calc(var(--header-h) + env(safe-area-inset-top, 0px));
  /* Nền ĐỤC là bắt buộc vì đây là thanh DÍNH: câu hỏi và đáp án cuộn qua bên dưới.
     `.quiz-card` cho nền `--card` = rgba(255,255,255,0.04) — đúng cho thẻ thường,
     nhưng ở thanh dính thì 96% trong suốt nên chữ cuộn qua hiện xuyên lên, đè cả
     tiêu đề bộ đề lẫn dòng “Đã trả lời… · Đúng… · Sai…”. Chỉ chế độ tối bị, vì
     `body.light-mode .quiz-card` (độ ưu tiên cao hơn) đã đặt #ffffff đục sẵn.
     --navy-mid (#202020) chính là --navy (#171717) hoà 4% trắng — đúng cái mà
     rgba(255,255,255,0.04) đang cho ra trên nền trang, nhưng ĐỤC. */
  background: var(--navy-mid);
  /* GỌN: đây là thanh DÍNH, mỗi px chiều cao là một px nội dung bị che, nên padding
     riêng cho nó nhỏ hơn thẻ thường (7px 10px thay vì 11px). Đo ở khung 468px:
     78px → 63px (−19%). Kèm theo: khe tiêu đề ↔ dòng điểm 6px → 3px và nút 🏠
     padding 6px 9px → 4px 8px (khi đó nút còn 41×26).
     SAU ĐÓ (cùng ngày) nút 🏠 được làm TO LÊN theo yêu cầu — xem khối `.home-btn`
     ở trên: nút 62×45 nên thanh này cao lại 63px → 82px khi tiêu đề một dòng. */
  padding: 7px 10px;
}

/* ── ĐẦU MÀN LÀM BÀI ─────────────────
   Hàng đầu của mọi màn làm bài: nút về trang chủ + tiêu đề bộ đề.
   Nút nằm BÊN TRÁI HÀNG TIÊU ĐỀ — vị trí chuẩn của nút quay lại, và cũng là chỗ
   rẻ nhất về chiều cao. Ba phương án đã đo ở khung nhìn 393px (thẻ 349px):
   - Cạnh tiêu đề (đang dùng): ô tiêu đề còn 298px. Tiêu đề ngắn (“Văn hóa doanh
     nghiệp · 30 câu” 253px) vẫn một dòng; vài tên dài thêm một dòng.
   - Cạnh dòng tóm tắt: tiêu đề giữ nguyên, nhưng ở khung nhìn 311px dòng tóm tắt
     “Đã trả lời … · Đúng … · Sai …” cần 218.5px + nút 51px = 269px mà chỉ có
     249px → tóm tắt bị ngắt thành hai dòng, xấu hơn ngắt tiêu đề.
   - Hàng riêng cho nút: đầu bài cao thêm ~30px ở mọi bề ngang.
   Nút chỉ dùng emoji 🏠 (23px chữ): nhãn “Trang chủ” cần 103px + padding, đủ để
   ngốn thêm 80px bề ngang của tiêu đề. */
.head-row { display: flex; align-items: center; gap: 8px; }
/* Nút về trang chủ đã được làm TO hơn (yêu cầu 18/9/2026: “cho nút quay lại màn
   hình chính to hơn”). Trước đó nó bị thu nhỏ xuống 4px 8px chính vì lý do ngược lại
   — xem khối .quiz-all-head bên dưới: đây là thứ QUYẾT ĐỊNH chiều cao hàng đầu bài.
   Đo ở khung 468px, tiêu đề ngắn “Chuẩn mực đạo đức · 10 câu” (một dòng, 21px):

   | font/padding        | nút     | thanh dính |
   |---------------------|---------|------------|
   | 17px 4px 8px (cũ)   | 41×26   | 63px       |
   | 22px 6px 11px       | 54×35   | 72px       |
   | **24px 10px 14px**  | **62×45** | **82px** |
   | 28px 8px 14px       | 68×45   | 82px       |

   Chọn dòng in đậm ban đầu, rồi GIẢM xuống ("cho icon quay lại nhỏ hơn 1 tí", 19/9/2026):
   font 24px → 20px, padding 10/14 → 7/11 → nút **48×34**. Vẫn lớn hơn bản gốc 41×26,
   vẫn trên ngưỡng chạm WCAG 24×24, và thanh dính hạ xuống **74px** (từ 82).*/
.home-btn { padding: 7px 11px; line-height: 1; font-size: 20px; flex-shrink: 0; }
/* (Icon ❓ emoji ở lượt trước đã bị thay bằng .q-num — xem khai báo .q-num ở trên.) */
/* Ghi chú cũ của icon ❓, giữ lại để biết vì sao không quay lại emoji ở cỡ chữ lớn:
   emoji ở 16px rộng 22px, cộng khe 8px là lấy mất 30px bề ngang câu hỏi — đo trên
   bộ Văn hóa doanh nghiệp thì 10/30 câu phải xuống thêm một dòng.

/* Bốn nút làm bài của mỗi bộ đề: lưới 2×2 với hai cột BẰNG NHAU.
   Trước đây là flex-wrap nên mỗi nút rộng theo nhãn — hàng trên [Từng câu][Cả bộ]
   và hàng dưới [Học][Câu hỏi] lệch cỡ nhau, nhìn như lỗi. Lưới 2 cột cho cả bốn
   nút cùng bề ngang và cùng chiều cao.
   Padding ngang co từ 12px xuống 6px để nhãn dài nhất “▶️ Từng câu” (≈93px) vẫn
   nằm một dòng: ở khung nhìn 311px mỗi cột chỉ còn ≈120px, trừ 12px padding là
   ≈108px chỗ cho chữ. Bốn nút trên MỘT hàng là không thể ở cỡ 17px (mỗi nút chỉ
   còn ≈78px, không đủ cho nhãn), nên 2×2 là cách duy nhất để cả bốn đều nhau. */
.set-acts {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px;
  grid-auto-rows: 1fr;   /* cửa sổ rất hẹp: có nhãn phải xuống 2 dòng thì cả bốn nút vẫn cao bằng nhau */
}
.set-acts .quiz-btn { width: 100%; padding: 9px 6px; text-align: center; }

/* ── MODAL ───────────────────────── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 300;
  align-items: flex-end;
  justify-content: center;
}
.modal-overlay.open { display: flex; }

.modal {
  /* 19/9/2026: trước là mã CỨNG #1a1d24 (xám pha xanh) nên khi cả dải tối đổi sang xám thuần
     thì tấm này vẫn giữ sắc cũ. Đổi sang BIẾN để nó luôn đi cùng --navy-mid. */
  background: var(--navy-mid);
  border: 1px solid var(--border);
  font-family: 'Inter', sans-serif;
  border-radius: 20px 20px 0 0;
  width: 100%;
  max-width: 560px;
  max-height: 85vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
@media (min-width: 640px) {
  .modal-overlay { align-items: center; padding: 24px; }
  .modal { border-radius: 16px; max-height: 80vh; }
}
.modal-handle {
  width: 36px; height: 3px;
  background: rgba(255,255,255,0.2);
  border-radius: 2px;
  margin: 5px auto 0;
}
.modal-body { padding: 4px 12px 20px; }

/* ── LIGHT MODE ───────────────────────── */
/* Nền chế độ sáng: trắng xám để các thẻ trắng nổi rõ. Thẻ và ô nhập vẫn trắng. */
/* --text-dim đậm hơn #64748b một chút: hộp từng bộ đề giờ có nền xám #f1f3f5, mà
   #64748b trên xám đó chỉ đạt 4.31:1 (dưới ngưỡng 4.5:1). #5b6675 cho 5.27:1 trên
   nền xám và 5.83:1 trên thẻ trắng. */
body.light-mode { background: #e9ecef; color: #000000; --text-dim: #5b6675; --border: rgba(0,0,0,0.22); --answer: #5f6b7c; --q-text: #1f2937; --set-box-bg: #f1f3f5; --pin-brd: #1d4ed8; }

/* Hộp từng bộ đề trên trang chủ (📝 Chọn từng bộ đề) có nền riêng để tách khỏi thẻ
   chứa nó: xám ĐẬM #262626 ở chế độ tối (thẻ tối chỉ ≈#202020 nên hộp nhỉnh lên,
   đọc ra là một tấm riêng — tấm/thẻ 1.08:1 — và giờ cùng sắc với tấm đáp án),
   xám NHẠT #f1f3f5 ở chế độ sáng (thẻ trắng nên hộp lùi
   xuống). Một biến duy nhất, không phải hai luật chồng nhau. */
.set-box { background: var(--set-box-bg); }
/* Nhãn tên bộ đề: nền NHẸ (tint trong suốt) + chữ cùng tông, dáng giống hai chip
   “Đảo câu hỏi / Đảo đáp án”. Lịch sử màu theo yêu cầu người dùng: xanh ĐẶC + chữ
   trắng → xanh nhẹ → **đỏ nhẹ** (đang dùng). Đừng viết style thẳng trong thẻ: cần
   luật riêng cho chế độ sáng, mà style thẳng thì CSS thường không ghi đè được.
   Đỏ phải SÁNG hơn xanh khi làm chữ (mắt nhạy với đỏ kém hơn): ở chế độ tối dùng
   #f87171 chứ không phải --red #ef4444 — đo được 3,34:1 là quá mờ. */
.set-name {
  display: inline-block;
  /* Nền XANH DƯƠNG NHẸ + VIỀN (yêu cầu 19/9/2026) — trước đó là nền đỏ nhạt không viền.
     Dùng đúng sắc xanh của app (--accent #1d4ed8) ở alpha thấp, nên nhãn cùng họ màu với
     nút “Thư viện”/“Từng câu” mà không thành một khối xanh đặc.
     Lề trong hạ 1px mỗi phía (3px 9px → 2px 8px) để BÙ cho đường viền 1px: nhãn vẫn đúng
     182×30px như trước, không làm thẻ bộ đề cao thêm. */
  background: rgba(29,78,216,0.16);
  border: 1px solid rgba(96,165,250,0.55);
  color: #ffffff;
  padding: 2px 8px; border-radius: 8px;
}
/* Chế độ sáng: viền phải ĐẬM hơn chế độ tối mới thấy rõ, vì nền nhạt và mắt nhạy với
   xanh dương kém hơn. Đo trên nền đã pha: 0,45 → ~2,0:1 (mờ), 0,60 → ~2,6:1 (rõ mà vẫn mảnh). */
body.light-mode .set-name {
  background: rgba(29,78,216,0.10);
  border-color: rgba(29,78,216,0.6);
  /* Chữ XANH DƯƠNG ĐẬM (yêu cầu 19/9/2026) — trước là đen tuyền. Dùng #1e40af chứ không
     phải --accent #1d4ed8: đây đúng là màu chữ xanh đậm app đã dùng cho chip đang bật ở
     chế độ sáng, đo trên nền đã pha được 7,45:1. Chế độ tối vẫn giữ chữ TRẮNG — xanh đậm
     trên nền tối là không đọc được, và luật cũ của người dùng vẫn là “trắng ở dark mode”. */
  color: #1e40af;
}
/* Tên bộ đề trong bảng 🎲 Trộn đề: nền XANH LÁ NHẸ + chữ cùng tông (yêu cầu 18/9/2026).
   Cùng dáng với nhãn .set-name ở danh sách bộ đề nhưng KHÁC TÔNG màu (đỏ vs xanh lá)
   nên nhìn là biết đang ở bảng nào — đừng dùng chung một lớp cho cả hai chỗ.
   Chữ xanh lá ở chế độ tối phải SÁNG (#34d399), không dùng --green #10b981: mắt nhạy
   với xanh lá kém hơn xanh dương, #10b981 trên tint này chỉ 5,32:1 còn #34d399 đạt
   7,09:1. Chế độ sáng ngược lại cần ĐẬM: #15803d chỉ 4,44:1 (dưới ngưỡng 4,5:1) nên
   dùng #166534 — 6,40:1. Đừng viết style thẳng trong thẻ: style thẳng không ghi đè
   được luật chế độ sáng. */
.mix-name {
  display: inline-block;
  /* KHÔNG NỀN — chỉ còn chữ (yêu cầu 19/9/2026 — "tôi muốn bỏ màu nền").
     Lịch sử nền của nhãn này: xanh lá 0,14 + chữ #34d399 → xanh lá 0,07 + chữ #ffffff
     → 0,06 ở chế độ sáng → và giờ là KHÔNG có nền.
     Lề trong `3px 8px` CỐ Ý GIỮ LẠI dù không còn khối màu: nó chính là thứ đang đặt chữ vào
     đúng chỗ hiện tại, nên bỏ luôn lề là chữ NHẢY sang trái 8px so với hôm nay. Muốn bỏ thì
     bỏ lề trong cùng lúc, đừng bỏ lẻ.
     Chữ vẫn TRẮNG ở tối và xanh đen #134e4a ở sáng (xem khối chế độ sáng ngay dưới) — bỏ nền
     KHÔNG kéo theo đổi màu chữ. */
  background: none;
  color: #ffffff;
  padding: 3px 8px; border-radius: 8px;
}
/* Chế độ sáng: chữ XANH ĐEN (#134e4a), không phải đen tuyền (yêu cầu 19/9/2026).
   Đổi màu chữ chứ KHÔNG đổi màu nền: nền vẫn là tint xanh lá 0,06 của .mix-name.
   Đo trên nền đã pha (tint trên thẻ trắng #ffffff = rgb(241,251,247)): #134e4a được
   8,97:1 — còn dễ đọc hơn cả đen tuyền vì bớt tương phản gắt. Đừng dùng #166534 ở đây:
   đó là xanh LÁ (đang dùng cho đáp án đúng), trùng tông với nền tint của chính nhãn. */
/* Chế độ sáng: cũng KHÔNG nền (19/9/2026). Luật này giờ chỉ còn đổi MÀU CHỮ — nền trong suốt
   nên chữ nằm thẳng trên thẻ trắng #ffffff, #134e4a đạt ~9:1. Nếu ai trả lại nền thì phải xem
   lại màu chữ cùng lúc: cặp màu này từng được chọn cho nền tint xanh lá, không phải cho nền trắng. */
body.light-mode .mix-name { background: none; color: #134e4a; }
/* Nút "↺ Mặc định" trong thẻ Trộn đề. Chỉ là CHỮ XANH có viền mảnh, không phải nút khối:
   nó là lối thoát cho việc tỷ lệ đã được lưu vào máy, nên phải có nhưng không được tranh
   chỗ với ba nút trộn thật. Vì là chữ trong thẻ nên phải dùng --accent-glow, KHÔNG dùng
   --text-dim (chữ mờ trong thẻ này là chữ phụ 15px/400, nút cần nổi hơn một bậc).
   KHÔNG dùng --accent ở đây: #1d4ed8 là màu cho NỀN NÚT (chữ trắng trên nó), làm màu
   chữ trên nền thẻ tối chỉ đạt 4,0:1 — đúng cái bẫy --accent-glow sinh ra để tránh. */
.mix-reset {
  background: none; border: 1px solid var(--border); border-radius: 8px;
  color: var(--accent-glow); font-family: 'Inter', sans-serif;
  /* 15px → 17px (19/9/2026 — "tất cả chữ này cỡ 17px", ảnh có nút "↺ Mặc định"). Nút cao thêm
     ~3px; nó nằm cùng hàng flex với dòng "Tổng tỷ lệ" (cũng vừa lên 17px) nên hàng vẫn cân. */
  font-size: 17px; font-weight: 400; padding: 4px 9px; cursor: pointer;
}
.mix-reset:hover { border-color: var(--accent-glow); }

/* ── CẶP NÚT ▲▼ cạnh ô phần trăm (19/9/2026 — "muốn có dấu mũi tên lên xuống kế ô số
   chỉnh cho dễ khi xem trên điện thoại"). Đặt NGAY SAU ô nhập nên không phải với tay, và
   mỗi cú chạm CHỐT LUÔN (chia lại tỷ lệ), khác mũi tên mặc định của trình duyệt — thứ chỉ
   sửa số rồi chờ rời ô. Vì vậy mũi tên mặc định được ẩn đi ở các ô phần trăm để không
   thành hai bộ mũi tên chồng nhau trên máy tính.
   26×20 mỗi nút: nhỏ hơn khuyến nghị 44px, nhưng bù lại GIỮ để tự lặp khi đè ngón tay. */
.mix-step { display: flex; flex-direction: column; gap: 2px; flex: none; }
.mix-step button {
  width: 32px; height: 17px; padding: 0; line-height: 1;
  font-family: 'Inter', sans-serif; font-size: 10px;
  background: none; border: 1px solid var(--border); border-radius: 6px;
  color: var(--text-dim); cursor: pointer;
}
/* Ô số của bảng trộn — lớp RIÊNG để thu nhỏ (19/9/2026 "cho ô số nhỏ lại") mà không kéo theo
   .quiz-input (ô đổi tên bộ đề dùng chung lớp đó, phải giữ 17px/10px lề). 46×35 thay vì 62×41:
   đủ chỗ cho 3 chữ số "100", và trả lại ~16px cho cột tên bộ đề. */
.mix-input { width: 40px; padding: 5px 3px; text-align: center; font-size: 15px; }
/* Ô SỐ (%) của bảng trộn: NỀN XANH NHẸ + CHỮ XANH + VIỀN XANH (19/9/2026 — "tôi muốn hàng số có
   nền xanh nhẹ và chữ xanh, viền xanh"). Cùng cặp màu với viền neon của `.set-dd-btn` (trước
   19/9/2026 là `#setSelect` — ô select đã được thay bằng dropdown tự vẽ) nên hai chỗ nhìn như
   một bộ.
   Chỉ khai báo trên .mix-input — KHÔNG đụng .quiz-input: lớp đó còn là ô ĐỔI TÊN bộ đề trong
   bảng 📦, và nếu tô ở đó thì ô đổi tên cũng xanh theo mà người dùng không hề yêu cầu.
   Chữ phải là xanh SÁNG (#7dd3fc): chữ trắng trên nền tint xanh vẫn đọc được nhưng mất hẳn ý
   "chữ xanh" người dùng muốn. */
/* "cho nền và viền xanh nhẹ hơn" (19/9/2026, sau khi xem ảnh chụp): hạ độ đậm của NỀN và VIỀN.
   Nền: alpha 0,14 → 0,08. Viền: thay màu ĐẶC bằng màu TRONG SUỐT (alpha 0,55) — cách này làm viền
   nhạt đi mà KHÔNG phải giảm border-width, nên ô vẫn cao 31px như cũ (giảm độ dày viền sẽ làm
   nhảy bố cục 0,5px, xem ghi chú của `.set-dd-btn`).
   Chữ giữ nguyên #7dd3fc: nền nhạt đi thì chữ phải giữ độ sáng mới còn đọc được. */
.mix-input {
  background: rgba(56, 189, 248, 0.08);
  border-color: rgba(56, 189, 248, 0.55);
  color: #7dd3fc;
}
.mix-input:focus { border-color: #7dd3fc; }
/* Ô số = 0: NỀN ĐEN (tối) / TRẮNG (sáng) + VIỀN XÁM (19/9/2026 — "tôi muốn những ô số 0 thì có
   viền cùng màu với bảng và có viền xám ở light mode và dark mode").
   Viền dùng ĐÚNG `--border` — cùng màu với kẻ ngang và viền khung của bảng Trộn đề, nên ô số 0
   đọc ra như một ô "để trống" nằm trong hệ của bảng, không phải ô tự vẽ màu riêng.
   Chữ đổi sang `--text-dim`: chữ xanh #7dd3fc vốn dành cho ô ĐANG CÓ phần trăm; trên nền trắng
   nó chỉ đạt 1,6:1, không đọc được. `--text-dim` tự đổi theo chế độ (#94a3b8 ở tối trên nền đen
   ≈ 7:1; #5b6675 ở sáng trên nền trắng ≈ 5,5:1) nên chỉ cần khai báo một lần.
   Chỉ NỀN là phải tách theo chế độ — và vì vậy mới cần class `.mix-zero` do JS gắn: CSS không
   chọn được theo giá trị của ô nhập.
   Ô có số > 0 vẫn giữ nguyên nền xanh nhẹ + chữ xanh như cũ. */
.mix-zero {
  /* KHÔNG NỀN RIÊNG (19/9/2026 — "tôi muốn màu nền số 0 cùng màu với nền nút lên xuống").
     Nút ▲▼ dùng `background: none`, nên nền THẬT của nó chính là nền hàng/thẻ (#202020 ở chế độ
     tối, #ffffff ở chế độ sáng — đã đo bằng cách chồng màu các tổ tiên). Ô số 0 làm y hệt: để
     trong suốt, chỉ giữ viền — hai thứ nằm cạnh nhau trong cùng hàng nên phải cùng một nền.
     Lịch sử nền ô 0 (đều đã bỏ): #000000 → #333333 → #2b2b2b → **trong suốt**. Mọi nấc xám tự vẽ
     đều sai ở chỗ nó KHÔNG ăn theo nền thẻ, còn cách này ăn theo tự động kể cả khi thẻ đổi màu.
     Chỉ NỀN đổi theo cách này — viền vẫn `--border` (đúng màu kẻ bảng) và chữ vẫn `--text-dim`. */
  background: none;
  border-color: var(--border);
  color: var(--text-dim);
}
/* Chế độ sáng khai ở CUỐI tệp, ngay sau `body.light-mode .mix-input` — xem ghi chú ở đó. */
/* Nhỏ thêm lần nữa (19/9/2026 — "cho ô số nhỏ thêm"): 46×35 → 40×30.
   Cỡ CHỮ vẫn 15px, chỉ cắt lề trong: chữ số là thứ phải đọc được, còn lề thừa mới là thứ
   chiếm chỗ. Lòng ô còn 32px, đủ cho "100" (đo được 26px) nên không bị cắt số 3 chữ số.
   Chiều cao hàng KHÔNG đổi (36px): cặp ▲▼ và nút 📌 vẫn cao 36px — nếu muốn cả hàng thấp
   xuống thì phải thu cả ba thứ đó, mà như vậy thì ngón tay khó chạm hơn khi dùng điện thoại. */
.mix-step button:hover { border-color: var(--accent-glow); color: var(--text); }
.mix-step button:active { background: rgba(127, 127, 127, 0.22); color: var(--text); }

/* ── NÚT GHIM (📌) ngay TRƯỚC ô số (19/9/2026 — "muốn ô ghim dời qua trước ô số"; trước đó nó
   đứng sau cặp ▲▼ theo đúng yêu cầu ban đầu "thêm nút dừng kế mũi tên lên xuống").
   Rộng 23px và lề PHẢI ÂM 4px — đổi từ lề trái sang khi dời vị trí, vì khe cần thu hẹp bây
   giờ là khe với Ô SỐ ở bên phải: hàng rất chật ở bề ngang 409px, lề âm làm khe hở thật
   xuống 4px nên chỉ lấy thêm ~19px của cột tên bộ đề thay vì 27px.
   Màu khi ghim theo đúng quy ước xanh lá của app: #34d399 ở chế độ tối (sáng), #166534 ở
   chế độ sáng (đậm) — cùng cặp màu .mix-name đang dùng, vì #10b981/#15803d không đủ tương phản. */
.mix-lock {
  width: 23px; height: 36px; margin-right: -4px; padding: 0; flex: none;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Inter', sans-serif; font-size: 13px; line-height: 1;
  /* Viền XANH DƯƠNG (`--pin-brd`) chứ không phải viền xám `--border` như mọi ô khác trong hàng
     (19/9/2026 — "tôi muốn có viền xanh dương đậm ở nút ghim"): nút ghim là chỗ bấm được, không
     phải ô hiển thị, nên viền xanh tách nó ra khỏi nền hàng ở cả hai chế độ. */
  background: none; border: 1px solid var(--pin-brd); border-radius: 8px;
  color: var(--text-dim); cursor: pointer;
  /* KHÔNG đặt `filter` trên chính NÚT nữa (sửa 19/9/2026): `filter` áp cho cả PHẦN TỬ gồm cả
     viền, nên `grayscale(1)` đã biến viền xanh dương vừa thêm thành XÁM — `getComputedStyle`
     vẫn trả về `rgb(59,130,246)` nên nhìn mã thì tưởng đúng, chỉ ảnh chụp mới lộ. Làm mờ ở
     span bên trong thì chỉ icon đổi, viền giữ nguyên màu. */
}
/* Chưa ghim thì icon MỜ + XÁM. Giữ nguyên lý do cũ: hai emoji 📍/📌 trông gần như nhau ở cỡ
   13px nên hàng nào cũng ra cây ghim đỏ — độ mờ là thứ DUY NHẤT phân biệt hàng đang ghim. */
.mix-lock-ico { filter: grayscale(1) opacity(0.5); line-height: 1; }
.mix-lock:hover { border-color: var(--accent-glow); color: var(--text); }
.mix-lock:hover .mix-lock-ico { filter: none; }
/* Hàng ĐANG GHIM: icon giữ nguyên màu + nền xanh nhạt + viền xanh → nổi hơn hẳn hàng bên
   cạnh dù hai icon gần giống nhau. Viền xanh LÁ đứng sau `.mix-lock` nên thắng `--pin-brd`
   (cùng (0,2,0) với `.mix-lock:hover`, mà luật này khai SAU). */
.mix-lock.on {
  border-color: #34d399; color: #34d399;
  background: rgba(52, 211, 153, 0.18);
}
.mix-lock.on .mix-lock-ico { filter: none; }
body.light-mode .mix-lock.on {
  border-color: #166534; color: #166534; background: rgba(22, 101, 52, 0.12);
}
/* Dấu chỉ hàng đang ghim trên chính tên bộ đề. Dùng box-shadow inset, KHÔNG dùng border:
   border làm ô nhích 2px và hàng đổi chiều cao, còn inset thì không đổi bố cục. */
.mix-name.pinned { box-shadow: inset 0 0 0 1px rgba(52, 211, 153, 0.7); }
/* ── BẢNG TRỘN ĐỀ: KHỐI KẺ NGANG, BO GÓC (yêu cầu 19/9/2026 — "cho bảng Trộn đề bo góc theo
   đường kẻ mới") ──
   Lịch sử trong ngày, đúng thứ tự đã đi: (1) thêm KẺ NGANG giữa các hàng; (2) thêm kẻ DƯỚI
   hàng cuối; (3) thêm kẻ TRÊN hàng đầu; (4) kéo kẻ ra tận mép trong của thẻ (`margin: 0 -10px`).
   Ba bước đầu để lại một khối kẻ có HAI ĐẦU VUÔNG — kẻ kết thúc thẳng ở mép thẻ, không có cạnh
   dọc nào để đóng góc, nên bốn góc của khối trông "hở". Đó là lý do có bản này.
   Cách làm: bọc 18 hàng trong `.mix-table` — một khung có VIỀN + BO GÓC. Hai kẻ ngoài cùng KHÔNG
   còn là `border` của hàng mà là VIỀN của khung, nên chúng bo theo cung; kẻ giữa các hàng vẫn do
   từng `.mix-row` tự vẽ ở phía trên (`border-top`), giữ nguyên cách cũ.
   `overflow: hidden` là BẮT BUỘC, không phải cho đẹp: thiếu nó thì kẻ giữa các hàng và nền nút
   📌 vẫn VUÔNG và thò ra ngoài cung bo — đúng cái "hở ở hai góc bo" cần chặn.
   KÍCH THƯỚC KHÔNG ĐỔI MỘT PIXEL: khung có `margin: 0 -10px` (đúng `padding` của `.quiz-card`)
   nên cạnh dọc của khung chạm mép trong của thẻ y như kẻ cũ, và hàng hạ `padding` ngang từ 10px
   xuống 9px để bù 1px viền khung (10 = 1 + 9): chữ, ô số, nút 📌 và cột số câu giữ nguyên vị trí.
   Màu: viền khung và kẻ đều dùng `--border` (0,22 trắng ở tối / 0,22 đen ở sáng) — cùng độ đậm
   với viền ô số và nút ghim trong CÙNG hàng, nhìn ra là một hệ.
   MỘT ĐIỀU CẦN BIẾT: cạnh dọc của khung nằm SÁT viền của `.quiz-card` (hai đường 1px cạnh nhau),
   nên dọc theo bảng, mép thẻ đọc ra dày 2px trong khi viền trên/dưới của khung vẫn 1px. Đây là
   hệ quả của việc giữ kẻ chạm tận mép thẻ (bước 4) — KHÔNG chồng hai đường lên nhau, nếu chồng
   thì đường dọc sẽ đậm gấp đôi (0,39) ở riêng đoạn bảng, còn tệ hơn. */
.mix-table {
  margin: 0 -10px;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}
.mix-row {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 9px;          /* 9px + 1px viền khung = đúng 10px như trước */
  border-top: 1px solid var(--border);
}
/* Hàng ĐẦU không vẽ kẻ trên: viền TRÊN của `.mix-table` đã đóng vai đó, và nhờ vậy hai đầu kẻ
   trên được bo theo cung thay vì kết thúc vuông. Hàng CUỐI cũng vậy với viền DƯỚI của khung —
   nên KHÔNG có luật `border-bottom` nào cho hàng, và cũng KHÔNG cần: mọi hàng chỉ vẽ kẻ TRÊN.
   `:first-child` dùng được ở ĐÂY (khác trước): `.mix-table` chỉ chứa `.mix-row`, nên hàng đầu
   đúng là con đầu tiên. Trước đây các hàng nằm trực tiếp trong `.quiz-card` cùng với dòng tổng /
   dòng cảnh báo / hàng nút nên phải tự thêm class `last` — class đó giờ đã bỏ. */
.mix-row:first-child { border-top: 0; }
input[id^="mixPct-"]::-webkit-outer-spin-button,
input[id^="mixPct-"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
input[id^="mixPct-"] { -moz-appearance: textfield; appearance: textfield; }
/* Chế độ sáng: #60a5fa trên thẻ trắng chỉ 2,5:1 — phải đổi sang xanh ĐẬM, cùng màu
   #1e40af mà .quiz-toggle.on dùng ở chế độ sáng (7,45:1 trên nền chip). */
body.light-mode .mix-reset { color: #1e40af; border-color: rgba(0,0,0,0.35); }
body.light-mode .mix-reset:hover { border-color: #1e40af; }

/* ── SEARCH ───────────────────────── */
/* Thanh tìm kiếm đứng RIÊNG, ngay dưới thanh xanh trên cùng và TRÊN thẻ “📚 Thư viện
   bộ đề” (19/9/2026 — trước đó nó nằm trong thẻ). Vì ở ngoài thẻ nên KHÔNG có nền hay
   viền của .quiz-card: chỉ ô nhập (--navy-mid + viền --border) nổi trên nền trang.
   Lề trên 8px trùng nhịp với .main 0 8px hai bên, để nó thẳng hàng với các thẻ bên dưới. */
.search-wrap { position: relative; margin: 8px 0 6px; }
/* Gốc định vị của icon 🔍 và nút ✕. `.search-wrap` KHÔNG dùng được vì nó còn chứa danh sách kết
   quả — xem ghi chú trong `quizHomeHtml()`. */
.search-field { position: relative; }
.search-input {
  /* Lề phải 12px → 38px để chừa chỗ cho nút XOÁ (19/9/2026 — "tôi muốn có dấu x để xoá ở thanh
     tìm kiếm"). Thiếu bước này thì chữ dài chui xuống dưới nút ✕ và không đọc được. */
  width: 100%; padding: 9px 38px 9px 34px;
  border-radius: 10px; border: 1.5px solid var(--border);
  background: var(--navy-mid); color: var(--text);
  font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 400;
}
.search-input:focus { outline: none; border-color: var(--accent); }
.search-icon {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  font-size: 16px; pointer-events: none; opacity: 0.6;
}
/* Nút XOÁ (✕) nằm TRONG ô nhập, sát mép phải (19/9/2026 — "tôi muốn có dấu x để xoá ở thanh tìm
   kiếm"). 34×34 là vùng chạm tối thiểu trên điện thoại; ký tự ✕ không tính vào vùng đó.
   Chỉ hiện khi ô CÓ chữ — xem `paintSearchClear()` trong JS.
   `.search-clear[hidden]` PHẢI khai riêng: luật `.search-clear` đặt `display:flex`, mà thuộc tính
   `hidden` chỉ ăn khi không có `display` nào đè (đúng cách đã làm với `.set-dd-list[hidden]`). */
.search-clear {
  position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
  width: 34px; height: 34px; padding: 0;
  display: flex; align-items: center; justify-content: center;
  background: none; border: 0; border-radius: 8px; cursor: pointer;
  color: var(--text-dim); font-family: 'Inter', sans-serif; font-size: 17px; line-height: 1;
}
.search-clear[hidden] { display: none; }
.search-clear:hover, .search-clear:active { color: var(--text); background: rgba(127, 127, 127, 0.18); }
/* Chế độ sáng PHẢI khai lại màu hover: `--text` chỉ có trong `:root` (bộ biến chế độ tối) và
   `body.light-mode` không ghi đè nó — dùng nguyên `var(--text)` ở đây là chữ trắng trên nền trắng.
   Cùng họ lỗi đã làm nút dropdown mất chữ. */
body.light-mode .search-clear:hover, body.light-mode .search-clear:active {
  color: #000000; background: rgba(0, 0, 0, 0.06);
}
.search-results {
  max-height: 360px; overflow-y: auto; margin-top: 6px;
  -webkit-overflow-scrolling: touch;
}
.search-results:empty { display: none; }
.search-hit {
  padding: 9px; margin-bottom: 6px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--navy-mid);
}
.search-hit-set {
  font-size: 13px; font-weight: 500; color: var(--accent-glow);
  margin-bottom: 4px;
}
.search-hit-q {
  font-size: 16px; font-weight: 500; color: var(--text);
  line-height: 1.5; margin-bottom: 4px;
}
.search-hit-a {
  font-size: 15px; font-weight: 400; color: var(--green);
  line-height: 1.4;
}
.search-hit-q em, .search-hit-a em {
  font-style: normal; background: rgba(251,191,36,0.25);
  border-radius: 3px; padding: 0 2px;
}
.search-empty {
  font-size: 15px; color: var(--text-dim); padding: 8px 0;
}
body.light-mode .search-input { background: #ffffff; border-color: #b3bfcc; color: #1e293b; }
body.light-mode .search-hit { background: #ffffff; border-color: #c9d1da; }
body.light-mode .search-hit-q { color: #1e293b; }
body.light-mode .search-hit-a { color: #166534; }
body.light-mode .header {
  background:
    linear-gradient(135deg, rgba(255,255,255,0.22), rgba(255,255,255,0) 42%),
    linear-gradient(135deg, #1e40af, #1e3a8a);
  box-shadow: 0 3px 10px rgba(30,64,175,0.35);
}
body.light-mode .header-sub { color: #dbeafe; }
body.light-mode .modal { background: #f0f1f4; }
body.light-mode .modal-handle { background: rgba(0,0,0,0.15); }
body.light-mode .quiz-card { background: #ffffff; border-color: #c9d1da; }
body.light-mode .quiz-input { background: #ffffff; border-color: #b3bfcc; color: #1e293b; }
/* Ô số của bảng trộn ở CHẾ ĐỘ SÁNG. Phải khai báo SAU `body.light-mode .quiz-input` ở trên:
   hai luật cùng độ ưu tiên (0,2,0) nên luật nào đứng sau mới thắng — đặt trước là màu trắng
   của .quiz-input đè mất, và lỗi này chỉ hiện ở chế độ sáng.
   Chữ xanh ở đây phải ĐẬM (#075985): #38bdf8 trên nền trắng gần như không đọc được. */
body.light-mode .mix-input {
  background: rgba(14, 165, 233, 0.06);
  border-color: rgba(14, 165, 233, 0.45);
  color: #075985;
}
/* Ô SỐ 0 ở CHẾ ĐỘ SÁNG — phải khai báo LẠI Ở ĐÂY, không dùng được khối `.mix-zero` phía trên.
   Lý do là bẫy specificity đã gặp nhiều lần trong app: `body.light-mode .mix-input` và
   `body.light-mode .mix-zero` CÙNG độ ưu tiên (0,2,1), nên luật nào ĐỨNG SAU thì thắng — mà
   `body.light-mode .mix-input` nằm sau khối `.mix-zero` trong tệp, nên ở chế độ sáng nó đè mất
   cả nền trắng, cả viền xám lẫn màu chữ của ô 0 (ĐO ĐƯỢC: nền vẫn xanh nhạt, viền vẫn xanh).
   Bản trước tôi chỉ khai `background` ở đây — thiếu `border-color` và `color` nên ô 0 ở chế độ
   sáng vẫn xanh viền và xanh chữ. Giờ khai đủ ba thuộc tính. */
body.light-mode .mix-zero {
  background: #ffffff;
  border-color: var(--border);
  color: var(--text-dim);
}
body.light-mode .quiz-btn { background: #ffffff; border-color: #b3bfcc; color: #1e293b; }
body.light-mode .quiz-btn.primary { background: #1d4ed8; color: #ffffff; border-color: #1d4ed8; }
body.light-mode .quiz-btn.danger { background: #dc2626; color: #ffffff; border-color: #dc2626; }
/* VIỀN KHI ĐANG CHỌN ở CHẾ ĐỘ SÁNG — phải khai báo Ở ĐÂY, không phải cạnh `.quiz-btn:focus`.
   Ba luật `body.light-mode .quiz-btn[.primary|.danger]` ngay trên có độ ưu tiên (0,3,1), còn
   luật gốc `.quiz-btn:focus` chỉ (0,3,0) — nên nếu không có khối này thì ở chế độ sáng viền focus
   bị LUẬT NỀN ĐÈ MẤT (đúng cái bẫy đã ghi ở mục quiz-opt: mọi luật `body.light-mode .<x>` cho
   phần tử có TRẠNG THÁI đều âm thầm thắng luật trạng thái).
   Độ ưu tiên ở đây là (0,4,1) nên thắng chắc.
   Ở sáng dùng `--accent` (#1d4ed8) = **6,70:1** trên nền nút trắng — xanh dương ĐẬM là thứ dễ thấy
   nhất trên nền sáng, nên KHÔNG theo chế độ tối nhảy sang #60a5fa (chỉ ~2,5:1 trên nền trắng).
   Hai luật dưới là ngoại lệ cho nút ĐẶC, nơi nền đã là khối xanh/đỏ đậm nên viền đậm chìm vào
   chính nó — ở đó `#60a5fa` mới tách ra được. Nếu gộp cả hai chế độ thành một giá trị thì một
   trong hai chế độ sẽ mất dấu "đang chọn". */
body.light-mode .quiz-btn:focus { border-color: var(--accent); }
body.light-mode .quiz-btn.primary:focus,
body.light-mode .quiz-btn.danger:focus { border-color: var(--accent-glow); }
/* Nền đáp án ở CHẾ ĐỘ SÁNG: gần như TRẮNG, chỉ còn một vệt xám. Đường đi của riêng chỗ này
   trong ngày 19/9/2026 — sáu nấc, và KHÔNG còn dư địa:
   #ffffff → #f1f3f5 → #f7f8fa ("nhạt hơn 1 tí") → #f1f3f5 ("nền xám nhẹ") → #f5f6f8
   ("trắng xám nhẹ", chọn để KHỚP 1,08:1 với tấm ở chế độ tối) → **#fafbfc = ĐANG DÙNG**
   ("nhạt hơn nữa").
   **VÙNG NÀY ĐÃ PHẲNG — đây là thông tin quan trọng nhất của cả chuỗi:** từ #fafbfc trở lên
   chỉ còn #fbfcfd 1,03:1 · #fdfdfe 1,02:1 · #ffffff 1,00:1, tức ba nấc còn lại KHÁC NHAU
   KHOẢNG MỘT ĐƠN VỊ RGB — mắt không phân biệt được, và #ffffff chính là thẻ nên tấm BIẾN MẤT.
   Sau nấc này thì thứ định hình ô đáp án là **VIỀN #b3bfcc = 1,87:1 trên thẻ trắng** — mạnh
   hơn hẳn nền (1,04:1), tức viền đã gánh việc từ lâu rồi. Muốn ô nổi hơn nữa thì ĐẬM VIỀN,
   đừng hạ nền thêm (không còn gì để hạ).
   Chữ đáp án vẫn #5f6b7c, KHÔNG phải đổi: 5,22:1 trên tấm mới — nền nhạt đi thì chữ ĐỠ khó
   đọc, đúng chiều ngược với chế độ tối.
   Thang đầy đủ trên thẻ #ffffff — (chữ đáp án) · (tấm/thẻ):
     #f5f6f8 5,00:1 · 1,08:1 (nấc trước) · #f6f7f9 5,05:1 · 1,07:1 · #f7f8fa 5,09:1 · 1,06:1
     **#f8f9fb 5,14:1 · 1,05:1 · #f9fafb 5,18:1 · 1,05:1 · #fafbfc 5,22:1 · 1,04:1 (đang dùng)**
     #fbfcfd 5,27:1 · 1,03:1 · #fdfdfe 5,32:1 · 1,02:1 · #ffffff 5,41:1 · 1,00:1 (thẻ — tấm mất)
   Xám đậm hơn (nếu muốn quay lại): #f1f3f5 4,86:1 · 1,11:1 · #f0f0f0 4,75:1 · 1,14:1 (xám THUẦN
   R=G=B) · #ededed 4,62:1 · 1,17:1 · #e9ecef 4,56:1 · 1,19:1 (= nền trang, ĐỪNG dùng làm tấm).
   Chế độ TỐI ngược chiều: ở đó tấm #262626 trên thẻ #202020 = 1,08:1 và nền không đổi. */
/* VIỀN Ở ĐÂY đã đậm lên #b3bfcc → **#96a2af** (cùng lượt "định hình bằng viền"): đúng giá trị để
   đạt **2,60:1 trên thẻ trắng — KHỚP CHÍNH XÁC với viền ở chế độ tối** (rgba trắng 0,29 → #606060
   trên thẻ #202020 cũng 2,60:1). Độ dày 2px lấy từ luật `.quiz-opt` gốc ở trên. Đổi một bên thì
   phải đo lại bên kia, nếu không hai chế độ lại lệch nhau như trước lượt này (1,87 so với 2,05). */
body.light-mode .quiz-opt { background: #fafbfc; border-color: #96a2af; color: var(--answer); }
/* Đáp án đã chọn ở CHẾ ĐỘ SÁNG phải hiện xanh/đỏ y như chế độ tối.
   Luật `body.light-mode .quiz-opt` ở ngay trên có độ ưu tiên cao hơn
   `.quiz-opt.correct/.wrong` (2 class + 1 thẻ so với 2 class), nên nó XOÁ luôn màu của
   chế độ tối — chọn đúng hay sai đều ra nền trắng như nhau. Phải khai báo lại ở đúng
   mức ưu tiên đó. MÀU thì KHÔNG dùng lại của chế độ tối: nền trắng cần màu ĐẬM hơn hẳn mới nổi
   — xem lý do đo được ở khối ngay dưới. */
/* 19/9/2026 — viền "đúng" đổi --green (#10b981, chỉ 2,54:1 trên thẻ trắng) → **#059669 = 3,77:1**,
   tức mạnh hơn hẳn viền bình thường (#96a2af 2,60:1). Trước lượt này đáp án ĐÚNG có viền MỜ HƠN
   cả một ô chưa trả lời — đúng cái người dùng hỏi ("chọn sai thì đáp án đúng có còn nổi bật
   không"). Viền "sai" giữ --red #ef4444 (3,76:1 — vốn đã đủ mạnh, và trùng đúng màu đỏ mà nút
   nguy hiểm ở chế độ sáng đang dùng), chỉ hạ tint.
   Tint 0,15 → 0,12 ở CẢ HAI: chữ đáp án #5f6b7c trên nền xanh 4,68:1 (đã đạt, giữ được 4,67:1)
   và trên nền đỏ chỉ 4,45:1 — DƯỚI ngưỡng 4,5:1 — nay **4,64:1**.
   Kết quả: viền 3,77 và 3,76 — hai trạng thái CÂN NHAU về độ mạnh, thay vì lệch như trước. */
body.light-mode .quiz-opt.correct { border-color: #059669; background: rgba(5,150,105,0.12); }
body.light-mode .quiz-opt.wrong { border-color: var(--red); background: rgba(239,68,68,0.12); }
/* Chip bật/tắt ở chế độ sáng: chữ xanh nhạt --accent-glow (#60a5fa) trên nền chip
   xanh nhạt chỉ đạt 2.06:1 — không đọc được. Đổi sang xanh đậm, vì giờ trạng thái
   BẬT chỉ hiện bằng màu (nhãn không còn kèm “: Bật”). Đậm thêm lần nữa theo yêu cầu
   (18/9/2026): #1d4ed8 → #1e40af, đo được 7.45:1 trên nền chip ở chế độ sáng. */
/* Chip ĐANG BẬT ở chế độ SÁNG cũng đậm hơn cùng lượt: nền 0,14 → **0,26**, viền và chữ giữ
   nguyên (viền #1d4ed8 = 6,70:1 trên nền trắng, chữ #1e40af = 6,43:1 trên nền đã pha).
   Ở đây KHÔNG dùng chữ trắng như chế độ tối: nền sáng nên chữ trắng là không đọc được — đúng
   quy ước "đậm ở sáng, trắng ở tối" của app. */
body.light-mode .quiz-toggle.on { background: rgba(59,130,246,0.26); border-color: #1d4ed8; color: #1e40af; }
/* Số câu (viền đỏ) ở chế độ sáng: --red #ef4444 trên thẻ trắng chỉ đạt 3.76:1 —
   hơi mờ cho một con số nhỏ. Dùng #dc2626 (đúng màu đỏ mà chế độ sáng đã dùng ở
   .quiz-btn.danger) → 4.53:1, vượt ngưỡng dễ đọc. */
body.light-mode .q-num { border-color: #dc2626; color: #dc2626; }
/* Hộp phản hồi ✅/❌: chế độ sáng dùng 0.12 còn chế độ tối 0.14 — chênh 2% độ trong
   suốt, không nhìn ra được, nhưng để y hệt chế độ tối thì lấy 0.14 cho cả hai. */
body.light-mode .quiz-fb.ok { background: rgba(16,185,129,0.14); }

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
// ── HELPERS ────────────────────────────────────────────────────────────
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
// Bỏ dấu tiếng Việt + hạ chữ thường (dùng cho tìm kiếm/so khớp)
function normVn(s) { return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
// normVn() bỏ dấu được nhưng chữ "đ" không phân rã NFD được, nên phải đổi thủ công.
function quizNormBase(s) { return normVn(String(s == null ? '' : s)).replace(/đ/g, 'd'); }
function quizKey(s) { return quizNormBase(s).replace(/[_\s]/g, ''); }
function quizText(s) { return quizNormBase(s).replace(/\s+/g, ' ').trim(); }

// Đọc file thành workbook. File CSV/txt được tự giải mã UTF-8, vì SheetJS mặc định
// đọc CSV theo codepage Latin-1 nên tiếng Việt sẽ bị sai dấu và không khớp tên cột.
function readWorkbook(arrayBuffer, fileName) {
  const bytes = new Uint8Array(arrayBuffer);
  if (/\.(csv|txt|tsv)$/i.test(String(fileName || ''))) {
    let text = new TextDecoder('utf-8').decode(bytes);
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1); // bỏ BOM nếu có
    return XLSX.read(text, { type: 'string' });
  }
  return XLSX.read(bytes, { type: 'array' });
}

function shuffleArr(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

// ── CLOCK ──────────────────────────
function updateLiveClock() {
  const el = document.getElementById('clockLive');
  const dateEl = document.getElementById('clockDateLive');
  if (!el) return;
  const now = new Date();
  el.textContent = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
  if (dateEl) {
    const days = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
    dateEl.textContent = days[now.getDay()] + ', ' + now.getDate() + '/' + (now.getMonth() + 1) + '/' + String(now.getFullYear()).slice(-2);
  }
}
updateLiveClock();
setInterval(updateLiveClock, 1000);

function showClock() {
  let overlay = document.getElementById('clockOverlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'clockOverlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:9999;display:flex;align-items:center;justify-content:center';
    overlay.onclick = function(e) { if (e.target === overlay) overlay.style.display = 'none'; };
    const box = document.createElement('div');
    box.style.cssText = 'background:var(--navy-mid);border-radius:20px;padding:32px 40px;text-align:center;box-shadow:0 16px 48px rgba(0,0,0,0.5);min-width:240px';
    box.innerHTML = '<div id="clockDigital" style="font-size:49px;font-weight:200;color:#60a5fa;letter-spacing:2px"></div>' +
      '<div id="clockDate" style="font-size:15px;font-weight:400;color:#94a3b8;margin-top:8px"></div>';
    overlay.appendChild(box);
    document.body.appendChild(overlay);
  }
  overlay.style.display = 'flex';
  (function tick() {
    if (overlay.style.display === 'none') return;
    const now = new Date();
    document.getElementById('clockDigital').textContent =
      String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0') + ':' + String(now.getSeconds()).padStart(2, '0');
    const days = ['Chủ nhật', 'Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7'];
    const months = ['Tháng 1', 'Tháng 2', 'Tháng 3', 'Tháng 4', 'Tháng 5', 'Tháng 6', 'Tháng 7', 'Tháng 8', 'Tháng 9', 'Tháng 10', 'Tháng 11', 'Tháng 12'];
    document.getElementById('clockDate').textContent =
      days[now.getDay()] + ', ' + now.getDate() + ' ' + months[now.getMonth()] + ' ' + now.getFullYear();
    requestAnimationFrame(tick);
  })();
}

let _mix = { total: MIX_DEFAULT_TOTAL, pct: {}, locked: {} };   // pct[setId] = phần trăm của bộ đó trong đề trộn

function quizNewId(prefix) { return (prefix || 'q') + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function normalizeQ(q) {
  const out = {
    id: (q && q.id) ? String(q.id) : quizNewId(),
    q: String((q && q.q) || ''),
    options: (q && Array.isArray(q.options)) ? q.options.map(function (o) { return String(o); }) : [],
    correct: (q && typeof q.correct === 'number') ? q.correct : 0,
    explain: (q && typeof q.explain === 'string') ? q.explain : ''
  };
  if (!out.q || out.options.length < 2) return null;
  if (out.correct < 0 || out.correct >= out.options.length) out.correct = 0;
  return out;
}

function normalizeSet(s) {
  return {
    id: (s && s.id) ? String(s.id) : quizNewId('s'),
    name: String((s && s.name) || 'Bộ đề'),
    addedAt: (s && s.addedAt) || Date.now(),
    questions: ((s && Array.isArray(s.questions)) ? s.questions : []).map(normalizeQ).filter(Boolean)
  };
}

function loadLib() {
  let raw = null;
  try { raw = localStorage.getItem(LIB_KEY); } catch (e) { raw = null; }

  if (raw === null) {                    // lần đầu chạy bản nhiều bộ đề
    let old = [];
    try { old = JSON.parse(localStorage.getItem(LEGACY_KEY) || '[]'); } catch (e) { old = []; }
    quizLib = [];
    const qs = (Array.isArray(old) ? old : []).map(normalizeQ).filter(Boolean);
    if (qs.length) quizLib.push(normalizeSet({ name: OLD_SET_NAME, questions: qs }));
    saveLib();
    return;
  }

  let parsed = [];
  try { parsed = JSON.parse(raw); } catch (e) { parsed = []; }
  quizLib = (Array.isArray(parsed) ? parsed : [])
    .map(normalizeSet)
    .filter(function (s) { return s.questions.length; });
}

function saveLib() {
  try { localStorage.setItem(LIB_KEY, JSON.stringify(quizLib)); }
  catch (e) { alert('Không lưu được thư viện: ' + ((e && e.message) || e)); }
}

function libSet(id) {
  for (let i = 0; i < quizLib.length; i++) if (quizLib[i].id === id) return quizLib[i];
  return null;
}
function curSet() { return libSet(_libSetId) || quizLib[0] || null; }
function totalQuestions() { return quizLib.reduce(function (n, s) { return n + s.questions.length; }, 0); }

function updateBankLabel() {
  const el = document.getElementById('bankLabel');
  if (!el) return;
  const n = totalQuestions();
  el.textContent = quizLib.length ? (quizLib.length + ' bộ đề · ' + n + ' câu') : 'Chưa có bộ đề';
}

// ── RENDER ──────────────────────────
function renderQuiz() {
  const pane = document.getElementById('quizPane');
  if (!pane) return;
  updateBankLabel();
  if (_quizMode === 'browse') { pane.innerHTML = quizBrowseHtml(); return; }
  if (_quizMode === 'play') { pane.innerHTML = quizPlayHtml(); return; }
  if (_quizMode === 'playAll') { pane.innerHTML = quizAllHtml(); updateAllSummary(); return; }
  if (_quizMode === 'study') { pane.innerHTML = quizStudyHtml(); updateStudySummary(); return; }
  if (_quizMode === 'result') { pane.innerHTML = quizResultHtml(); return; }
  pane.innerHTML = quizHomeHtml();
  paintMix();
}

// Chip bật/tắt. Nhãn KHÔNG kèm “: Bật/Tắt” nữa — hai chip này phải nằm chung một
// hàng ở khung nhìn 311px (chỗ trống 266px), mà “Đảo câu hỏi: Bật” + “Đảo đáp
// án: Bật” cần 309px. Trạng thái hiện bằng MÀU (chip đang bật có nền xanh, viền
// và chữ xanh) và ghi rõ ở `title` để vẫn tra được khi trỏ chuột.
function quizToggleHtml(key, label) {
  const on = !!_quizOpts[key];
  return `<button class="quiz-toggle chip${on ? ' on' : ''}" onclick="toggleQuizOpt('${key}')"`
    + ` title="${label}: đang ${on ? 'BẬT' : 'TẮT'} — bấm để ${on ? 'tắt' : 'bật'}">${label}</button>`;
}
function toggleQuizOpt(k) { _quizOpts[k] = !_quizOpts[k]; renderQuiz(); }

// Một ô trong hàng 2×2: ô ĐANG được chọn dùng kiểu xanh (.primary), các ô còn lại kiểu
// viền. Hai kiểu cùng cỡ nên đổi màu KHÔNG làm nút nhảy kích thước.
function setActBtn(setId, key, label, title, off) {
  const on = isSetActOn(setId, key);
  return '<button class="quiz-btn' + (on ? ' primary' : '') + '" data-set-act="' + key + '"'
    + (off || '')
    + ' onclick="useSetAct(\'' + setId + '\',\'' + key + '\')"'
    + (title ? ' title="' + title + '"' : '')
    + (on ? ' aria-current="true"' : '') + '>' + label + '</button>';
}

// ── DROPDOWN CHỌN BỘ ĐỀ (tự vẽ, 19/9/2026) ──
// Thay cho `onSetSelect()` của `<select>` cũ. Ba hàm nhỏ, đọc DOM tại thời điểm gọi vì
// `renderQuiz()` dựng lại toàn bộ thẻ sau mỗi lần chọn.
function toggleSetDd() {
  const list = document.getElementById('setDdList');
  if (!list) return;
  const box = document.getElementById('setDd');
  const btn = document.getElementById('setDdBtn');
  const dangMo = !list.hasAttribute('hidden');
  if (dangMo) { closeSetDd(); return; }
  list.removeAttribute('hidden');
  if (box) box.classList.add('open');
  if (btn) btn.setAttribute('aria-expanded', 'true');
}
function closeSetDd() {
  const list = document.getElementById('setDdList');
  if (list) list.setAttribute('hidden', '');
  const box = document.getElementById('setDd');
  if (box) box.classList.remove('open');
  const btn = document.getElementById('setDdBtn');
  if (btn) btn.setAttribute('aria-expanded', 'false');
}
// Chọn một bộ: nhớ bộ đó rồi VẼ LẠI cả thẻ — nhãn trên nút, hàng được tô xanh và hàng nút làm bài
// đều phải đổi cùng lúc. Không cần đóng danh sách trước vì `renderQuiz()` dựng lại DOM và danh
// sách mới luôn bắt đầu ở trạng thái đóng.
function pickSet(id) {
  if (!libSet(id)) return;
  _libSetId = id;
  saveSetAct();
  renderQuiz();
}
// Đóng khi bấm ra ngoài hoặc bấm Esc. Đăng ký MỘT LẦN ở cấp document (không đăng ký lại mỗi lần
// vẽ thẻ), và tra `#setDd` tại thời điểm sự kiện — nếu tra lúc đăng ký thì sau lần render đầu
// tiên nút đã là một node mới và `contains()` sẽ luôn sai.
// Bấm vào chính nút mở cũng nổi bọt lên đây, nhưng `contains()` đúng nên không đóng ngay sau khi mở.
document.addEventListener('click', ev => {
  const box = document.getElementById('setDd');
  if (box && !box.contains(ev.target)) closeSetDd();
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeSetDd(); });

function useSetAct(setId, key) {
  if (!SET_ACTS[key]) return;
  _setActSel = { setId: setId, key: key };
  saveSetAct();
  if (key === 'browse') openBrowse(setId);
  else startSetExam(setId, key);
}

function quizHomeHtml() {
  const nQ = totalQuestions();
  let h = '';

  // ── Thanh tìm kiếm ── (NGOÀI thẻ, ngay dưới thanh xanh trên cùng)
  if (quizLib.length) {
    // `.search-field` là gốc định vị CHỈ cho ô nhập (icon 🔍 bên trái, nút ✕ bên phải). Không thể
    // để chúng định vị theo `.search-wrap` được: trong wrap còn cả danh sách kết quả (cao tới
    // 360px), nên `top: 50%` sẽ rơi xuống GIỮA DANH SÁCH KẾT QUẢ — đúng lỗi đã thấy trong ảnh chụp
    // (ô chỉ cao ~44px). Cùng lỗi này trước đó cũng làm icon 🔍 lạc chỗ mỗi khi có kết quả.
    h += '<div class="search-wrap"><div class="search-field">';
    h += '<span class="search-icon">🔍</span>';
    h += '<input id="searchInput" class="search-input" type="text" placeholder="Tìm kiếm câu hỏi..." oninput="onSearch()">';
    // Nút ✕ xoá nhanh. `onpointerdown="event.preventDefault()"` là BẮT BUỘC: thiếu nó thì cú chạm
    // làm ô nhập MẤT TIÊU ĐIỂM và bàn phím trên điện thoại đóng lại — mà `clearSearch()` lại vừa
    // `focus()` trở lại, thành ra bàn phím nhấp nháy. `hidden` từ đầu vì ô mới luôn rỗng.
