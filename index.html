<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1b2d">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Trắc Nghiệm</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800&display=swap');

:root {
  --navy: #111318;
  --navy-mid: #1a1d24;
  --accent: #3b82f6;
  --accent-glow: #60a5fa;
  --gold: #f59e0b;
  --red: #ef4444;
  --green: #10b981;
  --text: #e2e8f0;
  --text-dim: #94a3b8;
  --answer: #9aa8bb;   /* chữ đáp án ở chế độ tối: nhạt hơn hẳn chữ câu hỏi (#e2e8f0) cho đỡ chói */
  --set-box-bg: #262a33;   /* nền hộp từng bộ đề — xám đậm ở chế độ tối, xám nhạt ở chế độ sáng */
  --border: rgba(255,255,255,0.22);   /* viền ô ở chế độ tối: rõ hơn 0.08 cũ */
  --card: rgba(255,255,255,0.04);
  --radius: 12px;
  --header-h: 56px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Inter', sans-serif;
  font-size: 17px;   /* nền chung cho chữ không tự đặt cỡ, khớp mức +1px của cả app */
  background: var(--navy);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
  touch-action: manipulation;
  transition: background 0.4s ease, color 0.4s ease;
}

/* ── HEADER ───────────────────────── */
.header {
  background:
    linear-gradient(135deg, rgba(255,255,255,0.14), rgba(255,255,255,0) 40%),
    linear-gradient(135deg, #1d4ed8, #1e3a8a);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 3px 10px rgba(0,0,0,0.35);
  height: calc(var(--header-h) + env(safe-area-inset-top, 0px));
  padding: env(safe-area-inset-top, 0px) 10px 0 8px;
  display: flex;
  align-items: center;
  gap: 12px;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 200;
}
.header-left { display: flex; align-items: center; gap: 6px; min-width: 0; }
.title-wrap { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
.header-title { font-size: 17px; font-weight: 500; letter-spacing: 0.3px; color: #ffffff; white-space: nowrap; }
.header-sub { font-size: 15px; font-weight: 400; color: #cbd5e1; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
.header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.theme-toggle {
  width: 44px; height: 44px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  position: relative;
  padding: 0;
  background: transparent;
  flex-shrink: 0;
}
.theme-toggle img {
  width: 100%; height: 100%;
  border-radius: 50%; object-fit: contain; display: block;
}
.theme-toggle:active { transform: scale(0.9); }

.upload-btn-header {
  background: transparent; color: #ffffff; border: none;
  padding: 6px 10px; border-radius: 8px;
  cursor: pointer; display: flex; flex-direction: column;
  align-items: center; line-height: 1.1; gap: 0;
  font-family: 'Inter', sans-serif; flex-shrink: 0;
}
.upload-btn-header:active { background: rgba(203,213,225,0.4); }

/* ── MAIN ───────────────────────── */
.main { padding: 0 8px 60px; }

/* ── BUTTONS ───────────────────────── */
.big-upload-btn {
  padding: 12px 18px;
  border: none;
  border-radius: 10px;
  background: var(--accent);
  color: #ffffff;
  font-family: 'Inter', sans-serif;
  font-size: 17px;
  font-weight: 500;
  cursor: pointer;
}
.big-upload-btn:active { opacity: 0.9; }
.big-upload-btn:disabled { opacity: 0.45; cursor: not-allowed; }

.quiz-btn {
  padding: 9px 12px; border-radius: 9px; cursor: pointer;
  border: 1px solid var(--border); background: var(--navy-mid); color: var(--text);
  font-family: 'Inter', sans-serif; font-size: 17px; font-weight: 500;
}
.quiz-btn.primary { background: var(--accent); color: #ffffff; border-color: var(--accent); }
.quiz-btn.danger { background: var(--red); color: #ffffff; border-color: var(--red); }
.quiz-btn:active { opacity: 0.85; }

.quiz-toggle {
  padding: 7px 10px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--border); background: transparent; color: var(--text-dim);
  font-family: 'Inter', sans-serif; font-size: 17px; font-weight: 500;
}
.quiz-toggle.on { background: rgba(59,130,246,0.18); border-color: var(--accent); color: var(--accent-glow); }

/* Hai chip bật/tắt trên trang chủ nằm CHUNG MỘT HÀNG.
   Đo bằng canvas ở cỡ 17px: “Đảo câu hỏi” 96.3px, “Đảo đáp án” 92.2px. Cộng
   padding 8px mỗi bên và gap 8px thì cần 228.5px — vừa khung nhìn 311px (thẻ
   rộng 266px). Bản cũ “Đảo câu hỏi: Bật” + “Đảo đáp án: Bật” cần 309px nên mỗi
   cái phải xuống một hàng; thêm icon 🔀 còn tốn thêm ~56px nữa.
   `auto-fit` + `minmax(120px, 1fr)` cho hai cột BẰNG NHAU khi đủ chỗ, và tự dồn
   thành một cột khi cửa sổ hẹp hơn ~248px — không bao giờ tràn chữ. */
.chip-row {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 8px; margin-top: 10px;
}
.quiz-toggle.chip { padding: 7px 8px; text-align: center; }

/* Ba nút thư viện trên trang chủ: cùng MỘT hàng, mỗi nhãn một dòng.
   Đo bằng canvas tại cửa sổ 311px (chỗ trống trong thẻ 265px), cỡ 17px:
   "Chọn file" 72.8px, "Chọn thư mục" 114.2px, "Thư viện" 70.9px. Cả ba nhãn đầy
   đủ cần 294px — không vừa. Đã thử `flex: 1 1 0` (chia đều 83px mỗi nút): nhãn
   "Chọn thư mục" bị bẻ thành 3 dòng. Nên: rút nhãn còn "Chọn file"/"Thư mục"/
   "Thư viện" (248px với padding 5px + gap 6px, dư ~17px) — giữ cỡ 17px, không
   phải thu nhỏ chữ.
   `flex: 1 1 auto` (không phải `1 1 0`) để bề ngang thả theo nội dung; `flex-wrap:
   wrap` là lưới an toàn cho cửa sổ hẹp hơn nữa — nút cuối xuống hàng dưới chứ
   KHÔNG bị cắt chữ (đừng dùng `white-space: nowrap`: nó tràn chữ ra ngoài nút
   ngay khi flex phải co lại).
   Không emoji trong ba nhãn: “📁 ” chiếm 28px, đủ đẩy tổng vượt 265px.
   `width:auto` để thắng `width:100%` của .big-upload-btn, và lớp này đặt sau nên
   đè được padding 12px 18px của nút đó. */
.lib-act {
  flex: 1 1 auto; min-width: 0; width: auto;
  padding: 9px 5px;
  text-align: center;
}
.lib-act-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }

/* ── QUIZ ───────────────────────── */
.quiz-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px; margin: 10px 0;
}
.quiz-input {
  width: 100%; padding: 10px; border-radius: 10px;
  border: 1.5px solid var(--border); background: var(--navy-mid);
  color: var(--text); font-family: 'Inter', sans-serif; font-size: 17px; font-weight: 500;
}
.quiz-input:focus { outline: none; border-color: var(--accent); }
.quiz-opt {
  display: flex; align-items: flex-start; gap: 10px; width: 100%;
  text-align: left; padding: 12px; margin-bottom: 8px;
  border-radius: 10px; border: 1.5px solid var(--border);
  background: var(--navy-mid); color: var(--answer);
  font-family: 'Inter', sans-serif; font-size: 16px; line-height: 1.5;
  font-weight: 500;   /* câu trả lời: 16px, nét 500 */
  cursor: pointer;
}
.quiz-opt:disabled { cursor: default; }
.quiz-opt.correct { border-color: var(--green); background: rgba(16,185,129,0.15); }
.quiz-opt.wrong { border-color: var(--red); background: rgba(239,68,68,0.15); }
.quiz-badge {
  min-width: 22px; height: 22px; border-radius: 50%;
  background: var(--accent); color: #ffffff;
  font-size: 13px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.quiz-opt .mark { font-size: 16px; line-height: 1.2; flex-shrink: 0; }
/* Số câu đặt trước nội dung câu hỏi. Thay icon ❓ emoji ở lượt trước: emoji rộng
   19px mà không mang thông tin gì, còn vòng tròn mang luôn SỐ CÂU nên bỏ được dòng
   nhãn “Câu 1/30” trên mỗi thẻ — trang ngắn hơn hẳn.
   Kiểu: KHÔNG có nền, chỉ một viền đỏ mảnh + số màu đỏ (yêu cầu người dùng — trước
   đó là nền xanh đặc như huy hiệu A/B/C/D). Vì không còn nền nên viền phải là
   `1px solid` chứ không phải nền mờ, nếu không số sẽ trôi trên nền thẻ.
   Dài ra thành viên thuốc khi số có 2-3 chữ số: bài trộn mặc định 100 câu nên
   “100” phải vừa.
   Cỡ số 13px trên vòng 20px (người dùng thấy 12px hơi nhỏ). Vòng chỉ tăng 1px vì
   bề ngang của vòng chính là bề ngang câu hỏi bị lấy đi — đo trên bộ 30 câu: tổng
   số dòng phải xuống thêm không đổi so với vòng 19px. `margin-top: 2px` giữ số
   nằm giữa dòng chữ đầu (hộp 20px trong dòng 24px). */
.q-num {
  min-width: 20px; height: 20px; border-radius: 10px; padding: 0 5px;
  box-sizing: border-box; background: transparent;
  border: 1px solid var(--red); color: var(--red);
  font-size: 13px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-top: 2px;
}
.quiz-fb {
  display: none; margin-top: 6px; padding: 10px 11px;
  border-radius: 10px; font-size: 16px; line-height: 1.5;
}
.quiz-fb.show { display: block; }
.quiz-fb.ok { background: rgba(16,185,129,0.14); border: 1px solid var(--green); }
.quiz-fb.no { background: rgba(239,68,68,0.14); border: 1px solid var(--red); }
.quiz-all-head {
  position: sticky; z-index: 5;
  top: calc(var(--header-h) + env(safe-area-inset-top, 0px));
}

/* ── ĐẦU MÀN LÀM BÀI ─────────────────
   Hàng đầu của mọi màn làm bài: nút về trang chủ + tiêu đề bộ đề.
   Nút nằm BÊN TRÁI HÀNG TIÊU ĐỀ — vị trí chuẩn của nút quay lại, và cũng là chỗ
   rẻ nhất về chiều cao. Ba phương án đã đo ở khung nhìn 393px (thẻ 349px):
   - Cạnh tiêu đề (đang dùng): ô tiêu đề còn 298px. Tiêu đề ngắn (“Văn hóa doanh
     nghiệp · 30 câu” 253px) vẫn một dòng; vài tên dài thêm một dòng.
   - Cạnh dòng tóm tắt: tiêu đề giữ nguyên, nhưng ở khung nhìn 311px dòng tóm tắt
     “Đã trả lời … · Đúng … · Sai …” cần 218.5px + nút 51px = 269px mà chỉ có
     249px → tóm tắt bị ngắt thành hai dòng, xấu hơn ngắt tiêu đề.
   - Hàng riêng cho nút: đầu bài cao thêm ~30px ở mọi bề ngang.
   Nút chỉ dùng emoji 🏠 (23px chữ): nhãn “Trang chủ” cần 103px + padding, đủ để
   ngốn thêm 80px bề ngang của tiêu đề. */
.head-row { display: flex; align-items: center; gap: 8px; }
.home-btn { padding: 6px 9px; line-height: 1; font-size: 17px; flex-shrink: 0; }
/* (Icon ❓ emoji ở lượt trước đã bị thay bằng .q-num — xem khai báo .q-num ở trên.) */
/* Ghi chú cũ của icon ❓, giữ lại để biết vì sao không quay lại emoji ở cỡ chữ lớn:
   emoji ở 16px rộng 22px, cộng khe 8px là lấy mất 30px bề ngang câu hỏi — đo trên
   bộ Văn hóa doanh nghiệp thì 10/30 câu phải xuống thêm một dòng.

/* Bốn nút làm bài của mỗi bộ đề: lưới 2×2 với hai cột BẰNG NHAU.
   Trước đây là flex-wrap nên mỗi nút rộng theo nhãn — hàng trên [Từng câu][Cả bộ]
   và hàng dưới [Học][Câu hỏi] lệch cỡ nhau, nhìn như lỗi. Lưới 2 cột cho cả bốn
   nút cùng bề ngang và cùng chiều cao.
   Padding ngang co từ 12px xuống 6px để nhãn dài nhất “▶️ Từng câu” (≈93px) vẫn
   nằm một dòng: ở khung nhìn 311px mỗi cột chỉ còn ≈120px, trừ 12px padding là
   ≈108px chỗ cho chữ. Bốn nút trên MỘT hàng là không thể ở cỡ 17px (mỗi nút chỉ
   còn ≈78px, không đủ cho nhãn), nên 2×2 là cách duy nhất để cả bốn đều nhau. */
.set-acts {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 9px;
  grid-auto-rows: 1fr;   /* cửa sổ rất hẹp: có nhãn phải xuống 2 dòng thì cả bốn nút vẫn cao bằng nhau */
}
.set-acts .quiz-btn { width: 100%; padding: 9px 6px; text-align: center; }

/* ── MODAL ───────────────────────── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 300;
  align-items: flex-end;
  justify-content: center;
}
.modal-overlay.open { display: flex; }

.modal {
  background: #1a1d24;
  border: 1px solid var(--border);
  font-family: 'Inter', sans-serif;
  border-radius: 20px 20px 0 0;
  width: 100%;
  max-width: 560px;
  max-height: 85vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
@media (min-width: 640px) {
  .modal-overlay { align-items: center; padding: 24px; }
  .modal { border-radius: 16px; max-height: 80vh; }
}
.modal-handle {
  width: 36px; height: 3px;
  background: rgba(255,255,255,0.2);
  border-radius: 2px;
  margin: 5px auto 0;
}
.modal-body { padding: 4px 12px 20px; }

/* ── LIGHT MODE ───────────────────────── */
/* Nền chế độ sáng: trắng xám để các thẻ trắng nổi rõ. Thẻ và ô nhập vẫn trắng. */
/* --text-dim đậm hơn #64748b một chút: hộp từng bộ đề giờ có nền xám #f1f3f5, mà
   #64748b trên xám đó chỉ đạt 4.31:1 (dưới ngưỡng 4.5:1). #5b6675 cho 5.27:1 trên
   nền xám và 5.83:1 trên thẻ trắng. */
body.light-mode { background: #e9ecef; color: #000000; --text-dim: #5b6675; --border: rgba(0,0,0,0.22); --answer: #1e293b; --set-box-bg: #f1f3f5; }

/* Hộp từng bộ đề trên trang chủ (📝 Thi từng bộ đề) có nền riêng để tách khỏi thẻ
   chứa nó: xám ĐẬM #262a33 ở chế độ tối (thẻ tối chỉ ≈#1b1c21 nên hộp nhỉnh lên,
   đọc ra là một tấm riêng), xám NHẠT #f1f3f5 ở chế độ sáng (thẻ trắng nên hộp lùi
   xuống). Một biến duy nhất, không phải hai luật chồng nhau. */
.set-box { background: var(--set-box-bg); }
body.light-mode .header {
  background:
    linear-gradient(135deg, rgba(255,255,255,0.22), rgba(255,255,255,0) 42%),
    linear-gradient(135deg, #2563eb, #1e40af);
  box-shadow: 0 3px 10px rgba(30,64,175,0.35);
}
body.light-mode .header-sub { color: #dbeafe; }
body.light-mode .modal { background: #f0f1f4; }
body.light-mode .modal-handle { background: rgba(0,0,0,0.15); }
body.light-mode .quiz-card { background: #ffffff; border-color: #c9d1da; }
body.light-mode .quiz-input { background: #ffffff; border-color: #b3bfcc; color: #1e293b; }
body.light-mode .quiz-btn { background: #ffffff; border-color: #b3bfcc; color: #1e293b; }
body.light-mode .quiz-btn.primary { background: #2563eb; color: #ffffff; border-color: #2563eb; }
body.light-mode .quiz-btn.danger { background: #dc2626; color: #ffffff; border-color: #dc2626; }
body.light-mode .quiz-opt { background: #ffffff; border-color: #b3bfcc; color: #1e293b; }
/* Đáp án đã chọn ở CHẾ ĐỘ SÁNG phải hiện xanh/đỏ y như chế độ tối.
   Luật `body.light-mode .quiz-opt` ở ngay trên có độ ưu tiên cao hơn
   `.quiz-opt.correct/.wrong` (2 class + 1 thẻ so với 2 class), nên nó XOÁ luôn màu của
   chế độ tối — chọn đúng hay sai đều ra nền trắng như nhau. Phải khai báo lại ở đúng
   mức ưu tiên đó, và dùng đúng hai màu mà chế độ tối dùng. */
body.light-mode .quiz-opt.correct { border-color: var(--green); background: rgba(16,185,129,0.15); }
body.light-mode .quiz-opt.wrong { border-color: var(--red); background: rgba(239,68,68,0.15); }
/* Chip bật/tắt ở chế độ sáng: chữ xanh nhạt --accent-glow (#60a5fa) trên nền chip
   xanh nhạt chỉ đạt 2.06:1 — không đọc được. Đổi sang xanh đậm, vì giờ trạng thái
   BẬT chỉ hiện bằng màu (nhãn không còn kèm “: Bật”). #1d4ed8 cho 5.43:1. */
body.light-mode .quiz-toggle.on { background: rgba(59,130,246,0.14); border-color: #2563eb; color: #1d4ed8; }
/* Số câu (viền đỏ) ở chế độ sáng: --red #ef4444 trên thẻ trắng chỉ đạt 3.76:1 —
   hơi mờ cho một con số nhỏ. Dùng #dc2626 (đúng màu đỏ mà chế độ sáng đã dùng ở
   .quiz-btn.danger) → 4.53:1, vượt ngưỡng dễ đọc. */
body.light-mode .q-num { border-color: #dc2626; color: #dc2626; }
/* Hộp phản hồi ✅/❌: chế độ sáng dùng 0.12 còn chế độ tối 0.14 — chênh 2% độ trong
   suốt, không nhìn ra được, nhưng để y hệt chế độ tối thì lấy 0.14 cho cả hai. */
body.light-mode .quiz-fb.ok { background: rgba(16,185,129,0.14); }
body.light-mode .quiz-fb.no { background: rgba(239,68,68,0.14); }
body.light-mode .arc-item { background: #ffffff !important; border-color: #c9d1da !important; }

#quizFileInput, #quizDirInput, #quizRestoreInput { display: none; }
</style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// ── HELPERS ────────────────────────────────────────────────────────────
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
// Bỏ dấu tiếng Việt + hạ chữ thường (dùng cho tìm kiếm/so khớp)
function normVn(s) { return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
// normVn() bỏ dấu được nhưng chữ "đ" không phân rã NFD được, nên phải đổi thủ công.
function quizNormBase(s) { return normVn(String(s == null ? '' : s)).replace(/đ/g, 'd'); }
function quizKey(s) { return quizNormBase(s).replace(/[_\s]/g, ''); }
function quizText(s) { return quizNormBase(s).replace(/\s+/g, ' ').trim(); }

// Đọc file thành workbook. File CSV/txt được tự giải mã UTF-8, vì SheetJS mặc định
// đọc CSV theo codepage Latin-1 nên tiếng Việt sẽ bị sai dấu và không khớp tên cột.
function readWorkbook(arrayBuffer, fileName) {
  const bytes = new Uint8Array(arrayBuffer);
  if (/\.(csv|txt|tsv)$/i.test(String(fileName || ''))) {
    let text = new TextDecoder('utf-8').decode(bytes);
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1); // bỏ BOM nếu có
    return XLSX.read(text, { type: 'string' });
  }
  return XLSX.read(bytes, { type: 'array' });
}

function shuffleArr(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

// ── CLOCK ──────────────────────────
function updateLiveClock() {
  const el = document.getElementById('clockLive');
  const dateEl = document.getElementById('clockDateLive');
  if (!el) return;
  const now = new Date();
  el.textContent = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
  if (dateEl) {
    const days = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
    dateEl.textContent = days[now.getDay()] + ', ' + now.getDate() + '/' + (now.getMonth() + 1) + '/' + String(now.getFullYear()).slice(-2);
  }
}
updateLiveClock();
setInterval(updateLiveClock, 1000);

function showClock() {
  let overlay = document.getElementById('clockOverlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'clockOverlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:9999;display:flex;align-items:center;justify-content:center';
    overlay.onclick = function(e) { if (e.target === overlay) overlay.style.display = 'none'; };
    const box = document.createElement('div');
    box.style.cssText = 'background:#1a1d24;border-radius:20px;padding:32px 40px;text-align:center;box-shadow:0 16px 48px rgba(0,0,0,0.5);min-width:240px';
    box.innerHTML = '<div id="clockDigital" style="font-size:49px;font-weight:200;color:#60a5fa;letter-spacing:2px"></div>' +
      '<div id="clockDate" style="font-size:15px;font-weight:400;color:#94a3b8;margin-top:8px"></div>';
    overlay.appendChild(box);
    document.body.appendChild(overlay);
  }
  overlay.style.display = 'flex';
  (function tick() {
    if (overlay.style.display === 'none') return;
    const now = new Date();
    document.getElementById('clockDigital').textContent =
      String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0') + ':' + String(now.getSeconds()).padStart(2, '0');
    const days = ['Chủ nhật', 'Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7'];
    const months = ['Tháng 1', 'Tháng 2', 'Tháng 3', 'Tháng 4', 'Tháng 5', 'Tháng 6', 'Tháng 7', 'Tháng 8', 'Tháng 9', 'Tháng 10', 'Tháng 11', 'Tháng 12'];
    document.getElementById('clockDate').textContent =
      days[now.getDay()] + ', ' + now.getDate() + ' ' + months[now.getMonth()] + ' ' + now.getFullYear();
    requestAnimationFrame(tick);
  })();
}

function quizNewId(prefix) { return (prefix || 'q') + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function normalizeQ(q) {
  const out = {
    id: (q && q.id) ? String(q.id) : quizNewId(),
    q: String((q && q.q) || ''),
    options: (q && Array.isArray(q.options)) ? q.options.map(function (o) { return String(o); }) : [],
    correct: (q && typeof q.correct === 'number') ? q.correct : 0,
    explain: (q && typeof q.explain === 'string') ? q.explain : ''
  };
  if (!out.q || out.options.length < 2) return null;
  if (out.correct < 0 || out.correct >= out.options.length) out.correct = 0;
  return out;
}

function normalizeSet(s) {
  return {
    id: (s && s.id) ? String(s.id) : quizNewId('s'),
    name: String((s && s.name) || 'Bộ đề'),
    addedAt: (s && s.addedAt) || Date.now(),
    questions: ((s && Array.isArray(s.questions)) ? s.questions : []).map(normalizeQ).filter(Boolean)
  };
}

function loadLib() {
  let raw = null;
  try { raw = localStorage.getItem(LIB_KEY); } catch (e) { raw = null; }

  if (raw === null) {                    // lần đầu chạy bản nhiều bộ đề
    let old = [];
    try { old = JSON.parse(localStorage.getItem(LEGACY_KEY) || '[]'); } catch (e) { old = []; }
    quizLib = [];
    const qs = (Array.isArray(old) ? old : []).map(normalizeQ).filter(Boolean);
    if (qs.length) quizLib.push(normalizeSet({ name: OLD_SET_NAME, questions: qs }));
    saveLib();
    return;
  }

  let parsed = [];
  try { parsed = JSON.parse(raw); } catch (e) { parsed = []; }
  quizLib = (Array.isArray(parsed) ? parsed : [])
    .map(normalizeSet)
    .filter(function (s) { return s.questions.length; });
}

function saveLib() {
  try { localStorage.setItem(LIB_KEY, JSON.stringify(quizLib)); }
  catch (e) { alert('Không lưu được thư viện: ' + ((e && e.message) || e)); }
}

function libSet(id) {
  for (let i = 0; i < quizLib.length; i++) if (quizLib[i].id === id) return quizLib[i];
  return null;
}
function curSet() { return libSet(_libSetId) || quizLib[0] || null; }
function totalQuestions() { return quizLib.reduce(function (n, s) { return n + s.questions.length; }, 0); }

function updateBankLabel() {

// ── TRỘN ĐỀ THEO TỶ LỆ ──
function clampPct(v) {
  if (typeof v !== 'number' || !isFinite(v)) return 0;
  return Math.max(0, Math.min(100, Math.round(v)));
}
function pctOf(id) { return clampPct(_mix.pct[id]); }

function mixTotalValue() {
  const available = Math.max(1, totalQuestions());
  let t = parseInt(_mix.total, 10);
  if (!(t > 0)) t = Math.min(MIX_DEFAULT_TOTAL, available);
  return Math.min(t, available);
}

// Chia số câu cho từng bộ theo tỷ lệ, dùng phương pháp "phần dư lớn nhất"
function mixRows() {
  const total = mixTotalValue();
  const rows = quizLib.map(s => ({ s: s, pct: pctOf(s.id) }));
  const sum = rows.reduce((a, r) => a + r.pct, 0);
  const raw = rows.map(r => sum > 0 ? (r.pct / 100) * total : 0);
  const counts = raw.map(v => Math.floor(v));
  let left = sum === 100 ? total - counts.reduce((a, b) => a + b, 0) : 0;
  const order = raw.map((v, i) => ({ i: i, frac: v - Math.floor(v) })).sort((a, b) => b.frac - a.frac);
  let k = 0;
  while (left > 0 && order.length) { counts[order[k % order.length].i]++; left--; k++; }
  return rows.map((r, i) => ({
    set: r.s, pct: r.pct, want: counts[i],
    got: Math.min(counts[i], r.s.questions.length)
  }));
}

function quizMixHtml() {
  const rows = mixRows();
  const pctSum = rows.reduce((a, r) => a + r.pct, 0);
  const ok = pctSum === 100 && rows.some(r => r.got > 0);
  let h = '<div class="quiz-card">';
  h += '<div style="font-size:17px;font-weight:500">🎲 Trộn đề theo tỷ lệ</div>';
  h += '<div style="font-size:15px;font-weight:400;color:var(--text-dim);margin:2px 0 12px">Đặt phần trăm cho từng bộ; tổng phải đúng 100%.</div>';
  h += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">';
  h += '<div style="flex:1;font-size:15px;font-weight:400">Tổng số câu của bài</div>';
  h += `<input id="mixTotal" type="number" min="1" max="${Math.max(1, totalQuestions())}" class="quiz-input" style="width:88px;text-align:center" value="${mixTotalValue()}" oninput="onMixInput()">`;
  h += '</div>';
  rows.forEach(r => {
    h += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">';
    h += `<div style="flex:1;min-width:0;font-size:15px;font-weight:400;line-height:1.35;white-space:normal" title="${esc(r.set.name)}">${esc(r.set.name)}</div>`;
    h += `<input id="mixPct-${r.set.id}" type="number" min="0" max="100" class="quiz-input" style="width:62px;text-align:center" value="${r.pct}" oninput="onMixInput()">`;
    h += '<div style="font-size:15px;font-weight:400;color:var(--text-dim)">%</div>';
    h += `<div id="mixCnt-${r.set.id}" style="width:62px;text-align:right;font-size:15px;font-weight:400;color:var(--text-dim)">${r.got} câu</div>`;
    h += '</div>';
  });
  h += '<div id="mixSum" style="font-size:15px;font-weight:400;margin-top:10px"></div>';
  h += '<div id="mixWarn" style="font-size:15px;font-weight:400;color:var(--gold);margin-top:4px"></div>';
  h += '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">';
  h += `<button id="mixBtnSingle" class="big-upload-btn" style="width:100%" onclick="mixExam('single')">🎲 Trộn &amp; thi từng câu</button>`;
  h += `<button id="mixBtnAll" class="quiz-btn" onclick="mixExam('all')">📋 Trộn &amp; làm cả bộ</button>`;
  h += `<button id="mixBtnStudy" class="quiz-btn" onclick="mixExam('study')">📖 Trộn &amp; học</button>`;
  h += '</div></div>';
  return h;
}

// Chỉ vẽ lại phần số câu + tổng + trạng thái nút, để ô nhập không mất con trỏ
function paintMix() {
  const rows = mixRows();
  const pctSum = rows.reduce((a, r) => a + r.pct, 0);
  const ok = pctSum === 100 && rows.some(r => r.got > 0);
  const sumEl = document.getElementById('mixSum');
  if (sumEl) {
    sumEl.textContent = 'Tổng tỷ lệ: ' + pctSum + '%' + (pctSum === 100 ? ' ✓' : ' — cần đúng 100%');
    sumEl.style.color = pctSum === 100 ? 'var(--green)' : 'var(--red)';
  }
  rows.forEach(r => {
    const el = document.getElementById('mixCnt-' + r.set.id);
    if (!el) return;
    el.textContent = (r.want === r.got ? r.got : r.got + '/' + r.want) + ' câu';
    el.style.color = (r.want === r.got) ? 'var(--text-dim)' : 'var(--gold)';
  });
  const short = rows.filter(r => r.want > r.got);
  const warnEl = document.getElementById('mixWarn');
  if (warnEl) {
    warnEl.textContent = short.length
      ? 'Không đủ câu: ' + short.map(r => r.set.name + ' chỉ có ' + r.set.questions.length + ' câu').join(', ')
      : '';
  }
  ['mixBtnSingle', 'mixBtnAll', 'mixBtnStudy'].forEach(id => {
    const b = document.getElementById(id);
    if (b) b.disabled = !ok;
  });
}

function onMixInput() {
  const t = document.getElementById('mixTotal');
  if (t) _mix.total = Math.max(1, Math.min(parseInt(t.value, 10) || 1, Math.max(1, totalQuestions())));
  quizLib.forEach(s => {
    const el = document.getElementById('mixPct-' + s.id);
    if (el) _mix.pct[s.id] = clampPct(parseInt(el.value, 10));
  });
  paintMix();
}

// Nhóm "kỹ năng mềm": khớp theo TỪ KHOÁ trong tên bộ đề (bỏ dấu, bỏ gạch dưới),
// nên đổi tên kiểu "Văn hóa doanh nghiệp EVN" vẫn nhận ra.
function isSoftSet(name) {
  const k = quizKey(name);
  return SOFT_SET_KEYS.some(w => k.indexOf(w) >= 0);
}

// Nhóm "mặc định 0%": bộ KHÔNG được lấy câu khi trộn (người dùng vẫn tự nâng phần
// trăm lên được nếu muốn). So khớp theo "chỉ chữ và số" nên "Bậc 6-7", "Bậc6_7",
// "KT điện cho CNKD-Bậc6_7" đều khớp, còn "Bậc7_7" thì không (…bac77).
function isZeroSet(name) {
  const k = quizKey(name).replace(/[^a-z0-9]/g, '');
  return ZERO_SET_KEYS.some(w => k.indexOf(w) >= 0);
}

// Trả về số phần trăm CỐ ĐỊNH của bộ, hoặc null nếu bộ không thuộc nhóm nào.
// Dùng cùng cách so khớp "chỉ chữ và số" như isZeroSet.
function fixedPctFor(name) {
  const k = quizKey(name).replace(/[^a-z0-9]/g, '');
  const hit = FIXED_SET_PCT.find(function (row) { return k.indexOf(row[0]) >= 0; });
  return hit ? hit[1] : null;
}

// Chia đều `budget` phần trăm cho danh sách id, tổng đúng bằng budget.
function splitPctEven(ids, budget) {
  const out = {};
  if (!ids.length) return out;
  const base = Math.floor(budget / ids.length);
  let left = budget - base * ids.length;
  ids.forEach(id => { out[id] = base + (left-- > 0 ? 1 : 0); });
  return out;
}

// Tỷ lệ mặc định chia làm BỐN nhóm, xét theo thứ tự:
//   1. kỹ năng mềm (SOFT_SET_KEYS)  → cả nhóm 20% chia nhau (bài 100 câu -> 20 câu)
//   2. cố định (FIXED_SET_PCT)      → mỗi bộ đúng số phần trăm của nó
//   3. 0% (ZERO_SET_KEYS)           → không lấy câu nào
//   4. còn lại                      → chia đều phần còn lại (100 - 20 - cố định)
function resetMixDefaults() {
  _mix.total = Math.min(MIX_DEFAULT_TOTAL, Math.max(1, totalQuestions()));
  _mix.pct = {};
  if (!quizLib.length) return;
  const soft = [];
  let fixed = [];        // [{ s, pct }]
  const zero = [];
  let rest = [];
  quizLib.forEach(s => {
    if (isSoftSet(s.name)) { soft.push(s); return; }
    const f = fixedPctFor(s.name);
    if (f !== null) { fixed.push({ s: s, pct: f }); return; }
    if (isZeroSet(s.name)) { zero.push(s); return; }
    rest.push(s);
  });
  // Nhóm kỹ năng mềm lấy 20%, TRỪ khi không có bộ nào khớp (đổi tên hết) thì các bộ
  // còn lại phải nhận đủ 100%, nếu không tổng sẽ là 80% và nút trộn bị khoá.
  let softBudget = soft.length ? SOFT_SET_SHARE : 0;
  let fixedBudget = fixed.reduce((a, x) => a + x.pct, 0);
  // Chốt an toàn: nếu người dùng đổi tên nhiều bộ trùng khoá cố định đến mức tổng
  // vượt 100 thì cắt nhóm cố định lại, để phần chia đều không bị âm (số âm sẽ làm
  // splitPctEven chia ra số vô lý và nút trộn bị khoá).
  if (fixedBudget + softBudget > 100) fixedBudget = Math.max(0, 100 - softBudget);
  // Nhóm cố định và nhóm 0% nhận phần của mình — nhưng nếu KHÔNG còn bộ nào nhận
  // phần chia đều (thư viện chỉ có bộ kỹ năng mềm / cố định / 0%) thì phần đó phải
  // trả về cho một trong các nhóm kia, nếu không tổng không đủ 100% và cả ba nút
  // trộn bị khoá. Ưu tiên trả về cho nhóm 0%, rồi mới đến nhóm cố định; nếu thư
  // viện chỉ toàn bộ kỹ năng mềm thì chính nhóm đó nhận đủ 100%.
  if (!rest.length) {
    if (zero.length) rest = zero;
    else if (fixed.length) { rest = fixed.map(x => x.s); fixed = []; fixedBudget = 0; }
    else softBudget = 100;
  }
  // Nhóm cố định: mỗi bộ nhận ĐÚNG số của nó — không dùng splitPctEven vì hai bộ
  // cố định khác số nhau (7% và 5%) mà chia đều thì thành 6/6. Nếu chốt an toàn ở
  // trên phải cắt thì cắt theo tỷ lệ và dồn phần lẻ vào bộ cuối để tổng vẫn đúng.
  const wantFixed = fixed.reduce((a, x) => a + x.pct, 0);
  const scale = wantFixed > fixedBudget ? fixedBudget / wantFixed : 1;
  let fixedSum = 0;
  fixed.forEach((x, i) => {
    const v = (i === fixed.length - 1) ? Math.max(0, fixedBudget - fixedSum) : Math.round(x.pct * scale);
    _mix.pct[x.s.id] = v;
    fixedSum += v;
  });
  const restBudget = Math.max(0, 100 - softBudget - fixedSum);
  Object.assign(_mix.pct, splitPctEven(soft.map(s => s.id), softBudget));
  Object.assign(_mix.pct, splitPctEven(rest.map(s => s.id), restBudget));
  // Bộ mặc định 0% (khi không phải nhóm dự phòng ở trên) ghi rõ 0% cho dễ đọc code.
  zero.forEach(s => { if (!(s.id in _mix.pct)) _mix.pct[s.id] = 0; });
}

function backHome() {
  _libPending = null;
  _quizMode = 'home'; renderQuiz(); window.scrollTo(0, 0);
}
function openBrowse(setId) {
  _libSetId = setId; _libPending = null;
  _quizMode = 'browse'; renderQuiz(); window.scrollTo(0, 0);
}

// ── LÀM BÀI ──
// mode: 'single' = từng câu một | 'all' = mọi câu trên một màn
function startExam(questions, title, mode) {
  const list = (questions || []).filter(Boolean);
  if (!list.length) { alert('Chưa có câu hỏi nào.'); return; }
  const m = (mode === 'all' || mode === 'study') ? mode : 'single';
  const items = list.map(q => {
    const opts = q.options.map((t, i) => ({ t: t, ok: i === q.correct }));
    if (_quizOpts.shuffleA) shuffleArr(opts);
    return { q: q.q, explain: q.explain || '', opts: opts, chosen: null, done: false, tried: [], wrongFirst: false };
  });
  if (_quizOpts.shuffleQ) shuffleArr(items);
  _exam = { questions: list, title: title || '', mode: m };
  _quizState = { items: items, idx: 0, chosen: null, score: 0, wrong: [], title: _exam.title };
  _quizMode = m === 'all' ? 'playAll' : (m === 'study' ? 'study' : 'play');
  renderQuiz();
  window.scrollTo(0, 0);
}

function startSetExam(setId, mode) {
  const s = libSet(setId);
  if (!s || !s.questions.length) { alert('Bộ đề này chưa có câu hỏi.'); return; }
  _libSetId = s.id;
  startExam(s.questions, s.name, mode);
}

function replayExam() { if (_exam) startExam(_exam.questions, _exam.title, _exam.mode); }

// Trộn đề: lấy ngẫu nhiên đúng số câu mỗi bộ phải đóng góp rồi xáo lại toàn bộ
function mixExam(mode) {
  const rows = mixRows();
  const picked = [];
  rows.forEach(r => {
    if (r.got <= 0) return;
    const pool = r.set.questions.slice();
    shuffleArr(pool);
    pool.slice(0, r.got).forEach(q => picked.push(q));
  });
  if (!picked.length) { alert('Tỷ lệ hiện tại không lấy được câu nào. Hãy tăng phần trăm cho ít nhất một bộ.'); return; }
  shuffleArr(picked);
  startExam(picked, '🎲 Trộn đề · ' + picked.length + ' câu', mode);
}

function answerQuiz(i) {
  const st = _quizState;
  if (!st || st.chosen !== null) return;
  const it = st.items[st.idx];
  if (!it || !it.opts[i]) return;
  st.chosen = i;
  const right = it.opts.find(o => o.ok);
  if (it.opts[i].ok) st.score++;
  else st.wrong.push({ q: it.q, chosen: it.opts[i].t, correct: right ? right.t : '—', explain: it.explain });
  renderQuiz();
}

function nextQuiz() {
  const st = _quizState;
  if (!st) return;
  st.idx++; st.chosen = null;
  renderQuiz(); window.scrollTo(0, 0);
}
function finishQuiz() { _quizMode = 'result'; renderQuiz(); window.scrollTo(0, 0); }
function quitQuiz() { _quizState = null; _quizMode = 'home'; renderQuiz(); window.scrollTo(0, 0); }

// Nút về trang chủ ở đầu mọi màn làm bài — để không phải cuộn xuống đáy mới thoát
// được (đề 30-60 câu thì nút “Thoát” ở đáy rất xa).
// Chữ câu hỏi kèm SỐ CÂU trong vòng tròn xanh ở đầu — dùng cho BA màn làm bài
// (từng câu, cả bộ, học). Dùng flex chứ không nối chuỗi số vào câu: nối chuỗi thì
// câu dài xuống dòng sẽ có dòng thứ hai thụt vào thẳng lề, lệch hẳn với dòng đầu;
// flex cho vòng tròn một cột riêng nên cả khối chữ thẳng hàng.
// KHÔNG dùng ở hai màn danh sách (👁 Câu hỏi và “Cần ôn lại”): ở đó mỗi câu đã có
// số “1.” đứng trước, thêm vòng tròn nữa thành rối.
function qTextHtml(text, extraStyle, num) {
  return '<div style="display:flex;gap:6px;align-items:flex-start;' + (extraStyle || '') + '">'
    + '<span class="q-num">' + num + '</span>'
    + '<div style="flex:1;min-width:0">' + text + '</div></div>';
}

function homeBtnHtml() {
  return '<button class="quiz-btn home-btn" onclick="quitQuiz()" title="Về trang chủ"'
    + ' aria-label="Về trang chủ">🏠</button>';
}

function quizPlayHtml() {
  const st = _quizState;
  if (!st || !st.items.length) return '<div class="quiz-card">Không có câu hỏi.</div>';
  const it = st.items[st.idx];
  const total = st.items.length;
  const answered = st.chosen !== null;
  const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
  let h = '<div class="quiz-card">';
  h += '<div class="head-row" style="margin-bottom:8px">';
  h += `<div style="flex:1;min-width:0;font-size:15px;font-weight:400;color:var(--text-dim);line-height:1.35">${st.title ? esc(st.title) : ''}</div>`;
  h += homeBtnHtml();
  h += '</div>';
  h += '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">';
  h += `<div style="font-size:15px;font-weight:400">Câu ${st.idx + 1}/${total}</div>`;
  h += `<div style="font-size:15px;font-weight:400;color:var(--text-dim)">Đúng: <b style="color:var(--green)">${st.score}</b></div>`;
  h += '</div>';
  h += `<div style="height:6px;background:var(--border);border-radius:3px;margin:10px 0 14px;overflow:hidden"><div style="height:100%;width:${Math.round(st.idx / total * 100)}%;background:var(--accent)"></div></div>`;
  h += qTextHtml(esc(it.q), 'font-size:16px;font-weight:600;line-height:1.5;margin-bottom:14px', st.idx + 1);
  it.opts.forEach((o, i) => {
    let cls = 'quiz-opt';
    if (answered) {
      if (o.ok) cls += ' correct';
      else if (i === st.chosen) cls += ' wrong';
    }
    h += `<button class="${cls}"${answered ? ' disabled' : ''} onclick="answerQuiz(${i})">`;
    h += `<span class="quiz-badge">${letters[i]}</span><span style="flex:1">${esc(o.t)}</span>`;
    if (answered && o.ok) h += '<span>✅</span>';
    else if (answered && i === st.chosen) h += '<span>❌</span>';
    h += '</button>';
  });
  if (answered) {
    const isRight = !!it.opts[st.chosen].ok;
    const rightOpt = it.opts.find(o => o.ok);
    h += '<div style="margin-top:6px;padding:11px;border-radius:10px;font-size:14px;line-height:1.55;' +
      (isRight ? 'background:rgba(16,185,129,0.14);border:1px solid var(--green)' : 'background:rgba(239,68,68,0.14);border:1px solid var(--red)') + '">';
    h += isRight ? '✅ <b>Chính xác!</b>' : '❌ <b>Chưa đúng.</b> Đáp án đúng: <b>' + esc(rightOpt ? rightOpt.t : '—') + '</b>';
    if (it.explain) h += '<div style="margin-top:6px;color:var(--text-dim)">💡 ' + esc(it.explain) + '</div>';
    h += '</div>';
    const last = st.idx === total - 1;
    h += `<button class="big-upload-btn" style="width:100%;margin-top:12px" onclick="${last ? 'finishQuiz()' : 'nextQuiz()'}">${last ? '🏁 Xem kết quả' : 'Câu tiếp →'}</button>`;
  }
  h += '</div>';
  h += '<div><button class="quiz-btn" onclick="quitQuiz()">Thoát bài làm</button></div>';
  return h;
}

function quizFeedbackHtml(it) {
  const isRight = !!it.opts[it.chosen].ok;
  const right = it.opts.find(o => o.ok);
  let s = isRight ? '✅ <b>Chính xác!</b>' : '❌ <b>Chưa đúng.</b> Đáp án đúng: <b>' + esc(right ? right.t : '—') + '</b>';
  if (it.explain) s += '<div style="margin-top:5px;color:var(--text-dim)">💡 ' + esc(it.explain) + '</div>';
  return s;
}

function quizAllHtml() {
  const st = _quizState;
  if (!st || !st.items.length) return '<div class="quiz-card">Không có câu hỏi.</div>';
  const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
  let h = '<div class="quiz-card quiz-all-head">';
  h += '<div class="head-row">';
  h += `<div style="flex:1;min-width:0;font-size:17px;font-weight:500">${st.title ? esc(st.title) : '📋 Cả bộ đề'} · ${st.items.length} câu</div>`;
  h += homeBtnHtml();
  h += '</div>';
  h += '<div id="allSummary" style="font-size:15px;font-weight:400;color:var(--text-dim);margin-top:6px"></div>';
  h += '</div>';

  st.items.forEach((it, qi) => {
    const done = it.chosen !== null;
    const isRight = done && !!it.opts[it.chosen].ok;
    h += `<div class="quiz-card" id="qb-${qi}">`;
    h += qTextHtml(esc(it.q), 'font-size:16px;font-weight:600;line-height:1.5;margin-bottom:12px', qi + 1);
    it.opts.forEach((o, oi) => {
      let cls = 'quiz-opt';
      let mark = '';
      if (done) {
        if (o.ok) { cls += ' correct'; mark = '<span class="mark">✅</span>'; }
        else if (oi === it.chosen) { cls += ' wrong'; mark = '<span class="mark">❌</span>'; }
      }
      h += `<button class="${cls}" id="qo-${qi}-${oi}"${done ? ' disabled' : ''} onclick="answerAll(${qi},${oi})">`;
      h += `<span class="quiz-badge">${letters[oi]}</span><span style="flex:1">${esc(o.t)}</span>${mark}`;
      h += '</button>';
    });
    h += `<div class="quiz-fb${done ? ' show ' + (isRight ? 'ok' : 'no') : ''}" id="qfb-${qi}">${done ? quizFeedbackHtml(it) : ''}</div>`;
    h += '</div>';
  });

  h += '<div class="quiz-card" style="text-align:center">';
  h += '<button class="big-upload-btn" style="width:100%" onclick="finishQuiz()">🏁 Xem kết quả</button>';
  h += '<div style="margin-top:8px"><button class="quiz-btn" onclick="quitQuiz()">Thoát bài làm</button></div>';
  h += '</div>';
  return h;
}

function updateAllSummary() {
  const st = _quizState;
  const el = document.getElementById('allSummary');
  if (!st || !el) return;
  const done = st.items.filter(x => x.chosen !== null).length;
  el.innerHTML = `Đã trả lời <b>${done}</b>/${st.items.length} · ` +
    `Đúng <b style="color:var(--green)">${st.score}</b> · ` +
    `Sai <b style="color:var(--red)">${st.wrong.length}</b>`;
}

function answerAll(qi, oi) {
  const st = _quizState;
  if (!st) return;
  const it = st.items[qi];
  if (!it || it.chosen !== null || !it.opts[oi]) return;
  it.chosen = oi;
  const right = it.opts.find(o => o.ok);
  const isRight = !!it.opts[oi].ok;
  if (isRight) st.score++;
  else st.wrong.push({ q: it.q, chosen: it.opts[oi].t, correct: right ? right.t : '—', explain: it.explain });

  // Cập nhật tại chỗ thay vì render lại cả danh sách, để không mất vị trí cuộn
  it.opts.forEach((o, i) => {
    const btn = document.getElementById('qo-' + qi + '-' + i);
    if (!btn) return;
    btn.disabled = true;
    if (o.ok) { btn.classList.add('correct'); btn.insertAdjacentHTML('beforeend', '<span class="mark">✅</span>'); }
    else if (i === oi) { btn.classList.add('wrong'); btn.insertAdjacentHTML('beforeend', '<span class="mark">❌</span>'); }
  });
  const fb = document.getElementById('qfb-' + qi);
  if (fb) { fb.className = 'quiz-fb show ' + (isRight ? 'ok' : 'no'); fb.innerHTML = quizFeedbackHtml(it); }
  updateAllSummary();
}

function quizResultHtml() {
  const st = _quizState;
  if (!st) { _quizMode = 'home'; return quizHomeHtml(); }
  const total = st.items.length;
  const pct = total ? Math.round(st.score / total * 100) : 0;

  let h = '<div class="quiz-card" style="text-align:center">';

  h += `<div style="font-size:15px;color:var(--text-dim);margin-top:8px">Đúng ${st.score}/${total} câu</div>`;
  if (_exam && _exam.mode === 'study') h += '<div style="font-size:15px;font-weight:400;color:var(--text-dim);margin-top:6px;line-height:1.5">Chế độ học: con số trên là số câu đúng ngay lần đầu. Các câu còn lại bạn đã làm đúng sau khi chọn lại.</div>';
  h += '<div style="display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap">';
  h += '<button class="quiz-btn primary" onclick="replayExam()">🔄 Làm lại</button>';
  h += '<button class="quiz-btn" onclick="quitQuiz()">🏠 Về trang chủ</button>';
  h += '</div></div>';
  if (st.wrong.length) {
    h += '<div class="quiz-card">';
    h += `<div style="font-size:17px;font-weight:500;margin-bottom:10px">📌 Cần ôn lại (${st.wrong.length})</div>`;
    st.wrong.forEach((w, i) => {
      h += '<div style="border-left:3px solid var(--red);padding:8px 10px;margin-bottom:10px;border-radius:0 8px 8px 0">';
      h += `<div style="font-size:16px;font-weight:600;line-height:1.5">${i + 1}. ${esc(w.q)}</div>`;
      h += `<div style="font-size:15px;color:var(--red);margin-top:6px">Bạn chọn: ${esc(w.chosen)}</div>`;
      h += `<div style="font-size:15px;color:var(--green)">Đáp án đúng: <b>${esc(w.correct)}</b></div>`;
      if (w.explain) h += `<div style="font-size:15px;font-weight:400;color:var(--text-dim);margin-top:4px">💡 ${esc(w.explain)}</div>`;
      h += '</div>';
    });
    h += '</div>';
  } else {
    h += '<div class="quiz-card" style="text-align:center;color:var(--green);font-size:15px">🎉 Không có câu nào sai. Xuất sắc!</div>';
  }
  h += '<div style="height:20px"></div>';
  return h;
}

// ── NẠP CÂU HỎI TỪ EXCEL / CSV ──
function parseQuizCorrect(raw, optionTexts) {
  const v = String(raw == null ? '' : raw).trim();
  if (!v) return -1;
  const compact = quizNormBase(v).replace(/[^a-z0-9]/g, '');
  const letters = { a: 0, b: 1, c: 2, d: 3, e: 4, f: 5 };
  if (compact.length === 1 && letters[compact] !== undefined) return letters[compact];
  if (/^[1-6]$/.test(compact)) return parseInt(compact, 10) - 1;
  const target = quizText(v);
  for (let i = 0; i < optionTexts.length; i++) {
    if (quizText(optionTexts[i]) === target) return i;
  }
  return -1;
}

// Đọc sheet thành danh sách câu hỏi. Hỗ trợ 2 kiểu bảng:
//  (1) Bảng ngang  : mỗi dòng là 1 câu, có các cột đáp án A / B / C / D
//  (2) Bảng dọc    : cột "Phân Loại" đánh dấu Q (câu hỏi) / A (đáp án),
//                    cột "Đáp án đúng" đánh dấu X vào hàng đáp án đúng
// Dòng tiêu đề được tự tìm nên file có dòng tiêu đề bộ đề ở trên vẫn đọc được.
function parseQuizSheet(ws) {
  const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', blankrows: false });

  // Tìm dòng tiêu đề: dòng đầu tiên có ô "Câu hỏi" hoặc có từ 2 cột A/B/C/D
  let hIdx = -1;
  for (let i = 0; i < Math.min(aoa.length, 30); i++) {
    const keys = (aoa[i] || []).map(c => quizKey(c));
    if (keys.indexOf('cauhoi') >= 0) { hIdx = i; break; }
    if (keys.filter(k => k === 'a' || k === 'b' || k === 'c' || k === 'd').length >= 2) { hIdx = i; break; }
  }
  if (hIdx < 0) {
    return {
      questions: [], skipped: 0,
      reason: 'Không tìm thấy dòng tiêu đề. Cần một dòng có ô “Câu hỏi” (kèm các cột đáp án A, B, C, D), hoặc cột “Câu hỏi” cùng cột “Phân Loại” và “Đáp án đúng”.'
    };
  }

  const headers = (aoa[hIdx] || []).map(c => quizKey(c));
  const col = function() {
    for (let a = 0; a < arguments.length; a++) {
      const idx = headers.indexOf(quizKey(arguments[a]));
      if (idx >= 0) return idx;
    }
    return -1;
  };
  const iQ = col('CAU HOI', 'CAUHOI', 'NOI DUNG', 'NOIDUNG', 'QUESTION');
  const iType = col('PHAN LOAI', 'LOAI', 'TYPE', 'KY HIEU');
  const iGt = col('GIAI THICH', 'GIAITHICH', 'EXPLAIN', 'LY DO');
  const iOpts = [
    col('A', 'DAP AN A', 'DAPANA', 'LUA CHON A', 'OPTION A'),
    col('B', 'DAP AN B', 'DAPANB', 'LUA CHON B', 'OPTION B'),
    col('C', 'DAP AN C', 'DAPANC', 'LUA CHON C', 'OPTION C'),
    col('D', 'DAP AN D', 'DAPAND', 'LUA CHON D', 'OPTION D')
  ];
  const nOptCols = iOpts.filter(i => i >= 0).length;
  let iCorrect = col('DAP AN DUNG', 'DAPANDUNG', 'DAP AN', 'CORRECT', 'DAPAN');
  // Dự phòng: tên cột hơi khác (vd "Đáp án đún" do bị cắt) — lấy cột bắt đầu bằng "dapan"
  if (iCorrect < 0) {
    iCorrect = headers.findIndex((h, i) => h.indexOf('dapan') === 0 && iOpts.indexOf(i) < 0);
  }
  const cell = (r, i) => (i >= 0 && r[i] != null ? String(r[i]).trim() : '');
  const rows = aoa.slice(hIdx + 1);
  const questions = [];
  let skipped = 0;

  // (1) Bảng ngang — có các cột đáp án A, B, C, D
  if (nOptCols >= 2) {
    rows.forEach(r => {
      const text = cell(r, iQ);
      const options = iOpts.map(i => cell(r, i)).filter(Boolean);
      if (!text || options.length < 2) { skipped++; return; }
      const ci = parseQuizCorrect(cell(r, iCorrect), options);
      if (ci < 0 || ci >= options.length) { skipped++; return; }
      questions.push({ q: text, options: options, correct: ci, explain: cell(r, iGt) });
    });
    return { questions: questions, skipped: skipped };
  }

  if (iQ < 0) {
    return { questions: [], skipped: 0, reason: 'Không tìm thấy cột “Câu hỏi”.' };
  }
  if (iType < 0) {
    return {
      questions: [], skipped: 0,
      reason: 'Thiếu cột đáp án. Cần hoặc các cột A, B, C, D, hoặc cột “Phân Loại” (Q/A) kèm cột “Đáp án đúng” đánh dấu X.'
    };
  }

  // (2) Bảng dọc — cột Phân Loại quyết định hàng nào là câu hỏi, hàng nào là đáp án
  let cur = null;
  let noAnswerCount = 0;   // số câu bị bỏ vì không thấy dấu X ở cột đáp án đúng
  const flush = () => {
    if (cur && cur.q && cur.options.length >= 2 && cur.correct >= 0 && cur.correct < cur.options.length) {
      questions.push(cur);
    } else {
      skipped++;
      if (cur && cur.q && cur.options.length >= 2 && cur.correct < 0) noAnswerCount++;
    }
    cur = null;
  };
  rows.forEach(r => {
    const type = cell(r, iType).toLowerCase();
    const text = cell(r, iQ);
    if (!text) return;                                  // dòng trống thì bỏ qua
    const isQ = type === 'q' || type === 'ch' || quizKey(type).indexOf('cauhoi') === 0;
    const isA = !isQ && (type === 'a' || type === 'd' || quizKey(type).indexOf('dapan') === 0);
    if (isQ) {
      if (cur) flush();
      cur = { q: text, options: [], correct: -1, explain: cell(r, iGt) };
    } else if (isA) {
      if (!cur) return;                                 // đáp án mồ côi thì bỏ qua
      if (cell(r, iCorrect)) cur.correct = cur.options.length;   // có dấu X = đáp án đúng
      cur.options.push(text);
    }
    // các hàng khác (ghi chú, tiêu đề phụ...) bị bỏ qua
  });
  if (cur) flush();
  let reason = '';
  if (!questions.length) {
    if (iCorrect < 0) reason = 'Không tìm thấy cột “Đáp án đúng”. Cần một cột tên “Đáp án đúng” để biết đáp án nào đúng.';
    else if (noAnswerCount) reason = 'Không thấy dấu X ở cột “Đáp án đúng” cho câu nào. Hãy đánh dấu X vào hàng đáp án đúng.';
  }
  return { questions: questions, skipped: skipped, noAnswer: noAnswerCount, reason: reason };
}

function pickSetFiles() { document.getElementById('quizFileInput').click(); }
function pickSetDir() { document.getElementById('quizDirInput').click(); }

// Một nút trong "thanh tab" thư viện: nút đang chọn dùng nền xanh (.big-upload-btn),
// hai nút còn lại dùng kiểu viền (.quiz-btn). Kích thước do .lib-act quyết định nên
// đổi qua lại giữa hai kiểu không làm nút nhảy cỡ.
function libActBtn(key, label, title) {
  const on = _libAct === key;
  return '<button class="' + (on ? 'big-upload-btn' : 'quiz-btn') + ' lib-act"'
    + ' onclick="useLibAct(\'' + key + '\')"'
    + ' title="' + title + '"'
    + (on ? ' aria-current="true"' : '') + '>' + label + '</button>';
}

// Đổi màu nút vừa bấm rồi mới chạy hành động của nút đó. Gọi hành động TRƯỚC và
// vẽ lại `.main` SAU: hộp thoại chọn file là thẻ <input> nằm ngoài `.main` nên
// không bị vẽ lại mất, còn renderQuiz() chỉ dựng lại #quizPane.
function useLibAct(key) {
  if (!LIB_ACTS[key]) return;
  _libAct = key;
  try { localStorage.setItem(LIB_ACT_KEY, key); } catch (e) {}
  if (key === 'file') pickSetFiles();
  else if (key === 'dir') pickSetDir();
  else openLibPanel();
  renderQuiz();
}
const EXCEL_EXT = /\.(xlsx|xls|csv)$/i;

function readFileAsArrayBuffer(f) {
  return new Promise(function (resolve, reject) {
    const r = new FileReader();
    r.onload = function (e) { resolve(e.target.result); };
    r.onerror = function () { reject(new Error('không đọc được file')); };
    r.readAsArrayBuffer(f);
  });
}

function setNameFromFile(fileName) {
  const base = String(fileName || '').replace(/\.[^.]+$/, '').trim();
  return base || 'Bộ đề';
}

// Mỗi file thành một bộ đề. File trùng tên thì CẬP NHẬT lại nội dung bộ đề đó.
async function handleQuizImport(inp) {
  const all = Array.prototype.slice.call(inp.files || []);
  try { inp.value = ''; } catch (e) {}
  if (!all.length) return;
  if (typeof XLSX === 'undefined') {
    alert('Thư viện đọc Excel chưa được tải. Kiểm tra kết nối mạng rồi thử lại.');
    return;
  }
  // Khi chọn cả thư mục, Chromium đưa mọi file vào (kể cả file tạm ~$ và file lạ)
  const files = all.filter(function (f) {
    return EXCEL_EXT.test(f.name) && f.name.indexOf('~$') !== 0;
  });
  const skippedFiles = all.length - files.length;
  if (!files.length) {
    alert(skippedFiles
      ? 'Không thấy file Excel nào. Thư mục đang chọn chỉ có ' + skippedFiles + ' file không phải .xlsx/.xls/.csv.'
      : 'Không có file nào được chọn.');
    return;
  }

  let added = 0, updated = 0, qTotal = 0, skippedTotal = 0;
  const failed = [];
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    try {
      const buf = await readFileAsArrayBuffer(f);
      const wb = readWorkbook(buf, f.name);
      const ws = wb.Sheets[wb.SheetNames[0]];
      const parsed = parseQuizSheet(ws);
      if (!parsed.questions.length) throw new Error(parsed.reason || 'không đọc được câu hỏi nào');
      const name = setNameFromFile(f.name);
      const qs = parsed.questions.map(function (q) {
        return { id: quizNewId(), q: q.q, options: q.options, correct: q.correct, explain: q.explain || '' };
      });
      const same = quizLib.filter(function (s) { return s.name.trim().toLowerCase() === name.trim().toLowerCase(); })[0];
      if (same) { same.questions = qs; same.addedAt = Date.now(); updated++; }
      else { quizLib.push(normalizeSet({ name: name, questions: qs })); added++; }
      qTotal += qs.length;
      skippedTotal += parsed.skipped || 0;
    } catch (err) {
      failed.push(f.name + ' — ' + ((err && err.message) || err));
    }
  }

  saveLib();
  resetMixDefaults();
  _quizMode = 'home';
  renderQuiz();

  let msg = 'Đã nạp ' + qTotal + ' câu từ ' + (added + updated) + '/' + files.length + ' file.';
  if (added) msg += '\n• ' + added + ' bộ đề mới';
  if (updated) msg += '\n• ' + updated + ' bộ đề cũ được cập nhật (file trùng tên, nội dung cũ bị thay)';
  if (skippedTotal) msg += '\n• bỏ qua ' + skippedTotal + ' dòng thiếu dữ liệu';
  if (skippedFiles) msg += '\n• bỏ qua ' + skippedFiles + ' file không phải Excel (hoặc file tạm ~$)';
  if (failed.length) msg += '\n\nKhông đọc được ' + failed.length + ' file:\n• ' + failed.join('\n• ');
  alert(msg);
}

// ── RÚT GỌN TÊN BỘ ĐỀ ────────────────────────────────────────────────
// Tên file hay bị mất dấu cách ("Cáctìnhhuốngviphạm…"), nên cần tách lại thành
// âm tiết tiếng Việt. Âm tiết = [âm đầu] + [vần] + [âm cuối].
const VN_BASE = {
  'a':'a','á':'a','à':'a','ả':'a','ã':'a','ạ':'a','ă':'a','ắ':'a','ằ':'a','ẳ':'a','ẵ':'a','ặ':'a',
  'â':'a','ấ':'a','ầ':'a','ẩ':'a','ẫ':'a','ậ':'a',
  'e':'e','é':'e','è':'e','ẻ':'e','ẽ':'e','ẹ':'e','ê':'e','ế':'e','ề':'e','ể':'e','ễ':'e','ệ':'e',
  'i':'i','í':'i','ì':'i','ỉ':'i','ĩ':'i','ị':'i',
  'o':'o','ó':'o','ò':'o','ỏ':'o','õ':'o','ọ':'o','ô':'o','ố':'o','ồ':'o','ổ':'o','ỗ':'o','ộ':'o',
  'ơ':'o','ớ':'o','ờ':'o','ở':'o','ỡ':'o','ợ':'o',
  'u':'u','ú':'u','ù':'u','ủ':'u','ũ':'u','ụ':'u','ư':'u','ứ':'u','ừ':'u','ử':'u','ữ':'u','ự':'u',
  'y':'y','ý':'y','ỳ':'y','ỷ':'y','ỹ':'y','ỵ':'y','d':'d','đ':'d'
};
const VN_ONSETS = ['ngh', 'ng', 'nh', 'ch', 'gh', 'gi', 'kh', 'ph', 'th', 'tr', 'qu',
  'b', 'c', 'd', 'g', 'h', 'k', 'l', 'm', 'n', 'p', 'r', 's', 't', 'v', 'x', ''];
const VN_NUCLEI = ['ieu', 'yeu', 'oai', 'oao', 'oay', 'oeo', 'uay', 'uoi', 'uou', 'uya', 'uye', 'uyu',
  'ai', 'ao', 'au', 'ay', 'eo', 'eu', 'ia', 'ie', 'iu', 'oa', 'oe', 'oi', 'oo', 'ua', 'ue', 'ui', 'uo', 'uu', 'uy', 'ya', 'ye',
  'a', 'e', 'i', 'o', 'u', 'y'];
const VN_CODAS = ['ch', 'ng', 'nh', 'c', 'm', 'n', 'p', 't', ''];

function baseOf(ch) {
  const low = ch.toLowerCase();
  return VN_BASE[low] || low;
}
function matchAt(run, i, piece) {
  if (!piece) return true;
  if (i + piece.length > run.length) return false;
  for (let k = 0; k < piece.length; k++) {
    if (baseOf(run[i + k]) !== piece[k]) return false;
  }
  return true;
}
// Độ dài âm đầu dài nhất khớp tại vị trí i (0 = âm tiết sau bắt đầu bằng nguyên âm)
function onsetLenAt(run, i) {
  let len = 0;
  for (let k = 0; k < VN_ONSETS.length; k++) {
    const on = VN_ONSETS[k];
    if (on.length > len && matchAt(run, i, on)) len = on.length;
  }
  return len;
}
function cmpScore(a, b) {
  for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return a[i] - b[i];
  return 0;
}

// Âm cuối "ch"/"nh" không đứng sau ă/â; "ng"/"c" không đứng sau i/y/ê
function codaOk(nucText, coda) {
  if (!coda) return true;
  const low = nucText.toLowerCase();
  if (coda === 'ch' || coda === 'nh') {
    if (low.indexOf('ă') >= 0 || low.indexOf('â') >= 0) return false;
    return true;
  }
  if (coda === 'ng' || coda === 'c') {
    if (low === 'i' || low === 'y' || low === 'ê') return false;
  }
  return true;
}

// Từ điển âm tiết lấy từ chính câu hỏi trong thư viện, để chọn cách tách đúng:
// "văn hóa" (cả hai đều có thật) phải thắng "vă nhóa".
const VN_SEED = ('văn hóa hệ thống thu thập thị trường vi phạm điện năng kinh doanh nội quy ' +
  'lao động chăm sóc khách hàng đo đếm ngân dữ liệu từ xa tình huống cách xử lý các và sử ' +
  'dụng đúng sai câu hỏi đáp án chuẩn mực đạo đức an toàn bậc phụ lục nghiệp vụ quản lý ' +
  'cung cấp chất lượng dịch ngày càng trách nhiệm môi trường cộng đồng giá trị cốt lõi sứ ' +
  'mệnh tầm nhìn khẩu hiệu triết lý người nhân viên công ty tập đoàn').split(' ');
let _vnVocab = null;
function vnVocab() {
  if (_vnVocab) return _vnVocab;
  const set = new Set(VN_SEED);
  quizLib.forEach(function (s) {
    s.questions.forEach(function (q) {
      String(q.q || '').concat(' ', (q.options || []).join(' '), ' ', q.explain || '')
        .toLowerCase().match(/\p{L}+/gu) 
        ?.forEach(function (w) { if (w.length > 1) set.add(w); });
    });
  });
  _vnVocab = set;
  return set;
}

// Tách một mạch chữ thành các âm tiết; trả về null nếu không tách trọn được
function parseRun(run) {
  const n = run.length;
  const vocab = vnVocab();
  const cache = new Map();
  function best(i) {
    if (i === n) return { syls: [], known: 0 };
    if (cache.has(i)) return cache.get(i);
    let pick = null, pickScore = null;
    for (let oi = 0; oi < VN_ONSETS.length; oi++) {
      const on = VN_ONSETS[oi];
      if (!matchAt(run, i, on)) continue;
      const oEnd = i + on.length;
      for (let ni = 0; ni < VN_NUCLEI.length; ni++) {
        const nu = VN_NUCLEI[ni];
        if (!matchAt(run, oEnd, nu)) continue;
        const nEnd = oEnd + nu.length;
        for (let ci = 0; ci < VN_CODAS.length; ci++) {
          const co = VN_CODAS[ci];
          if (!matchAt(run, nEnd, co)) continue;
          if (!codaOk(run.slice(oEnd, nEnd), co)) continue;
          const end = nEnd + co.length;
          if (end > n) continue;
          const rest = best(end);
          if (rest === null) continue;
          const syl = run.slice(i, end);
          const cand = { syls: [syl].concat(rest.syls), known: rest.known + (vocab.has(syl.toLowerCase()) ? 1 : 0) };
          // Ưu tiên: ít âm tiết nhất → nhiều âm tiết có thật trong từ điển nhất →
          // âm tiết sau có âm đầu → âm đầu đó dài nhất.
          const nextLen = rest.syls.length ? onsetLenAt(run, end) : 0;
          const sc = [cand.syls.length, -cand.known,
            rest.syls.length ? (nextLen > 0 ? 0 : 1) : 2, -nextLen, -nu.length, -co.length];
          if (pick === null || cmpScore(sc, pickScore) < 0) { pick = cand; pickScore = sc; }
        }
      }
    }
    cache.set(i, pick);
    return pick;
  }
  const res = best(0);
  return res ? res.syls : null;
}

function isUpperLetter(ch) {
  const up = ch.toUpperCase();
  return ch === up && ch !== ch.toLowerCase();
}
// Cụm 2+ chữ HOA liền nhau (KT, CNKD, NHCH, EVN...) là từ viết tắt, giữ nguyên
function tidyRun(run) {
  if (run.length <= 4) return run;
  const n = run.length;
  const isAc = new Array(n).fill(false);
  let i = 0;
  while (i < n) {
    if (isUpperLetter(run[i])) {
      let j = i;
      while (j < n && isUpperLetter(run[j])) j++;
      if (j - i >= 2) for (let k = i; k < j; k++) isAc[k] = true;
      i = j;
    } else i++;
  }
  const groups = [];
  let s = 0;
  for (let k = 1; k <= n; k++) {
    if (k === n || isAc[k] !== isAc[k - 1]) { groups.push({ text: run.slice(s, k), ac: isAc[s] }); s = k; }
  }
  return groups.map(function (g) {
    if (g.ac) return g.text;
    const syls = parseRun(g.text);
    return (syls && syls.length > 1) ? syls.join(' ') : g.text;
  }).join(' ');
}

function tidyToken(tok) {
  return tok.replace(/\p{L}+/gu, function (run) { return tidyRun(run); });
}

function tidySetName(raw) {
  let s = String(raw == null ? '' : raw).trim();
  if (!s) return String(raw == null ? '' : raw);
  const original = s;
  s = s.replace(/\.(xlsx|xls|csv|txt)$/i, '');
  s = s.replace(/(?<=\p{L})_(?=\p{L})/gu, ' ');          // gạch dưới giữa hai chữ -> dấu cách
  s = s.replace(/^\s*\d{1,3}\s*[.)\-–:]\s*/, ' ');        // số thứ tự đầu tên: "2.", "11. ", "3 -"
  s = s.replace(/\b\d{1,4}[.\/\-]\d{1,2}[.\/\-]\d{2,4}\b/g, ' ');   // ngày đầy đủ
  s = s.replace(/\b(19|20)\d{2}\b/g, ' ');                // năm lẻ
  s = s.replace(/^\s*\([^)]*\)\s*/, ' ');               // ngoặc đơn mở đầu tên
  s = s.replace(/\s*\([^)]*\)/g, function (m) {          // ngoặc chỉ có số/ngày thì bỏ
    const letters = m.replace(/[0-9.\-\/_ ]/g, '').replace(/[()]/g, '');
    return letters.trim() ? m : ' ';
  });
  s = s.replace(/\s+(final|last|new)$/i, ' ');
  s = s.replace(/(\p{L})[.\-_]([A-Za-z0-9]{1,4})$/u, function (m, p1, p2) {  // đuôi mã: ".2K", ".v2"
    return /[0-9]/.test(p2) ? p1 : m;
  });
  s = s.split(/\s+/).filter(Boolean).map(tidyToken).join(' ');
  s = s.replace(/\s{2,}/g, ' ').replace(/^[\s\-–_.,;:&]+|[\s\-–_.,;:&]+$/g, '').trim();
  if (!s) return original;
  return s.charAt(0).toUpperCase() + s.slice(1);
}

// ── XEM TRƯỚC KHI ĐỔI TÊN ──
function openRenamePreview() {
  _vnVocab = null;                                  // từ điển dựng lại theo thư viện hiện tại
  _renamePreview = quizLib.map(function (s) {
    return { id: s.id, oldName: s.name, next: tidySetName(s.name) };
  });
  renderLibPanel();
}
function cancelRenamePreview() { _renamePreview = null; renderLibPanel(); }

function renderRenamePreview(body) {
  const changed = _renamePreview.filter(function (r) { return r.next !== r.oldName; }).length;
  let h = '';
  h += '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0 4px">';
  h += '<div style="font-size:17px;font-weight:500">✨ Rút gọn tên bộ đề</div>';
  h += '<button class="quiz-btn" style="padding:6px 10px" onclick="cancelRenamePreview()" aria-label="Đóng">✕</button>';
  h += '</div>';
  h += '<div style="font-size:15px;font-weight:400;color:var(--text-dim);padding-bottom:4px">Bỏ số thứ tự, ngày tháng và tách chữ dính. Xem qua rồi mới áp dụng.</div>';
  h += `<div style="font-size:15px;font-weight:400;color:var(--text-dim);padding-bottom:10px">${changed}/${_renamePreview.length} bộ sẽ đổi tên. Bỏ dấu ✓ ở dòng muốn giữ nguyên, hoặc sửa lại tên trong ô.</div>`;

  _renamePreview.forEach(function (r) {
    const diff = r.next !== r.oldName;
    h += '<div class="arc-item" style="border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--card)">';
    h += '<div style="display:flex;align-items:center;gap:8px">';
    h += `<input type="checkbox" id="rpOn-${r.id}"${diff ? ' checked' : ''} style="width:18px;height:18px;flex-shrink:0;accent-color:var(--accent)">`;
    h += `<input id="rpName-${r.id}" class="quiz-input" style="flex:1;min-width:0" value="${esc(r.next)}">`;
    h += '</div>';
    h += `<div style="font-size:15px;font-weight:400;color:var(--text-dim);margin-top:6px;line-height:1.4">cũ: ${esc(r.oldName)}</div>`;
    if (!diff) h += '<div style="font-size:15px;font-weight:400;color:var(--gold);margin-top:3px">Không có gì để rút gọn</div>';
    h += '</div>';
  });

  h += '<div style="display:flex;gap:8px;flex-wrap:wrap;padding-top:4px">';
  h += `<button class="quiz-btn primary"${changed ? '' : ' disabled'} onclick="applyRenamePreview()">✅ Áp dụng ${changed} tên mới</button>`;
  h += '<button class="quiz-btn" onclick="cancelRenamePreview()">Hủy, giữ nguyên</button>';
  h += '</div>';
  body.innerHTML = h;
}

function applyRenamePreview() {
  if (!_renamePreview) return;
  let n = 0;
  _renamePreview.forEach(function (r) {
    const cb = document.getElementById('rpOn-' + r.id);
    const inp = document.getElementById('rpName-' + r.id);
    if (cb && !cb.checked) return;
    const v = ((inp && inp.value) || '').trim();
    const s = libSet(r.id);
    if (!s || !v || v === s.name) return;
    s.name = v;
    n++;
  });
  _renamePreview = null;
  saveLib();
  renderLibPanel(); renderQuiz();
  alert('Đã đổi tên ' + n + ' bộ đề.');
}

// ── SAO LƯU / PHỤC HỒI THƯ VIỆN ──────────────────────────────────────
// Cả thư viện nằm trong localStorage của một trình duyệt, xoá dữ liệu duyệt web
// là mất sạch. Bản sao lưu là một file JSON chứa đủ tên bộ đề + câu hỏi +
// đáp án + giải thích, phục hồi được trên máy khác.
const BACKUP_KIND = 'trac-nghiem-thu-vien';
const BACKUP_VERSION = 1;

function backupStamp() {
  const d = new Date();
  const p = function (n) { return String(n).padStart(2, '0'); };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate())
    + ' ' + p(d.getHours()) + 'h' + p(d.getMinutes()) + 'm' + p(d.getSeconds());
}

function exportLibrary() {
  if (!quizLib.length) { alert('Thư viện đang trống, không có gì để sao lưu.'); return; }
  const payload = {
    kind: BACKUP_KIND,
    version: BACKUP_VERSION,
    exportedAt: new Date().toISOString(),
    sets: quizLib.map(function (s) {
      return {
        name: s.name,
        addedAt: s.addedAt,
        questions: s.questions.map(function (q) {
          return { q: q.q, options: q.options.slice(), correct: q.correct, explain: q.explain || '' };
        })
      };
    })
  };
  const fname = 'trac-nghiem-thu-vien-' + backupStamp() + '.json';
  let url = '';
  try {
    const blob = new Blob([JSON.stringify(payload, null, 1)], { type: 'application/json' });
    url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fname; a.rel = 'noopener'; a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  } catch (e) {
    if (url) { try { URL.revokeObjectURL(url); } catch (e2) {} }
    alert('Không xuất được file: ' + ((e && e.message) || e));
    return;
  }
  setTimeout(function () { try { URL.revokeObjectURL(url); } catch (e) {} }, 60000);
  alert('Đã sao lưu ' + quizLib.length + ' bộ đề · ' + totalQuestions() + ' câu ra file:\n' + fname
    + '\n\nFile nằm ở thư mục Tải về (Downloads). Hãy chép nó sang USB / Google Drive / OneDrive để không mất khi xoá dữ liệu duyệt web hoặc đổi máy.');
}

function pickRestoreFile() { document.getElementById('quizRestoreInput').click(); }
function cancelRestore() { _restorePreview = null; _restoreConfirm = false; renderLibPanel(); }

function handleRestoreFile(inp) {
  const f = (inp.files || [])[0];
  try { inp.value = ''; } catch (e) {}
  if (!f) return;
  const reader = new FileReader();
  reader.onload = function (e) {
    let data = null;
    try { data = JSON.parse(String(e.target.result)); } catch (err) { data = null; }
    if (!data || typeof data !== 'object') {
      alert('File “' + f.name + '” không phải file sao lưu của app (không đọc được nội dung JSON).\nHãy chọn đúng file .json do nút “💾 Sao lưu ra file” tạo ra.');
      return;
    }
    // Chấp nhận cả file có vỏ { kind, sets } lẫn mảng bộ đề trần.
    const rawSets = Array.isArray(data.sets) ? data.sets : (Array.isArray(data) ? data : null);
    if (!rawSets) {
      alert('File “' + f.name + '” không có danh sách bộ đề.\nFile sao lưu đúng phải là .json do app tạo ra (không phải file Excel).');
      return;
    }
    const sets = rawSets.map(function (s) {
      return normalizeSet({
        name: (s && s.name) || 'Bộ đề',
        addedAt: (s && s.addedAt) || Date.now(),
        questions: (s && s.questions) || []
      });
    }).filter(function (s) { return s.questions.length; });
    if (!sets.length) { alert('File sao lưu không có câu hỏi nào đọc được.'); return; }

    let add = 0, update = 0, total = 0;
    sets.forEach(function (s) {
      total += s.questions.length;
      const same = quizLib.some(function (x) {
        return x.name.trim().toLowerCase() === s.name.trim().toLowerCase();
      });
      if (same) update++; else add++;
    });
    _restorePreview = { fileName: f.name, exportedAt: data.exportedAt || '', sets: sets, add: add, update: update, total: total };
    _restoreConfirm = false;
    openLibPanel();
  };
  reader.onerror = function () { alert('Không đọc được file “' + f.name + '”.'); };
  reader.readAsText(f);
}

/** Với bộ trùng tên khi THÊM VÀO: giữ nguyên bộ cũ, chỉ thay câu hỏi.
 *  Với bộ mới: tạo bộ mới mang mốc thời gian ghi trong file. */
function restoreCopyQuestions(src) {
  return src.questions.map(function (q) {
    return { id: quizNewId(), q: q.q, options: q.options.slice(), correct: q.correct, explain: q.explain || '' };
  });
}

// Thêm vào: bộ trùng tên thì cập nhật, bộ khác giữ nguyên — không mất gì.
function applyRestore() {
  if (!_restorePreview) return;
  let added = 0, updated = 0;
  _restorePreview.sets.forEach(function (src) {
    const name = src.name.trim() || 'Bộ đề';
    const same = quizLib.filter(function (x) {
      return x.name.trim().toLowerCase() === name.toLowerCase();
    })[0];
    // Giữ mốc thời gian trong file, để bảng thư viện vẫn hiện đúng ngày nhập gốc.
    if (same) { same.questions = restoreCopyQuestions(src); same.addedAt = src.addedAt || Date.now(); updated++; }
    else { quizLib.push(normalizeSet({ name: name, addedAt: src.addedAt || Date.now(), questions: restoreCopyQuestions(src) })); added++; }
  });
  const kept = quizLib.length - added - updated;
  _restorePreview = null; _restoreConfirm = false;
  saveLib(); resetMixDefaults(); _vnVocab = null;
  _quizMode = 'home';
  renderLibPanel(); renderQuiz();
  alert('Đã phục hồi từ file:\n• ' + added + ' bộ đề mới\n• ' + updated + ' bộ đề được cập nhật'
    + (kept ? '\n• giữ nguyên ' + kept + ' bộ đề cũ không có trong file' : '')
    + '\n\nThư viện hiện có ' + quizLib.length + ' bộ đề · ' + totalQuestions() + ' câu.');
}

// Thay thế toàn bộ: bấm lần đầu chỉ hỏi lại, bấm lần hai mới xoá thật.
function applyRestoreReplace() {
  if (!_restorePreview) return;
  if (!_restoreConfirm) { _restoreConfirm = true; renderLibPanel(); return; }
  const removed = quizLib.length;
  quizLib = _restorePreview.sets.map(function (src) {
    return normalizeSet({
      name: src.name.trim() || 'Bộ đề',
      addedAt: src.addedAt,
      questions: restoreCopyQuestions(src)
    });
  });
  _restorePreview = null; _restoreConfirm = false;
  _libPending = null; _libSetId = null; _renamingSetId = null; _vnVocab = null;
  saveLib(); resetMixDefaults();
  _quizMode = 'home';
  renderLibPanel(); renderQuiz();
  alert('Đã thay thế toàn bộ thư viện:\n• xoá ' + removed + ' bộ đề cũ\n• nạp lại ' + quizLib.length
    + ' bộ đề · ' + totalQuestions() + ' câu từ file.');
}

function renderRestorePreview(body) {
  const r = _restorePreview;
  let h = '';
  h += '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0 4px">';
  h += '<div style="font-size:17px;font-weight:500">📂 Phục hồi từ file</div>';

  h += '</div>';

    + (r.exportedAt ? ' · sao lưu ' + fmtTime(Date.parse(r.exportedAt)) : '') + '</div>';
