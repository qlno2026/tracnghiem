<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800&display=swap');

:root {
  --navy: #111318;
  --navy-mid: #1a1d24;
  /* Màu xanh chính (nút, huy hiệu A/B/C/D, thanh tiến độ). Đã ĐẬM hơn theo yêu cầu
     18/9/2026: #3b82f6 → #1d4ed8 — cùng sắc xanh với đầu dải gradient của .header.
     Đổi luôn cho DỄ ĐỌC hơn: chữ trắng trên #3b82f6 chỉ đạt 3,68:1 (dưới ngưỡng 4.5),
     trên #1d4ed8 đạt 6,63:1 — huy hiệu đáp án vốn là chỗ yếu nhất của app ở chế độ tối. */
  --accent: #1d4ed8;
  /* Xanh NHẠT chỉ dùng cho CHỮ/VIỀN ở chế độ tối (chip đang bật, đồng hồ kỹ thuật số),
     nên KHÔNG hạ xuống theo --accent: chữ phải sáng để đọc được trên nền tối. */
  --accent-glow: #60a5fa;
  --gold: #f59e0b;
  --red: #ef4444;
  --green: #10b981;
  --text: #e2e8f0;
  --text-dim: #94a3b8;
  --answer: #9aa8bb;   /* chữ đáp án ở chế độ tối: nhạt hơn hẳn chữ câu hỏi (#e2e8f0) cho đỡ chói */
  --set-box-bg: #262a33;   /* nền hộp từng bộ đề — xám đậm ở chế độ tối, xám nhạt ở chế độ sáng */
  --border: rgba(255,255,255,0.22);   /* viền ô ở chế độ tối: rõ hơn 0.08 cũ */
  --card: rgba(255,255,255,0.04);
  --radius: 12px;
  --header-h: 56px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Inter', sans-serif;
  font-size: 17px;   /* nền chung cho chữ không tự đặt cỡ, khớp mức +1px của cả app */
  background: var(--navy);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
  touch-action: manipulation;
  transition: background 0.4s ease, color 0.4s ease;
}

/* ── HEADER ───────────────────────── */
.header {
  background:
    linear-gradient(135deg, rgba(255,255,255,0.14), rgba(255,255,255,0) 40%),
    linear-gradient(135deg, #1d4ed8, #1e3a8a);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 3px 10px rgba(0,0,0,0.35);
  height: calc(var(--header-h) + env(safe-area-inset-top, 0px));
  padding: env(safe-area-inset-top, 0px) 10px 0 8px;
  display: flex;
  align-items: center;
  gap: 12px;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 200;
}
.header-left { display: flex; align-items: center; gap: 6px; min-width: 0; }
.title-wrap { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
.header-title { font-size: 17px; font-weight: 500; letter-spacing: 0.3px; color: #ffffff; white-space: nowrap; }
.header-sub { font-size: 15px; font-weight: 400; color: #cbd5e1; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
.header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.theme-toggle {
  width: 44px; height: 44px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  position: relative;
  padding: 0;
  background: transparent;
  flex-shrink: 0;
}
.theme-toggle img {
  width: 100%; height: 100%;
  border-radius: 50%; object-fit: contain; display: block;
}
.theme-toggle:active { transform: scale(0.9); }

.upload-btn-header {
  background: transparent; color: #ffffff; border: none;
  padding: 6px 10px; border-radius: 8px;
  cursor: pointer; display: flex; flex-direction: column;
  align-items: center; line-height: 1.1; gap: 0;
  font-family: 'Inter', sans-serif; flex-shrink: 0;
}
.upload-btn-header:active { background: rgba(203,213,225,0.4); }

/* ── MAIN ───────────────────────── */
.main { padding: 0 8px 60px; }

/* ── BUTTONS ───────────────────────── */
.big-upload-btn {
  padding: 12px 18px;
  border: none;
  border-radius: 10px;
  background: var(--accent);
  color: #ffffff;
  font-family: 'Inter', sans-serif;
  font-size: 17px;
  font-weight: 500;
  cursor: pointer;
}
.big-upload-btn:active { opacity: 0.9; }
.big-upload-btn:disabled { opacity: 0.45; cursor: not-allowed; }

.quiz-btn {
  padding: 9px 12px; border-radius: 9px; cursor: pointer;
  border: 1px solid var(--border); background: var(--navy-mid); color: var(--text);
  font-family: 'Inter', sans-serif; font-size: 17px; font-weight: 500;
}
.quiz-btn.primary { background: var(--accent); color: #ffffff; border-color: var(--accent); }
.quiz-btn.danger { background: var(--red); color: #ffffff; border-color: var(--red); }
.quiz-btn:active { opacity: 0.85; }

.quiz-toggle {
  padding: 7px 10px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--border); background: transparent; color: var(--text-dim);
  font-family: 'Inter', sans-serif; font-size: 17px; font-weight: 500;
}
.quiz-toggle.on { background: rgba(59,130,246,0.18); border-color: var(--accent); color: var(--accent-glow); }

/* Hai chip bật/tắt trên trang chủ nằm CHUNG MỘT HÀNG.
   Đo bằng canvas ở cỡ 17px: “Đảo câu hỏi” 96.3px, “Đảo đáp án” 92.2px. Cộng
   padding 8px mỗi bên và gap 8px thì cần 228.5px — vừa khung nhìn 311px (thẻ
   rộng 266px). Bản cũ “Đảo câu hỏi: Bật” + “Đảo đáp án: Bật” cần 309px nên mỗi
   cái phải xuống một hàng; thêm icon 🔀 còn tốn thêm ~56px nữa.
   `auto-fit` + `minmax(120px, 1fr)` cho hai cột BẰNG NHAU khi đủ chỗ, và tự dồn
   thành một cột khi cửa sổ hẹp hơn ~248px — không bao giờ tràn chữ. */
.chip-row {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 8px; margin-top: 8px;
}
.quiz-toggle.chip { padding: 7px 8px; text-align: center; }

/* Hàng nút thư viện trên trang chủ. Trước 18/9/2026 hàng này có BA nút (Chọn file /
   Thư mục / Thư viện) và phải đo bằng canvas ở cửa sổ 311px mới vừa: cả ba nhãn đầy
   đủ cần 294px trong khi thẻ chỉ có 265px, nên nhãn phải rút ngắn và thử cả
   `flex: 1 1 0` (làm "Chọn thư mục" bị bẻ 3 dòng). Hai nút đầu đã bỏ theo yêu cầu —
   còn đúng một nút mở bảng 📦, `.lib-act` bên dưới giờ chỉ giữ cỡ nút ổn định.
   `flex: 1 1 auto` (không phải `1 1 0`) để bề ngang thả theo nội dung; `flex-wrap:
   wrap` là lưới an toàn cho cửa sổ hẹp hơn nữa — nút cuối xuống hàng dưới chứ
   KHÔNG bị cắt chữ (đừng dùng `white-space: nowrap`: nó tràn chữ ra ngoài nút
   ngay khi flex phải co lại).
   Không emoji trong ba nhãn: “📁 ” chiếm 28px, đủ đẩy tổng vượt 265px.
   `width:auto` để thắng `width:100%` của .big-upload-btn, và lớp này đặt sau nên
   đè được padding 12px 18px của nút đó. */
.lib-act {
  flex: 1 1 auto; min-width: 0; width: auto;
  padding: 9px 5px;
  text-align: center;
}
.lib-act-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }

/* ── QUIZ ───────────────────────── */
/* Lề giữa các bảng trên trang chủ, siết 19/9/2026 ("khoảng cách các bảng này nhỏ lại"):
   chủ yếu là PADDING chứ không phải margin — nhìn vào khe giữa hai thẻ là thấy 10px lề
   trong + 5px margin + 10px lề trong, nên chỉ hạ margin thì gần như không đổi. Đây là chỗ
   NGƯỢC với thanh dính (thanh dính siết để đỡ che nội dung, còn ở đây chỉ để đỡ trống). */
.quiz-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 10px; margin: 5px 0;
}
.quiz-input {
  width: 100%; padding: 10px; border-radius: 10px;
  border: 1.5px solid var(--border); background: var(--navy-mid);
  color: var(--text); font-family: 'Inter', sans-serif; font-size: 17px; font-weight: 500;
}
.quiz-input:focus { outline: none; border-color: var(--accent); }
.quiz-opt {
  display: flex; align-items: flex-start; gap: 8px; width: 100%;
  text-align: left; padding: 9px; margin-bottom: 6px;
  border-radius: 10px; border: 1.5px solid var(--border);
  background: var(--navy-mid); color: var(--answer);
  font-family: 'Inter', sans-serif; font-size: 16px; line-height: 1.5;
  font-weight: 500;   /* câu trả lời: 16px, nét 500 */
  cursor: pointer;
}
.quiz-opt:disabled { cursor: default; }
.quiz-opt.correct { border-color: var(--green); background: rgba(16,185,129,0.15); }
.quiz-opt.wrong { border-color: var(--red); background: rgba(239,68,68,0.15); }
.quiz-badge {
  min-width: 22px; height: 22px; border-radius: 50%;
  background: var(--accent); color: #ffffff;
  font-size: 13px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.quiz-opt .mark { font-size: 16px; line-height: 1.2; flex-shrink: 0; }
/* Số câu đặt trước nội dung câu hỏi. Thay icon ❓ emoji ở lượt trước: emoji rộng
   19px mà không mang thông tin gì, còn vòng tròn mang luôn SỐ CÂU nên bỏ được dòng
   nhãn “Câu 1/30” trên mỗi thẻ — trang ngắn hơn hẳn.
   Kiểu: KHÔNG có nền, chỉ một viền đỏ mảnh + số màu đỏ (yêu cầu người dùng — trước
   đó là nền xanh đặc như huy hiệu A/B/C/D). Vì không còn nền nên viền phải là
   `1px solid` chứ không phải nền mờ, nếu không số sẽ trôi trên nền thẻ.
   Dài ra thành viên thuốc khi số có 2-3 chữ số: bài trộn mặc định 100 câu nên
   “100” phải vừa.
   Cỡ số 13px trên vòng 20px (người dùng thấy 12px hơi nhỏ). Vòng chỉ tăng 1px vì
   bề ngang của vòng chính là bề ngang câu hỏi bị lấy đi — đo trên bộ 30 câu: tổng
   số dòng phải xuống thêm không đổi so với vòng 19px. `margin-top: 2px` giữ số
   nằm giữa dòng chữ đầu (hộp 20px trong dòng 24px). */
.q-num {
  min-width: 20px; height: 20px; border-radius: 10px; padding: 0 5px;
  box-sizing: border-box; background: transparent;
  border: 1px solid var(--red); color: var(--red);
  font-size: 13px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-top: 2px;
}
.quiz-fb {
  display: none; margin-top: 5px; padding: 8px 10px;
  border-radius: 10px; font-size: 16px; line-height: 1.5;
}
.quiz-fb.show { display: block; }
.quiz-fb.ok { background: rgba(16,185,129,0.14); border: 1px solid var(--green); }
.quiz-fb.no { background: rgba(239,68,68,0.14); border: 1px solid var(--red); }
.quiz-all-head {
  position: sticky; z-index: 5;
  top: calc(var(--header-h) + env(safe-area-inset-top, 0px));
  /* Nền ĐỤC là bắt buộc vì đây là thanh DÍNH: câu hỏi và đáp án cuộn qua bên dưới.
     `.quiz-card` cho nền `--card` = rgba(255,255,255,0.04) — đúng cho thẻ thường,
     nhưng ở thanh dính thì 96% trong suốt nên chữ cuộn qua hiện xuyên lên, đè cả
     tiêu đề bộ đề lẫn dòng “Đã trả lời… · Đúng… · Sai…”. Chỉ chế độ tối bị, vì
     `body.light-mode .quiz-card` (độ ưu tiên cao hơn) đã đặt #ffffff đục sẵn.
     --navy-mid (#1a1d24) chính là --navy (#111318) hoà 4% trắng — đúng cái mà
     rgba(255,255,255,0.04) đang cho ra trên nền trang, nhưng ĐỤC. */
  background: var(--navy-mid);
  /* GỌN: đây là thanh DÍNH, mỗi px chiều cao là một px nội dung bị che, nên padding
     riêng cho nó nhỏ hơn thẻ thường (7px 10px thay vì 11px). Đo ở khung 468px:
     78px → 63px (−19%). Kèm theo: khe tiêu đề ↔ dòng điểm 6px → 3px và nút 🏠
     padding 6px 9px → 4px 8px (khi đó nút còn 41×26).
     SAU ĐÓ (cùng ngày) nút 🏠 được làm TO LÊN theo yêu cầu — xem khối `.home-btn`
     ở trên: nút 62×45 nên thanh này cao lại 63px → 82px khi tiêu đề một dòng. */
  padding: 7px 10px;
}

/* ── ĐẦU MÀN LÀM BÀI ─────────────────
   Hàng đầu của mọi màn làm bài: nút về trang chủ + tiêu đề bộ đề.
   Nút nằm BÊN TRÁI HÀNG TIÊU ĐỀ — vị trí chuẩn của nút quay lại, và cũng là chỗ
   rẻ nhất về chiều cao. Ba phương án đã đo ở khung nhìn 393px (thẻ 349px):
   - Cạnh tiêu đề (đang dùng): ô tiêu đề còn 298px. Tiêu đề ngắn (“Văn hóa doanh
     nghiệp · 30 câu” 253px) vẫn một dòng; vài tên dài thêm một dòng.
   - Cạnh dòng tóm tắt: tiêu đề giữ nguyên, nhưng ở khung nhìn 311px dòng tóm tắt
     “Đã trả lời … · Đúng … · Sai …” cần 218.5px + nút 51px = 269px mà chỉ có
     249px → tóm tắt bị ngắt thành hai dòng, xấu hơn ngắt tiêu đề.
   - Hàng riêng cho nút: đầu bài cao thêm ~30px ở mọi bề ngang.
   Nút chỉ dùng emoji 🏠 (23px chữ): nhãn “Trang chủ” cần 103px + padding, đủ để
   ngốn thêm 80px bề ngang của tiêu đề. */
.head-row { display: flex; align-items: center; gap: 8px; }
/* Nút về trang chủ đã được làm TO hơn (yêu cầu 18/9/2026: “cho nút quay lại màn
   hình chính to hơn”). Trước đó nó bị thu nhỏ xuống 4px 8px chính vì lý do ngược lại
   — xem khối .quiz-all-head bên dưới: đây là thứ QUYẾT ĐỊNH chiều cao hàng đầu bài.
   Đo ở khung 468px, tiêu đề ngắn “Chuẩn mực đạo đức · 10 câu” (một dòng, 21px):

   | font/padding        | nút     | thanh dính |
   |---------------------|---------|------------|
   | 17px 4px 8px (cũ)   | 41×26   | 63px       |
   | 22px 6px 11px       | 54×35   | 72px       |
   | **24px 10px 14px**  | **62×45** | **82px** |
   | 28px 8px 14px       | 68×45   | 82px       |

   Chọn dòng in đậm ban đầu, rồi GIẢM xuống ("cho icon quay lại nhỏ hơn 1 tí", 19/9/2026):
   font 24px → 20px, padding 10/14 → 7/11 → nút **48×34**. Vẫn lớn hơn bản gốc 41×26,
   vẫn trên ngưỡng chạm WCAG 24×24, và thanh dính hạ xuống **74px** (từ 82).*/
.home-btn { padding: 7px 11px; line-height: 1; font-size: 20px; flex-shrink: 0; }
/* (Icon ❓ emoji ở lượt trước đã bị thay bằng .q-num — xem khai báo .q-num ở trên.) */
/* Ghi chú cũ của icon ❓, giữ lại để biết vì sao không quay lại emoji ở cỡ chữ lớn:
   emoji ở 16px rộng 22px, cộng khe 8px là lấy mất 30px bề ngang câu hỏi — đo trên
   bộ Văn hóa doanh nghiệp thì 10/30 câu phải xuống thêm một dòng.

/* Bốn nút làm bài của mỗi bộ đề: lưới 2×2 với hai cột BẰNG NHAU.
   Trước đây là flex-wrap nên mỗi nút rộng theo nhãn — hàng trên [Từng câu][Cả bộ]
   và hàng dưới [Học][Câu hỏi] lệch cỡ nhau, nhìn như lỗi. Lưới 2 cột cho cả bốn
   nút cùng bề ngang và cùng chiều cao.
   Padding ngang co từ 12px xuống 6px để nhãn dài nhất “▶️ Từng câu” (≈93px) vẫn
   nằm một dòng: ở khung nhìn 311px mỗi cột chỉ còn ≈120px, trừ 12px padding là
   ≈108px chỗ cho chữ. Bốn nút trên MỘT hàng là không thể ở cỡ 17px (mỗi nút chỉ
   còn ≈78px, không đủ cho nhãn), nên 2×2 là cách duy nhất để cả bốn đều nhau. */
.set-acts {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px;
  grid-auto-rows: 1fr;   /* cửa sổ rất hẹp: có nhãn phải xuống 2 dòng thì cả bốn nút vẫn cao bằng nhau */
}
.set-acts .quiz-btn { width: 100%; padding: 9px 6px; text-align: center; }

/* ── MODAL ───────────────────────── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 300;
  align-items: flex-end;
  justify-content: center;
}
.modal-overlay.open { display: flex; }

.modal {
  background: #1a1d24;
  border: 1px solid var(--border);
  font-family: 'Inter', sans-serif;
  border-radius: 20px 20px 0 0;
  width: 100%;
  max-width: 560px;
  max-height: 85vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
@media (min-width: 640px) {
  .modal-overlay { align-items: center; padding: 24px; }
  .modal { border-radius: 16px; max-height: 80vh; }
}
.modal-handle {
  width: 36px; height: 3px;
  background: rgba(255,255,255,0.2);
  border-radius: 2px;
  margin: 5px auto 0;
}
.modal-body { padding: 4px 12px 20px; }

/* ── LIGHT MODE ───────────────────────── */
/* Nền chế độ sáng: trắng xám để các thẻ trắng nổi rõ. Thẻ và ô nhập vẫn trắng. */
/* --text-dim đậm hơn #64748b một chút: hộp từng bộ đề giờ có nền xám #f1f3f5, mà
   #64748b trên xám đó chỉ đạt 4.31:1 (dưới ngưỡng 4.5:1). #5b6675 cho 5.27:1 trên
   nền xám và 5.83:1 trên thẻ trắng. */
body.light-mode { background: #e9ecef; color: #000000; --text-dim: #5b6675; --border: rgba(0,0,0,0.22); --answer: #1e293b; --set-box-bg: #f1f3f5; }

/* Hộp từng bộ đề trên trang chủ (📝 Thi từng bộ đề) có nền riêng để tách khỏi thẻ
   chứa nó: xám ĐẬM #262a33 ở chế độ tối (thẻ tối chỉ ≈#1b1c21 nên hộp nhỉnh lên,
   đọc ra là một tấm riêng), xám NHẠT #f1f3f5 ở chế độ sáng (thẻ trắng nên hộp lùi
   xuống). Một biến duy nhất, không phải hai luật chồng nhau. */
.set-box { background: var(--set-box-bg); }
/* Nhãn tên bộ đề: nền NHẸ (tint trong suốt) + chữ cùng tông, dáng giống hai chip
   “Đảo câu hỏi / Đảo đáp án”. Lịch sử màu theo yêu cầu người dùng: xanh ĐẶC + chữ
   trắng → xanh nhẹ → **đỏ nhẹ** (đang dùng). Đừng viết style thẳng trong thẻ: cần
   luật riêng cho chế độ sáng, mà style thẳng thì CSS thường không ghi đè được.
   Đỏ phải SÁNG hơn xanh khi làm chữ (mắt nhạy với đỏ kém hơn): ở chế độ tối dùng
   #f87171 chứ không phải --red #ef4444 — đo được 3,34:1 là quá mờ. */
.set-name {
  display: inline-block;
  /* Nền XANH DƯƠNG NHẸ + VIỀN (yêu cầu 19/9/2026) — trước đó là nền đỏ nhạt không viền.
     Dùng đúng sắc xanh của app (--accent #1d4ed8) ở alpha thấp, nên nhãn cùng họ màu với
     nút “Thư viện”/“Từng câu” mà không thành một khối xanh đặc.
     Lề trong hạ 1px mỗi phía (3px 9px → 2px 8px) để BÙ cho đường viền 1px: nhãn vẫn đúng
     182×30px như trước, không làm thẻ bộ đề cao thêm. */
  background: rgba(29,78,216,0.16);
  border: 1px solid rgba(96,165,250,0.55);
  color: #ffffff;
  padding: 2px 8px; border-radius: 8px;
}
/* Chế độ sáng: viền phải ĐẬM hơn chế độ tối mới thấy rõ, vì nền nhạt và mắt nhạy với
   xanh dương kém hơn. Đo trên nền đã pha: 0,45 → ~2,0:1 (mờ), 0,60 → ~2,6:1 (rõ mà vẫn mảnh). */
body.light-mode .set-name {
  background: rgba(29,78,216,0.10);
  border-color: rgba(29,78,216,0.6);
  /* Chữ XANH DƯƠNG ĐẬM (yêu cầu 19/9/2026) — trước là đen tuyền. Dùng #1e40af chứ không
     phải --accent #1d4ed8: đây đúng là màu chữ xanh đậm app đã dùng cho chip đang bật ở
     chế độ sáng, đo trên nền đã pha được 7,45:1. Chế độ tối vẫn giữ chữ TRẮNG — xanh đậm
     trên nền tối là không đọc được, và luật cũ của người dùng vẫn là “trắng ở dark mode”. */
  color: #1e40af;
}
/* Tên bộ đề trong bảng 🎲 Trộn đề: nền XANH LÁ NHẸ + chữ cùng tông (yêu cầu 18/9/2026).
   Cùng dáng với nhãn .set-name ở danh sách bộ đề nhưng KHÁC TÔNG màu (đỏ vs xanh lá)
   nên nhìn là biết đang ở bảng nào — đừng dùng chung một lớp cho cả hai chỗ.
   Chữ xanh lá ở chế độ tối phải SÁNG (#34d399), không dùng --green #10b981: mắt nhạy
   với xanh lá kém hơn xanh dương, #10b981 trên tint này chỉ 5,32:1 còn #34d399 đạt
   7,09:1. Chế độ sáng ngược lại cần ĐẬM: #15803d chỉ 4,44:1 (dưới ngưỡng 4,5:1) nên
   dùng #166534 — 6,40:1. Đừng viết style thẳng trong thẻ: style thẳng không ghi đè
   được luật chế độ sáng. */
.mix-name {
  display: inline-block;
  /* Nền xanh lá THẬT NHẠT + chữ trắng/đen theo chế độ (yêu cầu 19/9/2026).
     Lịch sử: xanh lá 0,14 + chữ #34d399 → giờ alpha xuống 0,07 và chữ sang #ffffff.
     Nhạt hơn nhưng chữ ĐẬM hơn (trắng đặc) nên tương phản TĂNG: 7,07:1 → ~15:1.
     Đừng hạ alpha thêm: dưới 0,05 thì nhãn mất hẳn trên nền tối. */
  background: rgba(16,185,129,0.07);
  color: #ffffff;
  padding: 3px 8px; border-radius: 8px;
}
/* Chế độ sáng: chữ XANH ĐEN (#134e4a), không phải đen tuyền (yêu cầu 19/9/2026).
   Đổi màu chữ chứ KHÔNG đổi màu nền: nền vẫn là tint xanh lá 0,06 của .mix-name.
   Đo trên nền đã pha (tint trên thẻ trắng #ffffff = rgb(241,251,247)): #134e4a được
   8,97:1 — còn dễ đọc hơn cả đen tuyền vì bớt tương phản gắt. Đừng dùng #166534 ở đây:
   đó là xanh LÁ (đang dùng cho đáp án đúng), trùng tông với nền tint của chính nhãn. */
body.light-mode .mix-name { background: rgba(16,185,129,0.06); color: #134e4a; }
/* Nút "↺ Mặc định" trong thẻ Trộn đề. Chỉ là CHỮ XANH có viền mảnh, không phải nút khối:
   nó là lối thoát cho việc tỷ lệ đã được lưu vào máy, nên phải có nhưng không được tranh
   chỗ với ba nút trộn thật. Vì là chữ trong thẻ nên phải dùng --accent-glow, KHÔNG dùng
   --text-dim (chữ mờ trong thẻ này là chữ phụ 15px/400, nút cần nổi hơn một bậc).
   KHÔNG dùng --accent ở đây: #1d4ed8 là màu cho NỀN NÚT (chữ trắng trên nó), làm màu
   chữ trên nền thẻ tối chỉ đạt 4,0:1 — đúng cái bẫy --accent-glow sinh ra để tránh. */
.mix-reset {
  background: none; border: 1px solid var(--border); border-radius: 8px;
  color: var(--accent-glow); font-family: 'Inter', sans-serif;
  font-size: 15px; font-weight: 400; padding: 4px 9px; cursor: pointer;
}
.mix-reset:hover { border-color: var(--accent-glow); }

/* ── CẶP NÚT ▲▼ cạnh ô phần trăm (19/9/2026 — "muốn có dấu mũi tên lên xuống kế ô số
   chỉnh cho dễ khi xem trên điện thoại"). Đặt NGAY SAU ô nhập nên không phải với tay, và
   mỗi cú chạm CHỐT LUÔN (chia lại tỷ lệ), khác mũi tên mặc định của trình duyệt — thứ chỉ
   sửa số rồi chờ rời ô. Vì vậy mũi tên mặc định được ẩn đi ở các ô phần trăm để không
   thành hai bộ mũi tên chồng nhau trên máy tính.
   26×20 mỗi nút: nhỏ hơn khuyến nghị 44px, nhưng bù lại GIỮ để tự lặp khi đè ngón tay. */
.mix-step { display: flex; flex-direction: column; gap: 2px; flex: none; }
.mix-step button {
  width: 32px; height: 17px; padding: 0; line-height: 1;
  font-family: 'Inter', sans-serif; font-size: 10px;
  background: none; border: 1px solid var(--border); border-radius: 6px;
  color: var(--text-dim); cursor: pointer;
}
/* Ô số của bảng trộn — lớp RIÊNG để thu nhỏ (19/9/2026 "cho ô số nhỏ lại") mà không kéo theo
   .quiz-input (ô đổi tên bộ đề dùng chung lớp đó, phải giữ 17px/10px lề). 46×35 thay vì 62×41:
   đủ chỗ cho 3 chữ số "100", và trả lại ~16px cho cột tên bộ đề. */
.mix-input { width: 46px; padding: 7px 4px; text-align: center; font-size: 15px; }
.mix-step button:hover { border-color: var(--accent-glow); color: var(--text); }
.mix-step button:active { background: rgba(127, 127, 127, 0.22); color: var(--text); }
input[id^="mixPct-"]::-webkit-outer-spin-button,
input[id^="mixPct-"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
input[id^="mixPct-"] { -moz-appearance: textfield; appearance: textfield; }
/* Chế độ sáng: #60a5fa trên thẻ trắng chỉ 2,5:1 — phải đổi sang xanh ĐẬM, cùng màu
   #1e40af mà .quiz-toggle.on dùng ở chế độ sáng (7,45:1 trên nền chip). */
body.light-mode .mix-reset { color: #1e40af; border-color: rgba(0,0,0,0.35); }
body.light-mode .mix-reset:hover { border-color: #1e40af; }

/* ── SEARCH ───────────────────────── */
/* Thanh tìm kiếm đứng RIÊNG, ngay dưới thanh xanh trên cùng và TRÊN thẻ “📚 Thư viện
   bộ đề” (19/9/2026 — trước đó nó nằm trong thẻ). Vì ở ngoài thẻ nên KHÔNG có nền hay
   viền của .quiz-card: chỉ ô nhập (--navy-mid + viền --border) nổi trên nền trang.
   Lề trên 8px trùng nhịp với .main 0 8px hai bên, để nó thẳng hàng với các thẻ bên dưới. */
.search-wrap { position: relative; margin: 8px 0 6px; }
.search-input {
  width: 100%; padding: 9px 12px 9px 34px;
  border-radius: 10px; border: 1.5px solid var(--border);
  background: var(--navy-mid); color: var(--text);
  font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 400;
}
.search-input:focus { outline: none; border-color: var(--accent); }
.search-icon {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  font-size: 16px; pointer-events: none; opacity: 0.6;
}
.search-results {
  max-height: 360px; overflow-y: auto; margin-top: 6px;
  -webkit-overflow-scrolling: touch;
}
.search-results:empty { display: none; }
.search-hit {
  padding: 9px; margin-bottom: 6px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--navy-mid);
}
.search-hit-set {
  font-size: 13px; font-weight: 500; color: var(--accent-glow);
  margin-bottom: 4px;
}
.search-hit-q {
  font-size: 16px; font-weight: 500; color: var(--text);
  line-height: 1.5; margin-bottom: 4px;
}
.search-hit-a {
  font-size: 15px; font-weight: 400; color: var(--green);
  line-height: 1.4;
}
.search-hit-q em, .search-hit-a em {
  font-style: normal; background: rgba(251,191,36,0.25);
  border-radius: 3px; padding: 0 2px;
}
.search-empty {
  font-size: 15px; color: var(--text-dim); padding: 8px 0;
}
body.light-mode .search-input { background: #ffffff; border-color: #b3bfcc; color: #1e293b; }
body.light-mode .search-hit { background: #ffffff; border-color: #c9d1da; }
body.light-mode .search-hit-q { color: #1e293b; }
body.light-mode .search-hit-a { color: #166534; }
body.light-mode .header {
  background:
    linear-gradient(135deg, rgba(255,255,255,0.22), rgba(255,255,255,0) 42%),
    linear-gradient(135deg, #1e40af, #1e3a8a);
  box-shadow: 0 3px 10px rgba(30,64,175,0.35);
}
body.light-mode .header-sub { color: #dbeafe; }
body.light-mode .modal { background: #f0f1f4; }
body.light-mode .modal-handle { background: rgba(0,0,0,0.15); }
body.light-mode .quiz-card { background: #ffffff; border-color: #c9d1da; }
body.light-mode .quiz-input { background: #ffffff; border-color: #b3bfcc; color: #1e293b; }
body.light-mode .quiz-btn { background: #ffffff; border-color: #b3bfcc; color: #1e293b; }
body.light-mode .quiz-btn.primary { background: #1d4ed8; color: #ffffff; border-color: #1d4ed8; }
body.light-mode .quiz-btn.danger { background: #dc2626; color: #ffffff; border-color: #dc2626; }
body.light-mode .quiz-opt { background: #ffffff; border-color: #b3bfcc; color: #1e293b; }
/* Đáp án đã chọn ở CHẾ ĐỘ SÁNG phải hiện xanh/đỏ y như chế độ tối.
   Luật `body.light-mode .quiz-opt` ở ngay trên có độ ưu tiên cao hơn
   `.quiz-opt.correct/.wrong` (2 class + 1 thẻ so với 2 class), nên nó XOÁ luôn màu của
   chế độ tối — chọn đúng hay sai đều ra nền trắng như nhau. Phải khai báo lại ở đúng
   mức ưu tiên đó, và dùng đúng hai màu mà chế độ tối dùng. */
body.light-mode .quiz-opt.correct { border-color: var(--green); background: rgba(16,185,129,0.15); }
body.light-mode .quiz-opt.wrong { border-color: var(--red); background: rgba(239,68,68,0.15); }
/* Chip bật/tắt ở chế độ sáng: chữ xanh nhạt --accent-glow (#60a5fa) trên nền chip
   xanh nhạt chỉ đạt 2.06:1 — không đọc được. Đổi sang xanh đậm, vì giờ trạng thái
   BẬT chỉ hiện bằng màu (nhãn không còn kèm “: Bật”). Đậm thêm lần nữa theo yêu cầu
   (18/9/2026): #1d4ed8 → #1e40af, đo được 7.45:1 trên nền chip ở chế độ sáng. */
body.light-mode .quiz-toggle.on { background: rgba(59,130,246,0.14); border-color: #1d4ed8; color: #1e40af; }
/* Số câu (viền đỏ) ở chế độ sáng: --red #ef4444 trên thẻ trắng chỉ đạt 3.76:1 —
   hơi mờ cho một con số nhỏ. Dùng #dc2626 (đúng màu đỏ mà chế độ sáng đã dùng ở
   .quiz-btn.danger) → 4.53:1, vượt ngưỡng dễ đọc. */
body.light-mode .q-num { border-color: #dc2626; color: #dc2626; }
/* Hộp phản hồi ✅/❌: chế độ sáng dùng 0.12 còn chế độ tối 0.14 — chênh 2% độ trong
   suốt, không nhìn ra được, nhưng để y hệt chế độ tối thì lấy 0.14 cho cả hai. */
body.light-mode .quiz-fb.ok { background: rgba(16,185,129,0.14); }
body.light-mode .quiz-fb.no { background: rgba(239,68,68,0.14); }
body.light-mode .arc-item { background: #ffffff !important; border-color: #c9d1da !important; }

#quizFileInput, #quizDirInput, #quizRestoreInput { display: none; }
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
// ── HELPERS ────────────────────────────────────────────────────────────
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
// Bỏ dấu tiếng Việt + hạ chữ thường (dùng cho tìm kiếm/so khớp)
function normVn(s) { return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
// normVn() bỏ dấu được nhưng chữ "đ" không phân rã NFD được, nên phải đổi thủ công.
function quizNormBase(s) { return normVn(String(s == null ? '' : s)).replace(/đ/g, 'd'); }
function quizKey(s) { return quizNormBase(s).replace(/[_\s]/g, ''); }
function quizText(s) { return quizNormBase(s).replace(/\s+/g, ' ').trim(); }

// Đọc file thành workbook. File CSV/txt được tự giải mã UTF-8, vì SheetJS mặc định
// đọc CSV theo codepage Latin-1 nên tiếng Việt sẽ bị sai dấu và không khớp tên cột.
function readWorkbook(arrayBuffer, fileName) {
  const bytes = new Uint8Array(arrayBuffer);
  if (/\.(csv|txt|tsv)$/i.test(String(fileName || ''))) {
    let text = new TextDecoder('utf-8').decode(bytes);
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1); // bỏ BOM nếu có
    return XLSX.read(text, { type: 'string' });
  }
  return XLSX.read(bytes, { type: 'array' });
}

function shuffleArr(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

// ── CLOCK ──────────────────────────
function updateLiveClock() {
  const el = document.getElementById('clockLive');
  const dateEl = document.getElementById('clockDateLive');
  if (!el) return;
  const now = new Date();
  el.textContent = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
  if (dateEl) {
    const days = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
    dateEl.textContent = days[now.getDay()] + ', ' + now.getDate() + '/' + (now.getMonth() + 1) + '/' + String(now.getFullYear()).slice(-2);
  }
}
updateLiveClock();
setInterval(updateLiveClock, 1000);

function showClock() {
  let overlay = document.getElementById('clockOverlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'clockOverlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:9999;display:flex;align-items:center;justify-content:center';
    overlay.onclick = function(e) { if (e.target === overlay) overlay.style.display = 'none'; };
    const box = document.createElement('div');
    box.style.cssText = 'background:#1a1d24;border-radius:20px;padding:32px 40px;text-align:center;box-shadow:0 16px 48px rgba(0,0,0,0.5);min-width:240px';
    box.innerHTML = '<div id="clockDigital" style="font-size:49px;font-weight:200;color:#60a5fa;letter-spacing:2px"></div>' +
      '<div id="clockDate" style="font-size:15px;font-weight:400;color:#94a3b8;margin-top:8px"></div>';
    overlay.appendChild(box);
    document.body.appendChild(overlay);
  }
  overlay.style.display = 'flex';
  (function tick() {
    if (overlay.style.display === 'none') return;
    const now = new Date();
    document.getElementById('clockDigital').textContent =
      String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0') + ':' + String(now.getSeconds()).padStart(2, '0');
    const days = ['Chủ nhật', 'Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7'];
    const months = ['Tháng 1', 'Tháng 2', 'Tháng 3', 'Tháng 4', 'Tháng 5', 'Tháng 6', 'Tháng 7', 'Tháng 8', 'Tháng 9', 'Tháng 10', 'Tháng 11', 'Tháng 12'];
    document.getElementById('clockDate').textContent =
      days[now.getDay()] + ', ' + now.getDate() + ' ' + months[now.getMonth()] + ' ' + now.getFullYear();
    requestAnimationFrame(tick);
  })();
}

// Chủ đề ghi nhớ RIÊNG cho hai kiểu màn hình: màn RỘNG mặc định TỐI, màn HẸP
// (điện thoại, ≤480px — cùng ngưỡng với các tính năng mobile trước đây) mặc định SÁNG.
// Bấm nút chỉ đổi cho kiểu màn hình đang xem, nên lựa chọn tối trên máy tính không
// kéo theo điện thoại và ngược lại.
const THEME_MOBILE_W = 480;
function isPhoneView() { return window.innerWidth <= THEME_MOBILE_W; }
function themeBucket() { return isPhoneView() ? 'narrow' : 'wide'; }
let _theme = { wide: 'dark', narrow: 'light' };
(function restoreTheme() {
  let raw = null;
  try { raw = localStorage.getItem('qlno_theme'); } catch (e) {}
  if (raw === 'light' || raw === 'dark') {
    _theme.wide = raw;                    // dạng cũ (một chuỗi) = lựa chọn trên màn RỘNG
  } else if (raw) {
    try {
      const saved = JSON.parse(raw);
      if (saved && typeof saved === 'object') {
        if (saved.wide === 'light' || saved.wide === 'dark') _theme.wide = saved.wide;
        if (saved.narrow === 'light' || saved.narrow === 'dark') _theme.narrow = saved.narrow;
      }
    } catch (e) {}
  }
  if (_theme[themeBucket()] === 'light') document.body.classList.add('light-mode');
})();
function toggleTheme() {
  const bucket = themeBucket();
  _theme[bucket] = document.body.classList.toggle('light-mode') ? 'light' : 'dark';
  try { localStorage.setItem('qlno_theme', JSON.stringify(_theme)); } catch (e) {}
}

function quizNewId(prefix) { return (prefix || 'q') + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function normalizeQ(q) {
  const out = {
    id: (q && q.id) ? String(q.id) : quizNewId(),
    q: String((q && q.q) || ''),
    options: (q && Array.isArray(q.options)) ? q.options.map(function (o) { return String(o); }) : [],
    correct: (q && typeof q.correct === 'number') ? q.correct : 0,
    explain: (q && typeof q.explain === 'string') ? q.explain : ''
  };
  if (!out.q || out.options.length < 2) return null;
  if (out.correct < 0 || out.correct >= out.options.length) out.correct = 0;
  return out;
}

function normalizeSet(s) {
  return {
    id: (s && s.id) ? String(s.id) : quizNewId('s'),
    name: String((s && s.name) || 'Bộ đề'),
    addedAt: (s && s.addedAt) || Date.now(),
    questions: ((s && Array.isArray(s.questions)) ? s.questions : []).map(normalizeQ).filter(Boolean)
  };
}

function loadLib() {
  let raw = null;
  try { raw = localStorage.getItem(LIB_KEY); } catch (e) { raw = null; }

  if (raw === null) {                    // lần đầu chạy bản nhiều bộ đề
    let old = [];
    try { old = JSON.parse(localStorage.getItem(LEGACY_KEY) || '[]'); } catch (e) { old = []; }
    quizLib = [];
    const qs = (Array.isArray(old) ? old : []).map(normalizeQ).filter(Boolean);
    if (qs.length) quizLib.push(normalizeSet({ name: OLD_SET_NAME, questions: qs }));
    saveLib();
    return;
  }

  let parsed = [];
  try { parsed = JSON.parse(raw); } catch (e) { parsed = []; }
  quizLib = (Array.isArray(parsed) ? parsed : [])
    .map(normalizeSet)
    .filter(function (s) { return s.questions.length; });
}

function saveLib() {
  try { localStorage.setItem(LIB_KEY, JSON.stringify(quizLib)); }
  catch (e) { alert('Không lưu được thư viện: ' + ((e && e.message) || e)); }
}

function libSet(id) {
  for (let i = 0; i < quizLib.length; i++) if (quizLib[i].id === id) return quizLib[i];
  return null;
}
function curSet() { return libSet(_libSetId) || quizLib[0] || null; }
function totalQuestions() { return quizLib.reduce(function (n, s) { return n + s.questions.length; }, 0); }

function updateBankLabel() {
  const el = document.getElementById('bankLabel');
  if (!el) return;
  const n = totalQuestions();
  el.textContent = quizLib.length ? (quizLib.length + ' bộ đề · ' + n + ' câu') : 'Chưa có bộ đề';
}

// ── RENDER ──────────────────────────
function renderQuiz() {
  const pane = document.getElementById('quizPane');
  if (!pane) return;
  updateBankLabel();
  if (_quizMode === 'browse') { pane.innerHTML = quizBrowseHtml(); return; }
  if (_quizMode === 'play') { pane.innerHTML = quizPlayHtml(); return; }
  if (_quizMode === 'playAll') { pane.innerHTML = quizAllHtml(); updateAllSummary(); return; }
  if (_quizMode === 'study') { pane.innerHTML = quizStudyHtml(); updateStudySummary(); return; }
  if (_quizMode === 'result') { pane.innerHTML = quizResultHtml(); return; }

// Chip bật/tắt. Nhãn KHÔNG kèm “: Bật/Tắt” nữa — hai chip này phải nằm chung một
// hàng ở khung nhìn 311px (chỗ trống 266px), mà “Đảo câu hỏi: Bật” + “Đảo đáp
// án: Bật” cần 309px. Trạng thái hiện bằng MÀU (chip đang bật có nền xanh, viền
// và chữ xanh) và ghi rõ ở `title` để vẫn tra được khi trỏ chuột.
function quizToggleHtml(key, label) {
  const on = !!_quizOpts[key];
  return `<button class="quiz-toggle chip${on ? ' on' : ''}" onclick="toggleQuizOpt('${key}')"`
    + ` title="${label}: đang ${on ? 'BẬT' : 'TẮT'} — bấm để ${on ? 'tắt' : 'bật'}">${label}</button>`;
}
function toggleQuizOpt(k) { _quizOpts[k] = !_quizOpts[k]; renderQuiz(); }

// Một ô trong hàng 2×2: ô ĐANG được chọn dùng kiểu xanh (.primary), các ô còn lại kiểu
// viền. Hai kiểu cùng cỡ nên đổi màu KHÔNG làm nút nhảy kích thước.
function setActBtn(setId, key, label, title, off) {
  const on = isSetActOn(setId, key);
  return '<button class="quiz-btn' + (on ? ' primary' : '') + '" data-set-act="' + key + '"'
    + (off || '')
    + ' onclick="useSetAct(\'' + setId + '\',\'' + key + '\')"'
    + (title ? ' title="' + title + '"' : '')
    + (on ? ' aria-current="true"' : '') + '>' + label + '</button>';
}

// Ghi nhớ ô vừa bấm RỒI mới chạy hành động của ô đó: hành động mở màn khác nên không
// kịp vẽ lại hàng nút, màu sẽ đúng ngay khi quay về trang chủ.
function useSetAct(setId, key) {
  if (!SET_ACTS[key]) return;
  _setActSel = { setId: setId, key: key };
  saveSetAct();
  if (key === 'browse') openBrowse(setId);
  else startSetExam(setId, key);
}

// Xem / sửa câu hỏi của một bộ đề
function quizBrowseHtml() {
  const s = curSet();
  if (!s) { _quizMode = 'home'; return quizHomeHtml(); }
  const n = s.questions.length;
  let h = '<div class="quiz-card">';
  h += `<div style="font-size:17px;font-weight:500;line-height:1.35" title="${esc(s.name)}">`
    + `<span class="set-name">${esc(s.name)}</span></div>`;
  h += `<div style="font-size:15px;font-weight:400;color:var(--text-dim);margin:4px 0 12px">${n} câu hỏi</div>`;
  h += '<div style="display:flex;gap:8px;flex-wrap:wrap">';
  h += `<button class="quiz-btn primary"${n ? '' : ' disabled'} onclick="startSetExam('${s.id}','single')">▶️ Thi từng câu</button>`;
  h += `<button class="quiz-btn"${n ? '' : ' disabled'} onclick="startSetExam('${s.id}','all')">📋 Thi cả bộ</button>`;
  h += `<button class="quiz-btn"${n ? '' : ' disabled'} onclick="startSetExam('${s.id}','study')">📖 Học (chọn sai làm lại)</button>`;
  h += '</div>';
  h += '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">';
  h += '<button class="quiz-btn" onclick="backHome()">← Về trang chủ</button>';
  h += '</div></div>';

  if (!n) {
    h += '<div class="quiz-card" style="text-align:center;color:var(--text-dim);font-size:15px;line-height:1.6">Bộ đề này chưa có câu hỏi.<br>Mở 📦 để nạp lại file cho bộ này.</div>';
    return h;
  }

  h += '<div class="quiz-card">';
  h += '<div style="font-size:17px;font-weight:500;margin-bottom:10px">Danh sách câu hỏi</div>';
  s.questions.forEach((q, i) => {
    h += '<div style="border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px">';
    h += `<div style="font-size:16px;font-weight:600;line-height:1.5">${i + 1}. ${esc(q.q)}</div>`;
    h += `<div style="font-size:15px;color:var(--green);margin-top:6px;font-weight:400">✓ ${esc(q.options[q.correct] || '—')}</div>`;
    h += '</div>';
  });
  h += '</div>';
  return h;
}

// ── TRỘN ĐỀ THEO TỶ LỆ ──
function clampPct(v) {
  if (typeof v !== 'number' || !isFinite(v)) return 0;
  return Math.max(0, Math.min(100, Math.round(v)));
}
function pctOf(id) { return clampPct(_mix.pct[id]); }

function mixTotalValue() {
  const available = Math.max(1, totalQuestions());
  let t = parseInt(_mix.total, 10);
  if (!(t > 0)) t = Math.min(MIX_DEFAULT_TOTAL, available);
  return Math.min(t, available);
}

// Chia số câu cho từng bộ theo tỷ lệ, dùng phương pháp "phần dư lớn nhất"
function mixRows() {
  const total = mixTotalValue();
  const rows = quizLib.map(s => ({ s: s, pct: pctOf(s.id) }));
  const sum = rows.reduce((a, r) => a + r.pct, 0);
  const raw = rows.map(r => sum > 0 ? (r.pct / 100) * total : 0);
  const counts = raw.map(v => Math.floor(v));
  let left = sum === 100 ? total - counts.reduce((a, b) => a + b, 0) : 0;
  const order = raw.map((v, i) => ({ i: i, frac: v - Math.floor(v) })).sort((a, b) => b.frac - a.frac);
  let k = 0;
  while (left > 0 && order.length) { counts[order[k % order.length].i]++; left--; k++; }
  return rows.map((r, i) => ({
    set: r.s, pct: r.pct, want: counts[i],
    got: Math.min(counts[i], r.s.questions.length)
  }));
}

// Cột số câu của bảng trộn: "lấy bao nhiêu / bộ có bao nhiêu" (yêu cầu 19/9/2026:
// "thêm tổng số câu phía sau, ví dụ 7/20 câu").
// Luôn đủ CẢ HAI đầu để đọc ra ngay mức độ phủ — "7/10" nói ngay là bộ chỉ có 10 câu.
// Dấu "/" ở đây CHỈ có một nghĩa (lấy/tổng); chuyện THIẾU câu không nhét vào cột này nữa mà
// do dòng cảnh báo nói rõ ("cần 12 nhưng bộ chỉ có 10"), trước đây cột dùng "/" cho cả hai
// nghĩa nên "10/12" vừa là lấy/tổng vừa là lấy/cần — không đọc được.
function mixCountText(r) {
  return r.got + '/' + r.set.questions.length + ' câu';
}

// ── LƯU / KHÔI PHỤC TỶ LỆ TRỘN VÀO MÁY ──
// Yêu cầu 19/9/2026: "Lưu tỷ lệ trộn đề mà tôi tự chỉnh vào máy, để mở app lần sau vẫn
// giữ đúng tỷ lệ đó."
//
// File lưu có BỐN trường, và trường `keyed` mới là trường quan trọng:
//   total : tổng số câu của bài
//   sig   : id các bộ theo đúng thứ tự thư viện — "dấu vân tay" để biết thư viện còn
//           Y HỆT lần lưu hay không
//   pct   : { setId: phần trăm } — dùng khi sig khớp
//   keyed : [[khoá tên, phần trăm]] — dùng khi sig KHÁC (nạp thêm bộ, xoá bộ, hoặc phục
//           hồi từ file .json làm MỌI id đổi mới). Nếu chỉ lưu theo id thì mỗi lần phục
//           hồi file là tỷ lệ chỉnh tay mất sạch — mà đây lại là thao tác người dùng làm
//           nhiều lần trong ngày (3 lần trong phiên 19/9).
// Khoá tên dùng quizKey() nên khớp được cả khi tên có gạch dưới/khoảng trắng khác nhau;
// hai bộ TRÙNG tên thì dòng sau thắng — chấp nhận, vì chúng cũng trùng số câu.
function saveMix() {
  try {
    localStorage.setItem(MIX_KEY, JSON.stringify({
      total: _mix.total,
      sig: quizLib.map(s => s.id).join(','),
      pct: _mix.pct,
      keyed: quizLib.map(s => [quizKey(s.name), pctOf(s.id)])
    }));
  } catch (e) {}
}

// Trả về true nếu đọc lại được tỷ lệ đã lưu (false = giữ nguyên mặc định).
// LUÔN gọi SAU resetMixDefaults(), vì đường ghép theo tên dựa vào mặc định cho những bộ
// không có trong file lưu.
function restoreMix() {
  if (!quizLib.length) return false;
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(MIX_KEY) || 'null'); } catch (e) { saved = null; }
  if (!saved || typeof saved !== 'object') return false;
  const t = parseInt(saved.total, 10);
  if (t > 0) _mix.total = Math.min(t, Math.max(1, totalQuestions()));
  // Nhánh 1 — thư viện không đổi: dùng thẳng id, không suy diễn gì thêm, và CHỈ nhận id
  // còn tồn tại (bộ đã xoá thì mục của nó bị bỏ, không hồi sinh số 0 lạ).
  if (saved.pct && saved.sig === quizLib.map(s => s.id).join(',')) {
    _mix.pct = {};
    quizLib.forEach(s => { _mix.pct[s.id] = clampPct(saved.pct[s.id]); });
    return true;
  }
  // Nhánh 2 — thư viện đã đổi: ghép lại theo TÊN. Bộ khớp giữ đúng số người dùng đặt,
  // bộ mới/không khớp giữ mặc định vừa tính, rồi cân cả bảng về 100.
  if (!Array.isArray(saved.keyed)) return false;
  const byKey = {};
  saved.keyed.forEach(function (row) {
    if (Array.isArray(row) && row.length === 2) byKey[row[0]] = row[1];
  });
  let hit = 0;
  quizLib.forEach(s => {
    const k = quizKey(s.name);
    if (k in byKey) { _mix.pct[s.id] = clampPct(byKey[k]); hit++; }
  });
  if (!hit) return false;   // thư viện hoàn toàn khác → để mặc định, đừng bịa số
  balanceMixTo100();
  return true;
}

// Cân lại _mix.pct cho tổng đúng 100, GIỮ NGUYÊN tỷ lệ tương đối. Dùng ở nhánh ghép-theo-tên
// và ở chỗ tự chia lại khi một bộ về 0.
//
// Chia phần lẻ theo "SỐ DƯ LỚN NHẤT" (đúng cách mixRows() chia câu): lấy phần nguyên trước,
// rồi mỗi hàng có phần lẻ lớn nhất nhận thêm 1 — mỗi hàng NHIỀU NHẤT 1 điểm.
// Đừng quay lại cách cũ (Math.round từng hàng rồi dồn hết phần lệch vào hàng lớn nhất):
// với 18 bộ, làm tròn sinh tổng lệch tới 3 điểm, dồn hết vào một hàng làm bộ ghim 10% tụt
// còn 8% trong khi các hàng khác lại tăng — đo được đúng như vậy ngày 19/9/2026.
// Hàng đang 0% KHÔNG bao giờ nhận điểm: chúng bị loại khỏi danh sách chia phần lẻ, nếu không
// một bộ đang bị loại (ví dụ Bậc 6-7) có thể thành 1%.
function balanceMixTo100() {
  const ids = quizLib.map(s => s.id);
  if (!ids.length) return;
  const cur = ids.map(id => pctOf(id));
  const sum = cur.reduce((a, v) => a + v, 0);
  if (sum === 100) return;
  if (sum <= 0) { Object.assign(_mix.pct, splitPctEven(ids, 100)); return; }
  const raw = cur.map(v => v * 100 / sum);
  const out = raw.map(v => Math.floor(v));
  let left = 100 - out.reduce((a, v) => a + v, 0);
  const order = raw
    .map((v, i) => ({ i: i, frac: v - Math.floor(v), live: cur[i] > 0 }))
    .filter(x => x.live)
    .sort((a, b) => b.frac - a.frac);
  let k = 0;
  while (left > 0 && k < order.length) { out[order[k].i]++; left--; k++; }
  // Chốt an toàn cho trường hợp bất thường (số âm / NaN): dồn nốt vào hàng lớn nhất.
  if (left) {
    let big = 0;
    out.forEach((v, i) => { if (v > out[big]) big = i; });
    out[big] = Math.max(0, out[big] + left);
  }
  ids.forEach((id, i) => { _mix.pct[id] = Math.max(0, out[i]); });
}

// Nút "↺ Mặc định": quên tỷ lệ chỉnh tay, VỀ mặc định của app trong mã, và ghi luôn mặc
// định đó vào máy — nếu không thì lần mở sau tỷ lệ cũ lại quay về.
function resetMixToDefaults() {
  resetMixDefaults();
  saveMix();
  renderQuiz();
}

// Gọi mỗi khi THƯ VIỆN đổi (nạp file, xoá bộ, phục hồi). Tính lại mặc định rồi ghép tỷ lệ
// đã lưu lên trên: nạp thêm bộ không làm mất công chỉnh tay, mà bộ mới vẫn được chia phần.
function refreshMix() { resetMixDefaults(); restoreMix(); }

// ── SEARCH ────────────────────────────────────────────────
// Tìm kiếm câu hỏi theo nội dung. Hiển thị câu hỏi + đáp án đúng.
function onSearch() {
  const q = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
  const el = document.getElementById('searchResults');
  if (!el) return;
  if (!q || q.length < 2) { el.innerHTML = ''; return; }
  const hits = [];
  for (const s of quizLib) {
    for (const qu of s.questions) {
      const txt = qu.q.toLowerCase();
      const opts = (qu.options || []).join(' ').toLowerCase();
      if (txt.includes(q) || opts.includes(q)) {
        hits.push({ set: s.name, q: qu.q, options: qu.options, correct: qu.correct, explain: qu.explain || '' });
        if (hits.length >= 50) break;   // giới hạn 50 kết quả cho nhanh
      }
    }
    if (hits.length >= 50) break;
  }
  if (!hits.length) {
    el.innerHTML = '<div class="search-empty">Không tìm thấy kết quả.</div>';
    return;
  }
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  el.innerHTML = hits.map(h => {
    const qHtml = h.q.replace(re, '<em>$1</em>');
    // tìm đáp án đúng
    const correctText = Array.isArray(h.correct)
      ? h.correct.map(i => h.options[i]).join(', ')
      : (h.options[h.correct] || '');
    const aHtml = correctText.replace(re, '<em>$1</em>');
    return '<div class="search-hit">'
      + '<div class="search-hit-set">' + esc(h.set) + '</div>'
      + '<div class="search-hit-q">' + qHtml + '</div>'
      + '<div class="search-hit-a">✅ ' + aHtml + '</div>'
      + '</div>';
  }).join('');
}

function quizMixHtml() {
  const rows = mixRows();
  const pctSum = rows.reduce((a, r) => a + r.pct, 0);
  const ok = pctSum === 100 && rows.some(r => r.got > 0);
  let h = '<div class="quiz-card">';
  h += '<div style="font-size:17px;font-weight:500">🎲 Trộn đề theo tỷ lệ</div>';
  h += '<div style="font-size:15px;font-weight:400;color:var(--text-dim);margin:2px 0 12px">Đặt phần trăm cho từng bộ; tổng phải đúng 100%.</div>';
  h += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">';
  h += '<div style="flex:1;font-size:15px;font-weight:400">Tổng số câu của bài</div>';
  // Ô nhập trong bảng trộn để cỡ 15px cho BẰNG các chữ xung quanh (yêu cầu 19/9/2026).
  // Cố ý KHÔNG hạ .quiz-input xuống 15px: lớp đó còn dùng cho ô đổi tên bộ đề ở bảng 📦
  // (ô nhập tên là chữ chính, phải giữ 17px/500). Chỉ hai ô của bảng trộn hạ cỡ.
  h += `<input id="mixTotal" type="number" min="1" max="${Math.max(1, totalQuestions())}" class="quiz-input" style="width:88px;text-align:center;font-size:15px" value="${mixTotalValue()}" oninput="onMixInput()">`;
  h += '</div>';
  rows.forEach(r => {
    h += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">';
    h += `<div style="flex:1;min-width:0;font-size:15px;font-weight:400;line-height:1.35;white-space:normal" title="${esc(r.set.name)}"><span class="mix-name">${esc(r.set.name)}</span></div>`;
    h += `<input id="mixPct-${r.set.id}" type="number" min="0" max="100" class="quiz-input mix-input" value="${r.pct}" oninput="onMixTyped()" onchange="onMixCommit('${r.set.id}')" onblur="onMixCommit('${r.set.id}')">`;
    // Đè ngón tay là tự lặp (xem mixStepStart): đổi 0 → 15 bằng một lần giữ, khỏi bấm 15 lần.
    h += `<div class="mix-step">`;
    h += `<button type="button" title="Tăng 1%" aria-label="Tăng 1%" onpointerdown="mixStepStart(event,'${r.set.id}',1)" onpointerup="mixStepEnd()" onpointerleave="mixStepEnd()" onpointercancel="mixStepEnd()">▲</button>`;
    h += `<button type="button" title="Giảm 1%" aria-label="Giảm 1%" onpointerdown="mixStepStart(event,'${r.set.id}',-1)" onpointerup="mixStepEnd()" onpointerleave="mixStepEnd()" onpointercancel="mixStepEnd()">▼</button>`;
    h += `</div>`;
    // Dấu `%` đã bỏ (19/9/2026 — "bỏ dấu %"). Nghĩa của cột số đã rõ nhờ dòng phụ "Đặt phần trăm
    // cho từng bộ" và dòng tổng "Tổng tỷ lệ: 100%"; bỏ đi trả lại ~23px cho cột tên bộ đề.
    h += `<div id="mixCnt-${r.set.id}" style="width:84px;text-align:right;font-size:15px;font-weight:400;color:var(--text-dim)">${mixCountText(r)}</div>`;
    h += '</div>';
  });
  h += '<div style="display:flex;align-items:center;gap:8px;margin-top:10px">';
  h += '<div id="mixSum" style="flex:1;font-size:15px;font-weight:400"></div>';
  h += '<button class="mix-reset" onclick="resetMixToDefaults()" title="Về tỷ lệ mặc định của app">↺ Mặc định</button>';
  h += '</div>';
  h += '<div id="mixWarn" style="font-size:15px;font-weight:400;color:var(--gold);margin-top:4px"></div>';
  h += '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">';
  h += `<button id="mixBtnSingle" class="big-upload-btn" style="width:100%" onclick="mixExam('single')">🎲 Trộn &amp; thi từng câu</button>`;
  h += `<button id="mixBtnAll" class="quiz-btn" onclick="mixExam('all')">📋 Trộn &amp; làm cả bộ</button>`;
  h += `<button id="mixBtnStudy" class="quiz-btn" onclick="mixExam('study')">📖 Trộn &amp; học</button>`;
  h += '</div></div>';
  return h;
}

// Chỉ vẽ lại phần số câu + tổng + trạng thái nút, để ô nhập không mất con trỏ
function paintMix() {
  const rows = mixRows();
  const pctSum = rows.reduce((a, r) => a + r.pct, 0);
  const ok = pctSum === 100 && rows.some(r => r.got > 0);
  const sumEl = document.getElementById('mixSum');
  if (sumEl) {
    sumEl.textContent = 'Tổng tỷ lệ: ' + pctSum + '%' + (pctSum === 100 ? ' ✓' : ' — cần đúng 100%');
    sumEl.style.color = pctSum === 100 ? 'var(--green)' : 'var(--red)';
  }
  rows.forEach(r => {
    const el = document.getElementById('mixCnt-' + r.set.id);
    if (!el) return;
    el.textContent = mixCountText(r);
    el.style.color = (r.want === r.got) ? 'var(--text-dim)' : 'var(--gold)';
  });
  const short = rows.filter(r => r.want > r.got);
  const warnEl = document.getElementById('mixWarn');
  if (warnEl) {
    warnEl.textContent = short.length
      ? 'Không đủ câu: ' + short.map(r => r.set.name + ' cần ' + r.want + ' nhưng bộ chỉ có ' + r.set.questions.length + ' câu').join(', ')
      : '';
  }
  ['mixBtnSingle', 'mixBtnAll', 'mixBtnStudy'].forEach(id => {
    const b = document.getElementById(id);
    if (b) b.disabled = !ok;
  });
}

function onMixInput() {
  const t = document.getElementById('mixTotal');
  if (t) _mix.total = Math.max(1, Math.min(parseInt(t.value, 10) || 1, Math.max(1, totalQuestions())));
  quizLib.forEach(s => {
    const el = document.getElementById('mixPct-' + s.id);
    if (el) _mix.pct[s.id] = clampPct(parseInt(el.value, 10));
  });
  paintMix();
  // Ghi vào máy NGAY mỗi lần gõ, không chờ rời ô hay đóng app: người dùng thường chỉnh
  // vài ô rồi đóng luôn, và một lần ghi ~1KB là không đáng kể. Cũng KHÔNG cần chờ tổng
  // đúng 100 — tỷ lệ dở dang (ví dụ 95%) vẫn phải được nhớ đúng như nó đang là.
  saveMix();
}

// Chờ người dùng NGỪNG GÕ rồi mới chia lại (19/9/2026 — lỗi báo từ ĐIỆN THOẠI: "khi chỉnh số
// tỷ lệ tăng giảm thì các bộ đề khác không tự chia"). Nguyên nhân: trên Android, nút "ẩn bàn
// phím" KHÔNG làm ô mất tiêu điểm, mà change chỉ chạy khi RỜI Ô — nên bảng đứng im dù người
// dùng đã sửa xong. Hẹn giờ thì không phụ thuộc vào việc ô có mất tiêu điểm hay không.
// Gõ "0" rồi "5" vẫn an toàn: mỗi nhịp gõ đều đặt lại đồng hồ, và nếu có chia sớm thì lần chốt
// cuối vẫn ghim ĐÚNG số cuối cùng của dòng đó rồi chia lại phần còn lại (luật ở rebalanceAround).
const MIX_COMMIT_DELAY_MS = 700;
let _mixCommitTimer = null;

function onMixTyped() {
  onMixInput();                                  // đọc + ghi vào máy NGAY như cũ
  clearTimeout(_mixCommitTimer);
  _mixCommitTimer = setTimeout(function () {
    _mixCommitTimer = null;
    const el = document.activeElement;
    const id = (el && el.id && el.id.indexOf('mixPct-') === 0) ? el.id.slice(7) : null;
    onMixCommit(id);                             // id rỗng = chỉ vẽ lại, không chia
  }, MIX_COMMIT_DELAY_MS);
}

// Cặp nút ▲▼ cạnh ô phần trăm. Mỗi cú chạm CHỐT LUÔN (không chờ rời ô) — đây cũng là đường
// chắc chắn nhất trên điện thoại, vì cú chạm là sự kiện không trình duyệt nào bỏ qua.
// Đè ngón tay thì tự lặp 160ms/nhịp, nên 0 → 15 chỉ cần một lần giữ.
let _mixStepTimer = null;

function mixStep(id, delta) {
  const el = document.getElementById('mixPct-' + id);
  if (!el) return;
  const typed = parseInt(el.value, 10);
  const base = isFinite(typed) ? typed : pctOf(id);
  const next = Math.max(0, Math.min(100, base + delta));
  if (next === base) return;             // đã chạm trần/sàn → không làm gì
  el.value = next;                       // ghi vào Ô trước: onMixCommit đọc lại từ các ô
  onMixCommit(id);
}

function mixStepStart(ev, id, delta) {
  ev.preventDefault();                   // đừng để nút chiếm tiêu điểm hay bắn thêm click
  clearInterval(_mixStepTimer);
  mixStep(id, delta);
  _mixStepTimer = setInterval(function () { mixStep(id, delta); }, 160);
}

function mixStepEnd() { clearInterval(_mixStepTimer); _mixStepTimer = null; }

function mixFocusedId() {
  const el = document.activeElement;
  return (el && el.id && el.id.indexOf('mixPct-') === 0) ? el.id.slice(7) : null;
}

// Đường dự phòng thứ ba: người dùng gõ xong rồi CHẠM ra chỗ khác. Có trình duyệt điện thoại
// không bắn change (và đôi khi cả blur) cho ô số, nên cú chạm đó cũng phải chốt số. Chỉ chốt
// khi ô tỷ lệ đang giữ tiêu điểm VÀ cú chạm KHÔNG rơi vào chính ô đó (chạm vào ô là để sửa tiếp).
document.addEventListener('pointerup', function (ev) {
  const id = mixFocusedId();
  if (!id) return;
  if (ev.target && ev.target.id === 'mixPct-' + id) return;
  onMixCommit(id);
});

// Ghi _mix.pct trở lại các Ô NHẬP. Cần riêng hàm này vì paintMix() chỉ vẽ cột số câu,
// không động vào giá trị trong ô — sau khi tự chia lại mà không ghi lại thì màn hình vẫn
// hiện số CŨ dù bảng đã tính theo số MỚI.
function syncMixInputs() {
  quizLib.forEach(s => {
    const el = document.getElementById('mixPct-' + s.id);
    if (el) el.value = pctOf(s.id);
  });
}

// Trọng số của một bộ khi chia phần tăng/giảm: số câu hỏi bộ đó có (hoặc phần trăm đang
// đặt, nếu MIX_REBALANCE_BY = 'share').
function mixWeight(s) {
  return MIX_REBALANCE_BY === 'share'
    ? Math.max(0, pctOf(s.id))
    : Math.max(0, (s.questions || []).length);
}

// Chia `amount` điểm cho danh sách theo TRỌNG SỐ, trả về mảng số nguyên tổng đúng bằng
// `amount` — cùng phương pháp "số dư lớn nhất" với mixRows()/balanceMixTo100().
function splitByWeight(list, amount) {
  const out = list.map(() => 0);
  if (amount <= 0 || !list.length) return out;
  const totalW = list.reduce((a, s) => a + mixWeight(s), 0);
  if (totalW <= 0) return out;   // mọi trọng số = 0 (bộ không có câu nào) → chia được gì thì chia
  const raw = list.map(s => amount * mixWeight(s) / totalW);
  raw.forEach((v, i) => { out[i] = Math.floor(v); });
  let left = amount - out.reduce((a, v) => a + v, 0);
  const order = raw.map((v, i) => ({ i: i, frac: v - Math.floor(v) }))
    .sort((a, b) => b.frac - a.frac);
  let k = 0;
  while (left > 0 && k < order.length) { out[order[k].i]++; left--; k++; }
  return out;
}

// Lấy bớt `amount` điểm khỏi danh sách, KHÔNG để bộ nào xuống dưới 0. Bộ nào không đủ để
// nhường thì nhường hết phần mình có, phần còn thiếu chia tiếp cho các bộ khác — nên bộ
// nhỏ không bao giờ bị đẩy thành số âm (tổng sẽ sai ngay nếu có số âm).
function takeFromSets(list, amount) {
  let left = amount, guard = 0;
  while (left > 0 && guard++ < 30) {
    const live = list.filter(s => pctOf(s.id) > 0);
    if (!live.length) break;
    const step = splitByWeight(live, left);
    let taken = 0;
    live.forEach((s, i) => {
      const take = Math.min(step[i], pctOf(s.id));
      _mix.pct[s.id] = pctOf(s.id) - take;
      taken += take;
    });
    if (!taken) break;               // không lấy được gì nữa → thoát, đừng lặp vô hạn
    left -= taken;
  }
  return left === 0;
}

// Cân lại quanh bộ vừa được sửa: giữ ĐÚNG giá trị người dùng vừa nhập cho bộ đó, rồi
// - nếu tổng đang thiếu (bộ kia bị TĂNG): lấy bớt từ các bộ còn lại
// - nếu tổng đang thừa (bộ kia bị GIẢM): chia thêm cho các bộ còn lại
// theo trọng số mixWeight() — mặc định là số câu hỏi của từng bộ.
// Bộ đang 0% KHÔNG được nhận thêm: đang 0% nghĩa là "bộ này không lấy câu nào", nhất quán
// với luật nhập 0 ở dưới.
function rebalanceAround(id) {
  const others = quizLib.filter(s => s.id !== id);
  const have = others.reduce((a, s) => a + pctOf(s.id), 0);
  const diff = (100 - pctOf(id)) - have;      // >0 các bộ khác phải tăng, <0 phải giảm
  if (diff === 0) return false;
  if (diff < 0) return takeFromSets(others, -diff);
  const live = others.filter(s => pctOf(s.id) > 0);
  if (!live.length) return false;             // không còn ai để nhận → để nguyên, cảnh báo lo
  const add = splitByWeight(live, diff);
  live.forEach((s, i) => { _mix.pct[s.id] = pctOf(s.id) + add[i]; });
  return true;
}

// Chạy khi RỜI Ô (hoặc Enter) — cố ý KHÔNG chạy ở sự kiện input: gõ "0" hay "1" có thể chỉ
// là bước trung gian khi sửa 15 → 0 rồi 5, chạy ngay lúc đó thì bảng đã chia lại xong mới
// nhận nốt chữ số và tổng vọt lên quá 100. Ở sự kiện change thì giá trị đã chốt.
function onMixCommit(id) {
  onMixInput();                                   // đọc lại hết các ô trước khi tính
  if (!id) { paintMix(); return; }
  if (!rebalanceAround(id)) { paintMix(); return; }
  syncMixInputs();
  paintMix();
  saveMix();                                      // số mới là số phải nhớ, không phải số cũ
}

// Nhóm "mặc định 0%": bộ KHÔNG được lấy câu khi trộn (người dùng vẫn tự nâng phần
// trăm lên được nếu muốn). So khớp theo "chỉ chữ và số" nên "Bậc 6-7", "Bậc6_7",
// "KT điện cho CNKD-Bậc6_7" đều khớp, còn "Bậc7_7" thì không (…bac77).
function isZeroSet(name) {
  const k = quizKey(name).replace(/[^a-z0-9]/g, '');
  return ZERO_SET_KEYS.some(w => k.indexOf(w) >= 0);
}

// Trả về số phần trăm CỐ ĐỊNH của bộ, hoặc null nếu bộ không thuộc nhóm nào.
// Dùng cùng cách so khớp "chỉ chữ và số" như isZeroSet.
function fixedPctFor(name) {
  const k = quizKey(name).replace(/[^a-z0-9]/g, '');
  const hit = FIXED_SET_PCT.find(function (row) { return k.indexOf(row[0]) >= 0; });
  return hit ? hit[1] : null;
}

// Chia đều `budget` phần trăm cho danh sách id, tổng đúng bằng budget.
function splitPctEven(ids, budget) {
  const out = {};
  if (!ids.length) return out;
  const base = Math.floor(budget / ids.length);
  let left = budget - base * ids.length;
  ids.forEach(id => { out[id] = base + (left-- > 0 ? 1 : 0); });
  return out;
}

// Tỷ lệ mặc định chia làm BA nhóm, xét theo thứ tự:
//   1. cố định (FIXED_SET_PCT)  → mỗi bộ đúng số câu của nó (8/7/5/10/3/7 = 40 câu)
//   2. 0% (ZERO_SET_KEYS)       → không lấy câu nào (bậc 6-7)
//   3. còn lại                  → chia đều 100 - 40 = 60 câu
// Bộ nào bị ĐỔI TÊN đến mất khoá thì tự rơi xuống nhóm chia đều — không vỡ app.
function resetMixDefaults() {
  _mix.total = Math.min(MIX_DEFAULT_TOTAL, Math.max(1, totalQuestions()));
  _mix.pct = {};
  if (!quizLib.length) return;
  let fixed = [];        // [{ s, pct }]
  const zero = [];
  let rest = [];
  quizLib.forEach(s => {
    const f = fixedPctFor(s.name);
    if (f !== null) { fixed.push({ s: s, pct: f }); return; }
    if (isZeroSet(s.name)) { zero.push(s); return; }
    rest.push(s);
  });
  let fixedBudget = fixed.reduce((a, x) => a + x.pct, 0);
  // Chốt an toàn: nếu người dùng đổi tên nhiều bộ trùng khoá cố định đến mức tổng
  // vượt 100 thì cắt nhóm cố định lại, để phần chia đều không bị âm (số âm sẽ làm
  // splitPctEven chia ra số vô lý và nút trộn bị khoá).
  if (fixedBudget > 100) fixedBudget = 100;
  // Nhóm cố định và nhóm 0% nhận phần của mình — nhưng nếu KHÔNG còn bộ nào nhận
  // phần chia đều (thư viện chỉ có bộ cố định và bộ 0%) thì phần đó phải trả về cho
  // một trong hai nhóm kia, nếu không tổng không đủ 100% và các nút trộn bị khoá.
  // Ưu tiên trả về cho nhóm 0%, rồi mới đến nhóm cố định.
  if (!rest.length) {
    if (zero.length) rest = zero;
    else if (fixed.length) { rest = fixed.map(x => x.s); fixed = []; fixedBudget = 0; }
  }
  // Nhóm cố định: mỗi bộ nhận ĐÚNG số của nó — không dùng splitPctEven vì sáu bộ
  // khác số nhau (8/7/5/10/3/7) mà chia đều thì thành 6/6/7/7/6/7. Nếu chốt an toàn
  // ở trên phải cắt thì cắt theo tỷ lệ và dồn phần lẻ vào bộ cuối để tổng vẫn đúng.
  const wantFixed = fixed.reduce((a, x) => a + x.pct, 0);
  const scale = wantFixed > fixedBudget ? fixedBudget / wantFixed : 1;
  let fixedSum = 0;
  fixed.forEach((x, i) => {
    const v = (i === fixed.length - 1) ? Math.max(0, fixedBudget - fixedSum) : Math.round(x.pct * scale);
    _mix.pct[x.s.id] = v;
    fixedSum += v;
  });
  const restBudget = Math.max(0, 100 - fixedSum);
  Object.assign(_mix.pct, splitPctEven(rest.map(s => s.id), restBudget));
  // Bộ mặc định 0% (khi không phải nhóm dự phòng ở trên) ghi rõ 0% cho dễ đọc code.
  zero.forEach(s => { if (!(s.id in _mix.pct)) _mix.pct[s.id] = 0; });
}

function backHome() {
  _libPending = null;
  _quizMode = 'home'; renderQuiz(); window.scrollTo(0, 0);
}
function openBrowse(setId) {
  _libSetId = setId; _libPending = null;
  _quizMode = 'browse'; renderQuiz(); window.scrollTo(0, 0);
}

// ── LÀM BÀI ──
// mode: 'single' = từng câu một | 'all' = mọi câu trên một màn
function startExam(questions, title, mode) {
  const list = (questions || []).filter(Boolean);
  if (!list.length) { alert('Chưa có câu hỏi nào.'); return; }
  const m = (mode === 'all' || mode === 'study') ? mode : 'single';
  const items = list.map(q => {
    const opts = q.options.map((t, i) => ({ t: t, ok: i === q.correct }));
    if (_quizOpts.shuffleA) shuffleArr(opts);
    return { q: q.q, explain: q.explain || '', opts: opts, chosen: null, done: false, tried: [], wrongFirst: false };
  });
  if (_quizOpts.shuffleQ) shuffleArr(items);
  _exam = { questions: list, title: title || '', mode: m };
  _quizState = { items: items, idx: 0, chosen: null, score: 0, wrong: [], title: _exam.title };
  _quizMode = m === 'all' ? 'playAll' : (m === 'study' ? 'study' : 'play');
  renderQuiz();
  window.scrollTo(0, 0);
}

function startSetExam(setId, mode) {
  const s = libSet(setId);
  if (!s || !s.questions.length) { alert('Bộ đề này chưa có câu hỏi.'); return; }
  _libSetId = s.id;
  startExam(s.questions, s.name, mode);   // tên đầy đủ — không còn rút gọn ở màn hẹp
}

function replayExam() { if (_exam) startExam(_exam.questions, _exam.title, _exam.mode); }

// Trộn đề: lấy ngẫu nhiên đúng số câu mỗi bộ phải đóng góp rồi xáo lại toàn bộ
function mixExam(mode) {
  const rows = mixRows();
  const picked = [];
  rows.forEach(r => {
    if (r.got <= 0) return;
    const pool = r.set.questions.slice();
    shuffleArr(pool);
    pool.slice(0, r.got).forEach(q => picked.push(q));
  });
  if (!picked.length) { alert('Tỷ lệ hiện tại không lấy được câu nào. Hãy tăng phần trăm cho ít nhất một bộ.'); return; }
  shuffleArr(picked);
  startExam(picked, '🎲 Trộn đề · ' + picked.length + ' câu', mode);
}

function answerQuiz(i) {
  const st = _quizState;
  if (!st || st.chosen !== null) return;
  const it = st.items[st.idx];
  if (!it || !it.opts[i]) return;
  st.chosen = i;
  const right = it.opts.find(o => o.ok);
  if (it.opts[i].ok) st.score++;
  else st.wrong.push({ q: it.q, chosen: it.opts[i].t, correct: right ? right.t : '—', explain: it.explain });
  renderQuiz();
}

function nextQuiz() {
  const st = _quizState;
  if (!st) return;
  st.idx++; st.chosen = null;
  renderQuiz(); window.scrollTo(0, 0);
}
function finishQuiz() { _quizMode = 'result'; renderQuiz(); window.scrollTo(0, 0); }
function quitQuiz() { _quizState = null; _quizMode = 'home'; renderQuiz(); window.scrollTo(0, 0); }

// Nút về trang chủ ở đầu mọi màn làm bài — để không phải cuộn xuống đáy mới thoát
// được (đề 30-60 câu thì nút “Thoát” ở đáy rất xa).
// Chữ câu hỏi kèm SỐ CÂU trong vòng tròn xanh ở đầu — dùng cho BA màn làm bài
// (từng câu, cả bộ, học). Dùng flex chứ không nối chuỗi số vào câu: nối chuỗi thì
// câu dài xuống dòng sẽ có dòng thứ hai thụt vào thẳng lề, lệch hẳn với dòng đầu;
// flex cho vòng tròn một cột riêng nên cả khối chữ thẳng hàng.
// KHÔNG dùng ở hai màn danh sách (👁 Câu hỏi và “Cần ôn lại”): ở đó mỗi câu đã có
// số “1.” đứng trước, thêm vòng tròn nữa thành rối.
function qTextHtml(text, extraStyle, num) {
  return '<div style="display:flex;gap:6px;align-items:flex-start;' + (extraStyle || '') + '">'
    + '<span class="q-num">' + num + '</span>'
    + '<div style="flex:1;min-width:0">' + text + '</div></div>';
}

function homeBtnHtml() {
  return '<button class="quiz-btn home-btn" onclick="quitQuiz()" title="Về trang chủ"'
    + ' aria-label="Về trang chủ">🏠</button>';
}

function quizPlayHtml() {
  const st = _quizState;
  if (!st || !st.items.length) return '<div class="quiz-card">Không có câu hỏi.</div>';
  const it = st.items[st.idx];
  const total = st.items.length;
  const answered = st.chosen !== null;
  const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
  let h = '<div class="quiz-card">';
  h += '<div class="head-row" style="margin-bottom:8px">';
  h += `<div style="flex:1;min-width:0;font-size:15px;font-weight:400;color:var(--text-dim);line-height:1.35">${st.title ? esc(st.title) : ''}</div>`;
  h += homeBtnHtml();
  h += '</div>';
  h += '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">';
  h += `<div style="font-size:15px;font-weight:400">Câu ${st.idx + 1}/${total}</div>`;
  h += `<div style="font-size:15px;font-weight:400;color:var(--text-dim)">Đúng: <b style="color:var(--green)">${st.score}</b></div>`;
  h += '</div>';
  h += `<div style="height:6px;background:var(--border);border-radius:3px;margin:8px 0 10px;overflow:hidden"><div style="height:100%;width:${Math.round(st.idx / total * 100)}%;background:var(--accent)"></div></div>`;
  h += qTextHtml(esc(it.q), 'font-size:16px;font-weight:600;line-height:1.5;margin-bottom:10px', st.idx + 1);
  it.opts.forEach((o, i) => {
    let cls = 'quiz-opt';
    if (answered) {
      if (o.ok) cls += ' correct';
      else if (i === st.chosen) cls += ' wrong';
    }
    h += `<button class="${cls}"${answered ? ' disabled' : ''} onclick="answerQuiz(${i})">`;
    h += `<span class="quiz-badge">${letters[i]}</span><span style="flex:1">${esc(o.t)}</span>`;
    if (answered && o.ok) h += '<span>✅</span>';
    else if (answered && i === st.chosen) h += '<span>❌</span>';
    h += '</button>';
  });
  if (answered) {
    const isRight = !!it.opts[st.chosen].ok;
    const rightOpt = it.opts.find(o => o.ok);
    h += '<div style="margin-top:6px;padding:11px;border-radius:10px;font-size:14px;line-height:1.55;' +
      (isRight ? 'background:rgba(16,185,129,0.14);border:1px solid var(--green)' : 'background:rgba(239,68,68,0.14);border:1px solid var(--red)') + '">';
    h += isRight ? '✅ <b>Chính xác!</b>' : '❌ <b>Chưa đúng.</b> Đáp án đúng: <b>' + esc(rightOpt ? rightOpt.t : '—') + '</b>';
    if (it.explain) h += '<div style="margin-top:6px;color:var(--text-dim)">💡 ' + esc(it.explain) + '</div>';
    h += '</div>';
    const last = st.idx === total - 1;
    h += `<button class="big-upload-btn" style="width:100%;margin-top:12px" onclick="${last ? 'finishQuiz()' : 'nextQuiz()'}">${last ? '🏁 Xem kết quả' : 'Câu tiếp →'}</button>`;
  }
  h += '</div>';
  h += '<div><button class="quiz-btn" onclick="quitQuiz()">Thoát bài làm</button></div>';
  return h;
}

function quizFeedbackHtml(it) {
  const isRight = !!it.opts[it.chosen].ok;
  const right = it.opts.find(o => o.ok);
  let s = isRight ? '✅ <b>Chính xác!</b>' : '❌ <b>Chưa đúng.</b> Đáp án đúng: <b>' + esc(right ? right.t : '—') + '</b>';
  if (it.explain) s += '<div style="margin-top:5px;color:var(--text-dim)">💡 ' + esc(it.explain) + '</div>';
  return s;
}

function quizAllHtml() {
  const st = _quizState;
  if (!st || !st.items.length) return '<div class="quiz-card">Không có câu hỏi.</div>';
  const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
  let h = '<div class="quiz-card quiz-all-head">';
  h += '<div class="head-row">';
  h += `<div style="flex:1;min-width:0;font-size:17px;font-weight:500">${st.title ? esc(st.title) : '📋 Cả bộ đề'} · ${st.items.length} câu</div>`;
  h += homeBtnHtml();
  h += '</div>';
  h += '<div id="allSummary" style="font-size:15px;font-weight:400;color:var(--text-dim);margin-top:3px"></div>';
  h += '</div>';

  st.items.forEach((it, qi) => {
    const done = it.chosen !== null;
    const isRight = done && !!it.opts[it.chosen].ok;
    h += `<div class="quiz-card" id="qb-${qi}">`;
    h += qTextHtml(esc(it.q), 'font-size:16px;font-weight:600;line-height:1.5;margin-bottom:8px', qi + 1);
    it.opts.forEach((o, oi) => {
      let cls = 'quiz-opt';
      let mark = '';
      if (done) {
        if (o.ok) { cls += ' correct'; mark = '<span class="mark">✅</span>'; }
        else if (oi === it.chosen) { cls += ' wrong'; mark = '<span class="mark">❌</span>'; }
      }
      h += `<button class="${cls}" id="qo-${qi}-${oi}"${done ? ' disabled' : ''} onclick="answerAll(${qi},${oi})">`;
      h += `<span class="quiz-badge">${letters[oi]}</span><span style="flex:1">${esc(o.t)}</span>${mark}`;
      h += '</button>';
    });
    h += `<div class="quiz-fb${done ? ' show ' + (isRight ? 'ok' : 'no') : ''}" id="qfb-${qi}">${done ? quizFeedbackHtml(it) : ''}</div>`;
    h += '</div>';
  });

  h += '<div class="quiz-card" style="text-align:center">';
  h += '<button class="big-upload-btn" style="width:100%" onclick="finishQuiz()">🏁 Xem kết quả</button>';
  h += '<div style="margin-top:8px"><button class="quiz-btn" onclick="quitQuiz()">Thoát bài làm</button></div>';
  h += '</div>';
  return h;
}

function updateAllSummary() {
  const st = _quizState;
  const el = document.getElementById('allSummary');
  if (!st || !el) return;
  const done = st.items.filter(x => x.chosen !== null).length;
  el.innerHTML = `Đã trả lời <b>${done}</b>/${st.items.length} · ` +
    `Đúng <b style="color:var(--green)">${st.score}</b> · ` +
    `Sai <b style="color:var(--red)">${st.wrong.length}</b>`;
}

function answerAll(qi, oi) {
  const st = _quizState;
  if (!st) return;
  const it = st.items[qi];
  if (!it || it.chosen !== null || !it.opts[oi]) return;
  it.chosen = oi;
  const right = it.opts.find(o => o.ok);
  const isRight = !!it.opts[oi].ok;
  if (isRight) st.score++;
  else st.wrong.push({ q: it.q, chosen: it.opts[oi].t, correct: right ? right.t : '—', explain: it.explain });

  // Cập nhật tại chỗ thay vì render lại cả danh sách, để không mất vị trí cuộn
  it.opts.forEach((o, i) => {
    const btn = document.getElementById('qo-' + qi + '-' + i);
    if (!btn) return;
    btn.disabled = true;
    if (o.ok) { btn.classList.add('correct'); btn.insertAdjacentHTML('beforeend', '<span class="mark">✅</span>'); }
    else if (i === oi) { btn.classList.add('wrong'); btn.insertAdjacentHTML('beforeend', '<span class="mark">❌</span>'); }
  });
  const fb = document.getElementById('qfb-' + qi);
  if (fb) { fb.className = 'quiz-fb show ' + (isRight ? 'ok' : 'no'); fb.innerHTML = quizFeedbackHtml(it); }
  updateAllSummary();
}
